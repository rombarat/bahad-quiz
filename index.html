<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בוחן בה״ד 1</title>
<meta name="description" content="תרגול שאלות לקראת בה״ד 1: סבבים קצרים, בחינה חוזרת והסבר אחרי כל תשובה.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#58702a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="בוחן בה״ד">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: app shell — home (topic medallions) → lesson (top progress, question, fixed answer footer) → lesson-complete */
:root{
  --bg:#f6f5ef; --surface:#ffffff; --fg:#1c2117; --muted:#6a7160; --line:#dedcd0; --line-deep:#c9c6b6;
  --accent:#58702a; --accent-deep:#3f5219; --accent-soft:#eaf0d8;
  --sel:#3b82c4; --sel-soft:#e4f0fb;
  --good:#3c9a3f; --good-deep:#2b7a2e; --good-soft:#d9f2d4; --good-ink:#1f5e22;
  --bad:#d9443a; --bad-deep:#ae2f27; --bad-soft:#fde0dc; --bad-ink:#8f231c;
  --fire:#f2a01c; --fire-deep:#c87a00; --gold:#f5c33b;
  --display:"Rubik","Arial Hebrew",sans-serif; --body:"Assistant","Arial",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12150f; --surface:#1b1f17; --fg:#eceee4; --muted:#9ba290; --line:#30362a; --line-deep:#252a20;
  --accent:#9cbc52; --accent-deep:#6f8a33; --accent-soft:#263018;
  --sel:#6aaee8; --sel-soft:#1b2b3a;
  --good:#5cc35f; --good-deep:#3c9a3f; --good-soft:#18301a; --good-ink:#a6e8a3;
  --bad:#ef6b61; --bad-deep:#c2433a; --bad-soft:#3a1b18; --bad-ink:#ffb4ac;
  --fire:#f6ad33; --fire-deep:#b87100; --gold:#f5c33b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12150f; --surface:#1b1f17; --fg:#eceee4; --muted:#9ba290; --line:#30362a; --line-deep:#252a20;
  --accent:#9cbc52; --accent-deep:#6f8a33; --accent-soft:#263018;
  --sel:#6aaee8; --sel-soft:#1b2b3a;
  --good:#5cc35f; --good-deep:#3c9a3f; --good-soft:#18301a; --good-ink:#a6e8a3;
  --bad:#ef6b61; --bad-deep:#c2433a; --bad-soft:#3a1b18; --bad-ink:#ffb4ac;
  --fire:#f6ad33; --fire-deep:#b87100; --gold:#f5c33b; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;direction:rtl;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
#app{height:100%}
.screen{height:100%;display:flex;flex-direction:column}
.inner{width:100%;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.icon-btn{background:none;border:0;padding:6px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{color:var(--fg)}
.icon-btn svg{width:26px;height:26px}

/* big chunky button */
.big{width:100%;border:0;border-radius:16px;padding:15px 18px;font:800 1.08rem var(--display);letter-spacing:.02em;background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-deep);transition:transform .06s,box-shadow .06s}
.big:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--accent-deep)}
.big:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-deep);cursor:default}
.big.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.big.ok{background:var(--good);box-shadow:0 4px 0 var(--good-deep)}
.big.no{background:var(--bad);box-shadow:0 4px 0 var(--bad-deep)}

/* ---------- HOME ---------- */
#home{overflow-y:auto}
.home-head{padding-block:22px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font:900 1.9rem/1.05 var(--display);margin:0;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.head-tools{display:flex;align-items:center;gap:6px}
.xp-pill{display:flex;align-items:center;gap:5px;font:800 .95rem var(--display);color:var(--fire-deep);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.xp-pill svg{width:18px;height:18px}
.home-body{display:flex;flex-direction:column;gap:22px;padding-block:12px 40px}
.quick{display:flex;flex-direction:column;gap:12px;background:var(--accent-soft);border:2px solid var(--accent);border-radius:20px;padding:18px}
.quick h2{font:800 1.25rem var(--display);margin:0}
.quick p{margin:0;color:var(--muted)}
.len{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.len span{font-weight:700;font-size:.9rem;color:var(--muted)}
.seg{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:5px 14px;font:700 .95rem var(--display);font-variant-numeric:tabular-nums}
.seg[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-soft);color:var(--sel)}
.sec-title{font:800 1.1rem var(--display);margin:0 0 -8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.topic{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:16px 10px 14px;transition:transform .06s}
.topic:active{transform:translateY(3px);border-bottom-width:2px}
.medal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:900 1.5rem var(--display);color:#fff;background:var(--c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.topic b{font:700 1rem var(--display)}
.topic small{color:var(--muted);font-variant-numeric:tabular-nums}
.tbar{width:80%;height:8px;border-radius:99px;background:var(--line);overflow:hidden;direction:rtl}
.tbar i{display:block;height:100%;background:var(--c);border-radius:99px}
.topic.full .medal::after{content:"✓";position:absolute;font-size:.9rem;bottom:-4px;left:-4px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#5a3d00;display:grid;place-items:center;border:2px solid var(--surface)}
.medal{position:relative}
.prog{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.prog-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prog-row b{font:800 1rem var(--display);font-variant-numeric:tabular-nums}
.prog .bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.toggle{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font:700 .98rem var(--body);text-align:right}
.toggle .sw{flex:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:right .2s}
.toggle[aria-pressed="true"] .sw{background:var(--good)}
.toggle[aria-pressed="true"] .sw::after{right:21px}
.link{background:none;border:0;padding:0;color:var(--muted);font:600 .88rem var(--body);text-decoration:underline}

/* ---------- LESSON ---------- */
#lesson{position:relative}
.top{display:flex;align-items:center;gap:12px;padding-block:14px 6px}
.pbar{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden;position:relative}
.pbar i{position:absolute;inset:0 0 0 auto;width:0;background:var(--good);border-radius:999px;transition:width .45s cubic-bezier(.3,1.5,.5,1),background .3s}
.pbar i::after{content:"";position:absolute;top:3px;left:8px;right:8px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.pbar.fire i{background:linear-gradient(270deg,var(--gold),var(--fire));box-shadow:0 0 12px var(--fire)}
.combo{display:flex;align-items:center;gap:2px;font:900 1.05rem var(--display);color:var(--fire-deep);min-width:46px;justify-content:center;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;font-variant-numeric:tabular-nums}
.combo.on{opacity:1;transform:scale(1)}
.combo.bump{animation:bump .35s}
.combo svg{width:24px;height:24px}
@keyframes bump{40%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
.stage{flex:1;overflow-y:auto;padding-block:14px 20px;display:flex;flex-direction:column;gap:16px}
.kicker{display:flex;align-items:center;gap:8px;font:700 .85rem var(--display);color:var(--sel)}
.kicker .retry{color:var(--fire-deep)}
.qrow{display:flex;gap:10px;align-items:flex-start}
#qtext{font:800 1.45rem/1.35 var(--display);margin:0;text-wrap:balance;flex:1;min-width:0}
#speak{background:var(--sel);color:#fff;border:0;border-radius:14px;padding:8px;box-shadow:0 3px 0 #2a5f91;flex:none}
#speak svg{width:24px;height:24px;display:block}
#speak:active{transform:translateY(3px);box-shadow:none}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:right;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:13px 14px;font:600 1.02rem/1.4 var(--body);min-width:0;transition:transform .06s,background .15s,border-color .15s}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.opt kbd{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font:700 .85rem var(--display);color:var(--muted)}
.opt.sel{border-color:var(--sel);background:var(--sel-soft);color:var(--sel)}
.opt.sel kbd{border-color:var(--sel);color:var(--sel)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good-ink);animation:pop .4s}
.opt.right kbd{border-color:var(--good);color:var(--good-ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.opt.wrong kbd{border-color:var(--bad);color:var(--bad-ink)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.5}
@keyframes pop{35%{transform:scale(1.04)}100%{transform:scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.foot{border-top:2px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .2s,border-color .2s}
.foot .inner{padding-block:14px 16px;display:flex;flex-direction:column;gap:12px}
.foot.ok{background:var(--good-soft);border-color:transparent}
.foot.no{background:var(--bad-soft);border-color:transparent}
.sheet{display:none;flex-direction:column;gap:6px;max-height:38vh;overflow-y:auto}
.foot.ok .sheet,.foot.no .sheet{display:flex;animation:rise .28s cubic-bezier(.2,1.3,.5,1)}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.verdict{display:flex;align-items:center;gap:10px;font:900 1.3rem var(--display)}
.verdict i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.verdict i svg{width:22px;height:22px}
.foot.ok .verdict{color:var(--good-ink)} .foot.ok .verdict i{color:var(--good)}
.foot.no .verdict{color:var(--bad-ink)} .foot.no .verdict i{color:var(--bad)}
.ans{margin:0;font-weight:700}
.foot.no .ans{color:var(--bad-ink)}
.why{margin:0;font-size:.97rem}
.foot.ok .why{color:var(--good-ink)} .foot.no .why{color:var(--bad-ink)}
.float{position:fixed;font:900 1.3rem var(--display);color:var(--fire-deep);pointer-events:none;z-index:30;animation:floatup 1s ease-out forwards;text-shadow:0 2px 0 var(--surface)}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-10px);background:var(--fire);color:#fff;font:900 1.05rem var(--display);padding:8px 18px;border-radius:999px;box-shadow:0 4px 0 var(--fire-deep);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.5,1);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* quit modal */
.modal{position:fixed;inset:0;background:rgba(10,12,8,.55);display:grid;place-items:end center;z-index:40;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.modal .box{background:var(--surface);border-radius:22px;padding:22px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:rise .25s}
.modal h3{font:800 1.25rem var(--display);margin:0}
.modal p{margin:0;color:var(--muted)}

/* ---------- INSTALL ---------- */
.install{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:2px solid var(--accent);border-radius:18px;padding:12px 14px}
.install img{width:44px;height:44px;border-radius:11px;flex:none}
.install .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.install .txt b{font:800 1rem var(--display)}
.install .txt small{color:var(--muted);font-size:.86rem;line-height:1.3}
.install .go{width:auto;padding:10px 16px;font-size:.95rem;flex:none}
.install .x{flex:none;align-self:flex-start;margin:-4px -6px 0 0}
.install .x svg{width:20px;height:20px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;text-align:right}
.steps li{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:10px 12px;font-weight:600}
.steps .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 .95rem var(--display)}
.steps svg{width:22px;height:22px;flex:none;color:var(--sel);vertical-align:middle}

/* ---------- DONE ---------- */
#done{overflow-y:auto}
.done-body{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:36px 32px;text-align:center;flex:1}
.trophy{width:132px;height:132px;animation:drop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes drop{from{transform:translateY(-60px) scale(.4) rotate(-15deg);opacity:0}}
.done-body h2{font:900 2rem/1.1 var(--display);margin:0;color:var(--fire-deep);text-wrap:balance}
.done-body h2.perfect{color:var(--gold);text-shadow:0 2px 0 var(--fire-deep)}
.done-body .sub{margin:-8px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.stat{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--surface);animation:rise .4s backwards}
.stat:nth-child(2){animation-delay:.12s}.stat:nth-child(3){animation-delay:.24s}.stat:nth-child(4){animation-delay:.36s}
.stat span{display:block;background:var(--c);color:#fff;font:800 .75rem var(--display);padding:4px 2px;letter-spacing:.03em}
.stat b{display:block;font:900 1.35rem var(--display);padding:10px 2px;color:var(--c);font-variant-numeric:tabular-nums}
.done-actions{display:flex;flex-direction:column;gap:12px;width:100%}
.review{width:100%;text-align:right;display:flex;flex-direction:column;gap:10px}
.review h3{font:800 1.05rem var(--display);margin:6px 0 0}
.rv{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rv strong{font-family:var(--display);font-weight:700}
.rv .p{color:var(--bad-ink);font-size:.93rem;text-decoration:line-through;text-decoration-thickness:1px}
.rv .a{color:var(--good-ink);font-weight:700}
.rv .w{color:var(--muted);font-size:.93rem}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}

/* path */
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:4px 10px}
.stage-head{width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;background:var(--accent);color:#fff;border-radius:18px;padding:14px 18px;box-shadow:0 4px 0 var(--accent-deep);margin-top:10px}
.stage-head b{font:900 1.15rem var(--display)}
.stage-head span{font-size:.9rem;opacity:.9}
.stage-head.locked{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-deep)}
.node-wrap{position:relative;transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center;padding-bottom:16px}
.node{width:72px;height:66px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--accent);color:#fff;box-shadow:0 7px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s;position:relative}
.node svg{width:32px;height:32px}
.node:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px 0 var(--accent-deep)}
.node.review{background:var(--gold);color:#7a4c00;box-shadow:0 7px 0 var(--fire-deep)}
.node.lock{background:var(--line);color:var(--muted);box-shadow:0 7px 0 var(--line-deep);cursor:default}
.node.cur{width:82px;height:76px;outline:6px solid var(--accent-soft);outline-offset:4px}
.node .acc{position:absolute;bottom:-26px;font:800 .75rem var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.tip{margin-bottom:12px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font:900 .95rem var(--display);color:var(--accent);animation:hover 1.4s ease-in-out infinite;white-space:nowrap;position:relative}
.tip::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line);border-bottom:0}
.tip.review{color:var(--fire-deep)}
@keyframes hover{50%{transform:translateY(-5px)}}
.path-end{font:800 1rem var(--display);color:var(--muted);text-align:center}
/* leaderboard */
.board{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.bd-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bd-head b{font:900 1.15rem var(--display)}
.bd-head span{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:.88rem}
.bd-note{margin:0;color:var(--muted);font-size:.95rem}
.bd-chase{margin:0;background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-weight:600}
.bd-chase b{font-family:var(--display);color:var(--fire-deep)}
.bd-chase.lead{background:color-mix(in srgb,var(--gold) 22%,var(--surface))}
.bd-join{display:flex;gap:8px}
.bd-join input,.modal input{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:600 1rem var(--body);background:var(--bg);color:var(--fg)}
.bd-join input:focus,.modal input:focus{outline:none;border-color:var(--sel)}
.bd-join .big{width:auto;padding:12px 20px}
.bd-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.bd-list li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px}
.bd-list li.me{background:var(--sel-soft);outline:2px solid var(--sel)}
.bd-list li.gap{justify-content:center;color:var(--muted);padding:0}
.rk{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:900 .95rem var(--display);background:var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.rk.r0{background:var(--gold);color:#5a3d00}.rk.r1{background:#c9ced6;color:#3c434d}.rk.r2{background:#d99a62;color:#4a2a0e}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm b{font:700 1rem var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--muted);font-size:.8rem}
.bd-bar{display:block;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bd-bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.sc{flex:none;display:flex;flex-direction:column;align-items:center;font:900 1.15rem var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.sc small{font:600 .7rem var(--body);color:var(--muted)}
.overtake{margin:0;width:100%;box-sizing:border-box;background:var(--fire);color:#fff;border-radius:16px;padding:12px 16px;font:900 1.1rem var(--display);box-shadow:0 4px 0 var(--fire-deep);animation:drop .6s cubic-bezier(.2,1.6,.4,1)}
.overtake small{display:block;font:600 .9rem var(--body);opacity:.95}
.bd-sync{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:12px}
.bd-sync .big{width:auto;padding:10px 18px;font-size:.98rem}
.rd{display:flex;gap:8px}
.rd .big{width:auto}
#rdCode{text-align:center;letter-spacing:.3em;font:800 1.3rem var(--display);text-transform:uppercase;direction:ltr}
.code{font:900 2.4rem var(--display);letter-spacing:.25em;direction:ltr;color:var(--accent);background:var(--accent-soft);border-radius:16px;padding:14px 8px;font-variant-numeric:tabular-nums;user-select:all}
.err{margin:0;color:var(--bad-ink);font-weight:700}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{margin:0}
</style>

</head>
<body>
<div id="app">
  <!-- HOME -->
  <section id="home" class="screen">
    <div class="inner home-head">
      <div class="brand">
        <h1>בוחן בה״ד 1</h1>
        <p>סבבים קצרים · בחינה חוזרת כל 5 סבבים · הסבר אחרי כל תשובה</p>
      </div>
      <div class="head-tools">
        <span class="xp-pill" title="סך ה-XP שלך"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span id="sessXp">0</span></span>
        <button class="icon-btn snd" aria-label="השתק צלילים"></button>
      </div>
    </div>
    <div class="inner home-body">
      <div class="install" id="install" hidden>
        <img src="/icons/icon-192.png" alt="">
        <div class="txt"><b>להתקין כאפליקציה</b><small>אייקון במסך הבית, מסך מלא, ועובד גם בלי אינטרנט</small></div>
        <button class="big go" id="installGo">התקנה</button>
        <button class="icon-btn x" id="installX" aria-label="לא עכשיו"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="prog">
        <div class="prog-row"><b id="progTxt"></b><button class="link" id="reset">איפוס התקדמות</button></div>
        <div class="bar"><i id="progBar"></i></div>
        <div class="len" role="group" aria-label="אורך סבב">
          <span>אורך סבב:</span>
          <button class="seg" id="len10" data-n="10" aria-pressed="true">10 · ~5 דק׳</button>
          <button class="seg" id="len15" data-n="15" aria-pressed="false">15 · ~8 דק׳</button>
          <button class="seg" id="len20" data-n="20" aria-pressed="false">20 · ~10 דק׳</button>
        </div>
      </div>
      <div class="board" id="board"></div>
      <div class="path" id="path"></div>
      <h2 class="sec-title">תרגול חופשי לפי נושא</h2>
      <button class="toggle" id="onlyNew" aria-pressed="false"><span class="sw"></span><span>רק שאלות שעוד לא עניתי עליהן נכון</span></button>
      <div class="grid" id="topics"></div>
    </div>
  </section>

  <!-- LESSON -->
  <section id="lesson" class="screen" hidden>
    <div class="inner top">
      <button class="icon-btn" id="quit" aria-label="יציאה מהשיעור"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="pbar" id="pbar"><i id="pfill"></i></div>
      <div class="combo" id="combo" aria-live="polite"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s1 3.5-1.5 6.5C8.5 11 7 12.5 7 15a5 5 0 0 0 10 0c0-2-1-3.5-2-4.5.2 1.6-.4 2.8-1.5 3.3.6-2.6-.3-6.6-1.5-11.8z"/></svg><b id="comboN">0</b></div>
      <button class="icon-btn snd" aria-label="השתק צלילים"></button>
    </div>
    <div class="stage inner" id="stage">
      <div class="kicker"><span id="qtag"></span><span id="qretry" class="retry" hidden>· חוזרים על טעות</span></div>
      <div class="qrow"><h2 id="qtext"></h2><button id="speak" aria-label="הקרא את השאלה" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button></div>
      <div class="opts" id="opts"></div>
    </div>
    <div class="foot" id="foot">
      <div class="inner">
        <div class="sheet" id="sheet" role="status" aria-live="polite">
          <div class="verdict"><i id="vIcon"></i><span id="vText"></span></div>
          <p class="ans" id="fbAns"></p>
          <p class="why" id="fbWhy"></p>
        </div>
        <button class="big" id="check" disabled>בדוק</button>
      </div>
    </div>
  </section>

  <!-- DONE -->
  <section id="done" class="screen" hidden>
    <div class="inner done-body">
      <svg class="trophy" id="trophy" viewBox="0 0 120 120" aria-hidden="true"></svg>
      <h2 id="doneTitle"></h2>
      <p class="sub" id="doneSub"></p>
      <div class="stats" id="stats"></div>
      <p class="overtake" id="overtake" hidden></p>
      <div class="done-actions">
        <button class="big" id="again">שיעור נוסף</button>
        <button class="big ghost" id="redo" hidden>תרגל רק את הטעויות</button>
        <button class="big ghost" id="toHome">חזרה למסלול</button>
      </div>
      <div class="review" id="review"></div>
    </div>
  </section>
</div>
<canvas id="fx"></canvas>

<script>
// [נושא, שאלה, תשובה נכונה, מסיחים מופרדים ב-|, הסבר]
const D=[
// ===== מורשת ויהדות =====
['מורשת','לפי מה נקבע חג החנוכה?','חז״ל','התורה|הכנסת|הרבנות הראשית','חנוכה אינו מופיע בתורה. חז״ל קבעו אותו כחג מדרבנן לזכר ניצחון החשמונאים ונס פך השמן.'],
['מורשת','מי כתב את השולחן ערוך?','רבי יוסף קארו','הרמב״ם|רש״י|רבי יהודה הנשיא','רבי יוסף קארו חיבר את השולחן ערוך בצפת במאה ה-16. הרמב״ם כתב את ״משנה תורה״, ורבי יהודה הנשיא חתם את המשנה.'],
['מורשת','מה מהבאים אינו חלק מגזרות השמד?','איסור על קיום חתונות ואירועים מיוחדים','איסור שמירת שבת|איסור ברית מילה|איסור לימוד תורה','גזרות אנטיוכוס כוונו נגד מצוות היסוד: שבת, ברית מילה ולימוד תורה. איסור על חתונות לא היה חלק מהן.'],
['מורשת','מי ייסד את תנועת החסידות?','רבי ישראל בעל שם טוב','הגאון מווילנה|משה מנדלסון|רבי יוסף קארו','הבעל שם טוב ייסד את החסידות במאה ה-18 במזרח אירופה. הגאון מווילנה הנהיג את המתנגדים לה. (בסיכום זה מופיע בטעות כ״תנועת הציונות״.)'],
['מורשת','מתי חל שושן פורים?','ט״ו באדר','י״ד באדר|י״ג באדר|ט״ו בשבט','בערים מוקפות חומה, כמו ירושלים, חוגגים ביום ט״ו. ב-י״ד באדר חל פורים הרגיל, ו-י״ג באדר הוא תענית אסתר.'],
['מורשת','לאילו חלקים מתחלקת התורה שבעל פה?','משנה, תוספתא, מדרש, תלמוד','תורה, נביאים, כתובים|חומש, הפטרה, מגילות|שולחן ערוך, משנה תורה, זוהר','תורה, נביאים וכתובים הם חלקי התנ״ך, כלומר התורה שבכתב. התורה שבעל פה כוללת את המשנה, התוספתא, המדרש והתלמוד.'],
['מורשת','מי הם המוסתערבים?','יהודים דוברי ערבית במזרח התיכון','יהודים שהתנצרו בספרד|מוסלמים שהתגיירו|יהודים מאשכנז שהיגרו לספרד','המוסתערבים הם יהודים ותיקים במזרח התיכון שאימצו את השפה והתרבות הערבית. יהודים שהתנצרו בספרד נקראים אנוסים.'],
['מורשת','מה מאפיין את חג הסיגד?','צמים ומקיימים טקס על ראש הר גבוה','יושבים בסוכה שבעה ימים|מדליקים נרות שמונה ימים|קוראים במגילה ושולחים מנות','הסיגד הוא חג של יהודי אתיופיה, 50 יום אחרי יום כיפור. בחג צמים, עולים להר ומתפללים לשיבה לירושלים.'],
['מורשת','היכן מתכנסים יוצאי אתיופיה בחג הסיגד?','טיילת ארמון הנציב בירושלים','הכותל המערבי|הר הרצל|מצדה','הטקס המרכזי נערך בטיילת ארמון הנציב, ממנה רואים את העיר העתיקה. כך הוא ממשיך את המסורת של עלייה להר.'],
['מורשת','מה כולל מנהג ליל שבועות?','לימוד עד אור הבוקר, קישוט בירק וארוחה חלבית','תענית וקריאת מגילת איכה|הדלקת מדורות|אכילת מצה ומרור','בליל שבועות לומדים כל הלילה לזכר מתן תורה, מקשטים בירק וזה חג הביכורים, ואוכלים מאכלי חלב. מדורות מדליקים בל״ג בעומר.'],
['מורשת','מה כוללים חוקי עומר?','איסור הפגנת דת ברבים, גיור או התנצרות, בניית מבני דת חדשים, נשיאת חרב ורכיבה על סוסים','חובת עלייה למכה לכל התושבים|פטור ממסים לבני חסות|חובת שירות בצבא הח׳ליפות','חוקי עומר הגבילו את בני החסות, יהודים ונוצרים, תחת שלטון האסלאם. בני החסות גם שילמו מס גולגולת, ולא קיבלו פטור ממסים.'],
['מורשת','מהו שער טיטוס?','שער ברומא לסמל ניצחון טיטוס על היהודים במרד הגדול','שער בחומות ירושלים העתיקה|שער בית המקדש השני|אנדרטה במצדה','שער הניצחון ברומא מראה את שלל המקדש, כולל המנורה. לכן המנורה בסמל המדינה מבוססת עליו.'],
['מורשת','מהן מצוות היסוד של האסלאם?','עדות באל, תפילה, צדקה, צום ועלייה למכה','תפילה, שבת, כשרות, צום ומילה|טבילה, וידוי, צום, צדקה ועלייה לרומא|לימוד, תפילה, צום, שבת ועלייה לירושלים','חמשת עמודי האסלאם הם השהאדה (עדות), התפילה, הזכאת (צדקה), צום הרמדאן והחג׳ (עלייה למכה).'],
['מורשת','מה קבע את ניצחון הרומאים במרד הגדול?','כיבוש מצדה','כיבוש יבנה|נפילת גמלא|מות בר כוכבא','נפילת מצדה בשנת 73 לספירה סיימה סופית את המרד הגדול. בר כוכבא שייך למרד מאוחר יותר.'],
['מורשת','מתי החריבה אשור את ממלכת ישראל והגלתה את תושביה?','722 לפנה״ס','586 לפנה״ס|597 לפנה״ס|70 לספירה','אשור החריבה את ממלכת ישראל הצפונית ב-722 לפנה״ס. בבל החריבה את יהודה ב-586, והשנה 597 היא גלות יהויכין. (בסיכום כתוב בטעות 597.)'],
['מורשת','מה אינו אחת מארבע המצוות המרכזיות של פורים?','אכילת אוזני המן','קריאת המגילה|משלוח מנות|מתנות לאביונים','ארבע המצוות הן קריאת מגילה, משלוח מנות, מתנות לאביונים וסעודת פורים. אוזני המן הן מנהג, לא מצווה.'],
['מורשת','מה מסמלת ספירת העומר?','את המסע מיציאת מצרים עד מתן תורה','את 40 שנות הנדודים במדבר|את ימי חורבן הבית|את ימי בריאת העולם','סופרים 49 יום מפסח (יציאת מצרים) עד שבועות (מתן תורה). כך הספירה מחברת בין חירות גופנית לחירות רוחנית.'],
['מורשת','מתי סופרים את ספירת העומר?','בין פסח לשבועות','בין ראש השנה ליום כיפור|בין חנוכה לפורים|בין י״ז בתמוז לט׳ באב','הספירה מתחילה במוצאי היום הראשון של פסח ונמשכת 49 ימים. שבועות חל ביום ה-50.'],
['מורשת','מה אמרה הצהרת כורש?','מתן רשות ליהודים לשוב לירושלים ולבנות את בית המקדש','גירוש היהודים לבבל|איסור על פולחן יהודי|הכרה ביהודה כממלכה עצמאית','כורש מלך פרס כבש את בבל ב-538 לפנה״ס ואישר לגולים לשוב. זו ראשית תקופת שיבת ציון ובית שני.'],
['מורשת','איזה חג מציין את ניצחון היהודים על היוונים-סלווקים?','חנוכה','פורים|פסח|ל״ג בעומר','מרד החשמונאים הסתיים בטיהור המקדש. פורים מציין הצלה בפרס, ופסח את יציאת מצרים.'],
['מורשת','לאיזה מועד קשורה דמותו של אנטיוכוס אפיפנס?','חנוכה','פורים|תשעה באב|פסח','אנטיוכוס הרביעי גזר את גזרות השמד, והן הביאו למרד החשמונאים. בפורים הדמות השלילית היא המן.'],
['מורשת','מה שמן של התפילות הנאמרות ביום חול?','שחרית, מנחה וערבית','מוסף, נעילה ומנחה|שחרית, מוסף ונעילה|קבלת שבת, ערבית ומוסף','ביום חול מתפללים שלוש תפילות. מוסף נוסף רק בשבת ובחג, ונעילה רק ביום כיפור.'],
['מורשת','מהן ל״ט אבות המלאכה?','39 המלאכות האסורות בשבת','39 ספרי התנ״ך|39 מצוות עשה|39 מסכתות התלמוד','ל״ט בגימטריה היא 39. המלאכות נלמדו מבניית המשכן, ומהן נגזרים איסורי השבת.'],
['מורשת','מדוע מציינים את צום גדליה?','לזכר רצח גדליה בן אחיקם, מנהיג שארית הפליטה לאחר חורבן בית ראשון','לזכר חורבן בית שני|לזכר הבקעת חומות ירושלים|לזכר גזרת המן','גדליה מונה בידי בבל למנהיג היהודים שנשארו ביהודה ונרצח. הרצח הביא לסוף היישוב שנשאר. הצום חל בג׳ בתשרי.'],
['מורשת','באיזה חג מתקיימת שמחת בית השואבה?','סוכות','פסח|שבועות|חנוכה','בימי המקדש שאבו בסוכות מים לניסוך על המזבח, בשמחה גדולה. כיום מקיימים אירועי שמחה בחול המועד סוכות.'],
['מורשת','איזה חג מכונה חג האסיף?','סוכות','שבועות|פסח|ט״ו בשבט','סוכות חל בסוף עונת הקציר, כשאוספים את היבול. שבועות נקרא חג הקציר וחג הביכורים, ופסח חג האביב.'],
['מורשת','לאיזה אירוע קשורה ההתבצרות במצדה?','חורבן בית שני (המרד הגדול)','מרד החשמונאים|מרד בר כוכבא|חורבן בית ראשון','מורדי המרד הגדול התבצרו במצדה גם אחרי חורבן ירושלים בשנת 70, עד נפילת המבצר ב-73.'],
['מורשת','היכן נוסד מרכז רוחני חלופי לאחר חורבן בית שני?','יבנה','טבריה|צפת|בבל','רבן יוחנן בן זכאי ביקש מאספסיאנוס ״תן לי יבנה וחכמיה״. שם נוסדו הסנהדרין ובית המדרש.'],
['מורשת','לאיזה מאורע קשור רבן יוחנן בן זכאי?','ייסוד מרכז רוחני ביבנה לאחר חורבן בית שני','חתימת המשנה|מרד בר כוכבא|שיבת ציון','הוא יצא מירושלים הנצורה וקיבל אישור להקים מרכז ביבנה. כך הובטח המשך היהדות גם בלי המקדש.'],
['מורשת','מהי ברייתא?','משנה חיצונית שאינה נכללת בששת סדרי המשנה','פירוש רש״י לתלמוד|ספר מספרי הנביאים|תפילה הנאמרת בשבת','ברייתא פירושה ״חיצונית״ בארמית. אלה דברי תנאים שרבי יהודה הנשיא לא הכניס למשנה.'],
['מורשת','מהי המשנה?','קובץ הלכתי שנערך ונחתם בידי רבי יהודה הנשיא','פירוש לתנ״ך שכתב רש״י|ספר ההלכה של הרמב״ם|קובץ אגדות מתקופת הגאונים','המשנה נחתמה בסביבות שנת 200 לספירה. היא מחולקת לשישה סדרים, ועליה בנוי התלמוד.'],
['מורשת','מתי חל עיד אל-פיטר?','בסוף חודש הרמדאן','בתחילת השנה ההג׳רית|בזמן העלייה למכה|ביום הולדת הנביא','״חג שבירת הצום״ חל מיד בסוף חודש הצום. חג הקורבן (עיד אל-אדחא) חל בזמן העלייה למכה.'],
['מורשת','מיהו רחבעם?','מלך יהודה, נכדו של דוד','מלך ישראל הראשון|נביא בתקופת בית ראשון|מלך אשור','רחבעם בן שלמה מלך אחרי אביו. בתקופתו התפלגה הממלכה לישראל ויהודה, ומלך ישראל הראשון היה שאול.'],
['מורשת','מהי פרשת השבוע?','קטע מן התורה הנקרא בכל שבת','הפטרה מספרי הנביאים|דרשת הרב בשבת|תפילה מיוחדת לשבת','התורה מחולקת ל-54 פרשות שנקראות לאורך שנה. ההפטרה היא קטע מהנביאים שנקרא אחרי הפרשה.'],
['מורשת','מי ייסד את הדת הדרוזית?','אל-חאכם בי-אמר אללה','מוחמד|עלי בן אבי טאלב|צלאח א-דין','הח׳ליף הפאטימי אל-חאכם (המאה ה-11) נחשב למקור הדת הדרוזית, שנפרדה מהאסלאם השיעי-איסמאעילי.'],
['מורשת','מה מאפיין את המצה?','לחם שלא החמיץ','לחם מתוק עם דבש|לחם קלוע לשבת|לחם עם שמרים','בני ישראל יצאו ממצרים בחיפזון והבצק לא הספיק לתפוח. לכן בפסח אוכלים מצה ולא חמץ.'],
['מורשת','מתי נקראת מגילת איכה?','ט׳ באב','פורים|שבועות|יום כיפור','איכה היא קינה על חורבן ירושלים. בפורים קוראים את מגילת אסתר, ובשבועות את מגילת רות.'],
['מורשת','איזה סיפור עומד במרכז מגילת רות?','גיורה של רות המואבייה','הצלת היהודים בפרס|חורבן ירושלים|יציאת מצרים','רות מצטרפת לעם ישראל ואומרת ״עמך עמי״. היא סבתא רבתא של דוד המלך, ולכן קוראים את המגילה בשבועות.'],
['מורשת','מיהו אלכסנדר הגדול?','מלך מוקדון, מגדולי המצביאים בעת העתיקה','קיסר רומי שהחריב את המקדש|מלך פרס שהתיר לשוב לציון|מלך יהודה מבית חשמונאי','אלכסנדר כבש את האימפריה הפרסית ואת ארץ ישראל ב-332 לפנה״ס. בעקבותיו החלה התקופה ההלניסטית.'],
['מורשת','מהו המילת?','קהילה יהודית אוטונומית שניהלה את חייה באופן עצמאי','מס שהוטל על לא-מוסלמים|ישיבה גדולה בבבל|מועצת רבנים בפולין','באימפריה העות׳מאנית כל עדה דתית ניהלה לעצמה את ענייני הדת, המשפט והחינוך. זו שיטת המילת.'],
['מורשת','מיהו הורדוס?','מלך יהודה שמונה בשנת 40 לפנה״ס','נציב רומי ביהודה|כוהן גדול בבית ראשון|מנהיג מרד בר כוכבא','הסנאט הרומי מינה את הורדוס למלך. הוא היה בנאי גדול: הרחיב את בית המקדש ובנה את מצדה וקיסריה.'],
['מורשת','למי עבר מקל ההנהגה עם הכניסה לארץ?','יהושע בן נון','אהרון הכהן|כלב בן יפונה|שמואל הנביא','משה מינה את יהושע לפני מותו, ויהושע הוביל את כיבוש הארץ. כלב היה איתו בין המרגלים, אבל לא מונה למנהיג.'],
['מורשת','במה עוסק חיבורו של הרמב״ם ״משנה תורה״?','הלכה','פילוסופיה|רפואה|פירוש לתנ״ך','״משנה תורה״ (״היד החזקה״) מסכם את כל ההלכה. הספר הפילוסופי של הרמב״ם הוא ״מורה נבוכים״.'],
['מורשת','באיזו תקופה פעל הרמב״ם?','תקופת הראשונים','תקופת התנאים|תקופת האמוראים|תקופת האחרונים','הסדר הוא תנאים (המשנה), אמוראים (התלמוד), גאונים, ראשונים (המאות 11–15) ואחרונים. הרמב״ם חי במאה ה-12.'],
['מורשת','מה ניתן למצוא בשולחן ערוך?','חוקים, דינים ומצוות','סיפורי אגדה|פירוש מילים בתנ״ך|תולדות עם ישראל','השולחן ערוך הוא ספר פסיקה מעשי. הוא מסדר את ההלכה בארבעה חלקים, כמו ״אורח חיים״ ו״יורה דעה״.'],
['מורשת','מה ההבדל בין התורה שבכתב לתורה שבעל פה?','שבכתב היא התנ״ך, שבעל פה היא הפירושים שלה','שבכתב היא התלמוד, שבעל פה היא התנ״ך|שבכתב בעברית, שבעל פה בארמית|אין הבדל','התורה שבעל פה עברה מדור לדור ומפרשת את הכתוב. בסוף היא נכתבה במשנה ובתלמוד.'],
['מורשת','מהי שנה מעוברת?','שנה בת 13 חודשים','שנה בת 12 חודשים|שנה שבה אין שמיטה|שנה בת 366 ימים','מוסיפים חודש אדר שני כדי לתאם בין הלוח הירחי ללוח השמשי, כך שפסח ייפול תמיד באביב.'],
['מורשת','מה הייתה מטרת ועד ארבע הארצות?','לייצג את היהודים מול שלטונות פולין ולדאוג לאינטרסים משותפים','לארגן עלייה לארץ ישראל|לחבר את השולחן ערוך|להילחם בתנועת החסידות','זה היה מוסד האוטונומיה של יהודי פולין וליטא (המאות 16–18). הוא גבה מסים, חוקק תקנות וייצג את הקהילות.'],
['מורשת','כיצד כונו היהודים שנאלצו להתנצר בספרד לאחר הגירוש?','אנוסים','מוסתערבים|משכילים|מתבוללים','האנוסים התנצרו בכפייה ורבים מהם שמרו על היהדות בסתר. מוסתערבים הם יהודים דוברי ערבית.'],
['מורשת','מי חיבר פירוש מקיף לתורה ולתלמוד?','רש״י (רבי שלמה יצחקי)','הרמב״ם|רבי יוסף קארו|רבי יהודה הנשיא','רש״י חי בצרפת במאה ה-11. הפירוש שלו נלמד עד היום כמעט בכל דף תלמוד ובחומש.'],
['מורשת','מה הם מסעות הצלב?','מסעות שיזמו האפיפיורים כדי לחדש את השליטה הנוצרית בארץ ישראל','כיבושי האסלאם במאה ה-7|מסעות גירוש היהודים מאירופה|מסעות עלייה של יהודי אירופה','מסע הצלב הראשון יצא ב-1096. בדרכו נטבחו קהילות יהודיות בגרמניה, אירוע שנקרא גזרות תתנ״ו.'],
['מורשת','בראש איזו תנועה עמד משה מנדלסון?','תנועת ההשכלה היהודית','תנועת החסידות|התנועה הציונית|תנועת המתנגדים','מנדלסון (גרמניה, המאה ה-18) עודד יהודים להשתלב בתרבות האירופית ולשמור על יהדותם. ההשכלה נקראת גם ״הסקלה״.'],

// ===== אזרחות =====
['אזרחות','מהו עיקרון הפרדת הרשויות?','הפרדה ופיזור בין שלוש רשויות: מחוקקת, מבצעת ושופטת','הפרדה בין דת למדינה|הפרדה בין הצבא לממשלה|הפרדה בין השלטון המרכזי למקומי','בישראל הכנסת מחוקקת, הממשלה מבצעת ובתי המשפט שופטים. החלוקה מונעת ריכוז כוח ויוצרת בקרה הדדית.'],
['אזרחות','מה מקור שם הכנסת?','הכנסת הגדולה בירושלים בימי הבית השני','בית הכנסת הגדול בבבל|כינוס הקונגרס הציוני|אספת הנבחרים בתקופת המנדט','הכנסת הגדולה הייתה מוסד ההנהגה בתחילת ימי הבית השני. לפי המסורת היו בה 120 חברים, ולכן גם בכנסת יש 120.'],
['אזרחות','מהם שני המרכיבים של אופייה הדמוקרטי של ישראל?','פורמלי-מוסדי ותרבותי-ערכי','דתי ולאומי|כלכלי וחברתי|צבאי ואזרחי','הפורמלי-מוסדי הוא המנגנונים, כמו בחירות ושלטון החוק. התרבותי-ערכי הוא הערכים, כמו זכויות אדם, שוויון וסובלנות.'],
['אזרחות','מה טען השופט חיים כהן?','יש למצוא את שורשי הדמוקרטיה ביהדות ובמשפט העברי','יש לנתק את המשפט מהיהדות|הדמוקרטיה סותרת את היהדות|יש לאמץ את המשפט הבריטי','השופט חיים כהן הראה שערכים כמו כבוד האדם ושוויון בפני החוק נמצאים כבר במקורות היהודיים.'],
['אזרחות','מהם עקרונות המשפט?','הזכות להליך הוגן, שוויון בפני החוק, פומביות המשפט','חובת שירות, חופש דת, זכות הצבעה|בחירות חופשיות, ריבונות, הפרדת רשויות|חופש עיתונות, התאגדות וקניין','אלה העקרונות שמבטיחים משפט צודק. פומביות פירושה שהמשפט פתוח לציבור, וזה מגן מפני שרירות.'],
['אזרחות','מה תפקיד הקואליציה?','לגבות בכנסת את צעדי הממשלה ולהגן על חקיקתה','לבקר את הממשלה ולהציע חלופה|לבקר בתי המשפט|לבחור את נשיא המדינה','הקואליציה היא רוב חברי הכנסת שתומכים בממשלה. האופוזיציה היא זו שמבקרת ומציעה חלופה.'],
['אזרחות','צה״ל מהווה זרוע מבצעת של...','הממשלה','הכנסת|נשיא המדינה|בית המשפט העליון','חוק יסוד: הצבא קובע שהצבא נתון למרות הממשלה. שר הביטחון הוא הממונה מטעמה.'],
['אזרחות','מהם סמלי המדינה?','דגל, סמל, המנון','דגל, מטבע, בירה|הכנסת, הממשלה, הנשיא|מגילת העצמאות, הדגל, השפה','הדגל הוא הטלית עם מגן דוד, הסמל הוא המנורה עם ענפי זית, וההמנון הוא ״התקווה״.'],
['אזרחות','ממי מורכבת ממשלת ישראל?','מכלל השרים','מכל חברי הכנסת|מראש הממשלה והנשיא|מחברי הקואליציה בלבד','הממשלה כוללת את ראש הממשלה ואת השרים. שר לא חייב להיות חבר כנסת, והנשיא אינו חלק מהממשלה.'],
['אזרחות','מהי דתם של מרבית ערביי ישראל?','מוסלמים סונים','נוצרים|דרוזים|מוסלמים שיעים','כ-85% מערביי ישראל הם מוסלמים סונים. הנוצרים והדרוזים הם מיעוטים קטנים יותר.'],
['אזרחות','במה עוסק בג״ץ?','בעתירות של מי שרואה עצמו נפגע מפעולות המדינה','בחקיקת חוקי יסוד|בבחירת ראש הממשלה|בעבירות פליליות בלבד','בית המשפט העליון בשבתו כבג״ץ מבקר את פעולות הרשויות. החקיקה היא תפקיד הכנסת.'],
['אזרחות','מהי שיטת הממשל בישראל?','פרלמנטרית','נשיאותית|חצי-נשיאותית|מלוכה חוקתית','הממשלה צריכה את אמון הכנסת וראש הממשלה הוא ראש הרשות המבצעת. לנשיא יש תפקיד ייצוגי בעיקר.'],
['אזרחות','מי מצביע על אי-אמון בממשלה?','הכנסת','הנשיא|בג״ץ|העם במשאל עם','בשיטה פרלמנטרית הממשלה מכהנת כל עוד יש לה אמון הכנסת. הצבעת אי-אמון בונה יכולה להפיל אותה.'],
['אזרחות','האם מותר לחייל להביע עמדה פוליטית?','לא — חל איסור על הבעת עמדות פוליטיות','כן, בכל מקום|כן, רק במדים|רק ברשתות החברתיות','צה״ל הוא צבא ממלכתי וא-פוליטי. האיסור שומר על אמון כל הציבור בצבא ועל כפיפותו לדרג המדיני.'],
['אזרחות','מהי הרשות המחוקקת בישראל?','הכנסת','הממשלה|בית המשפט העליון|נשיא המדינה','הכנסת מחוקקת חוקים וחוקי יסוד. הממשלה היא הרשות המבצעת, ובתי המשפט הם הרשות השופטת.'],
['אזרחות','במה עסקו מרבית הבדואים באופן מסורתי?','מרעה','דיג|מסחר ימי|תעשייה','הבדואים היו נוודים שגידלו צאן וגמלים ונדדו בין מקורות מים ומרעה.'],
['אזרחות','מה דתם של הצ׳רקסים?','מוסלמים','נוצרים|דרוזים|יהודים','הצ׳רקסים הם מוסלמים סונים שהגיעו מהקווקז. בישראל הם חיים בכפר כמא ובריחאניה ומשרתים בצה״ל.'],
['אזרחות','מה קובע חוק השבות?','לכל יהודי יש זכות לעלות לארץ','כל תושב זכאי לאזרחות|רק יהודים ילידי הארץ הם אזרחים|עולים חייבים בשירות צבאי מיידי','חוק השבות (1950) מבטא את ישראל כבית לאומי לעם היהודי. כל יהודי זכאי לעלות ולקבל אזרחות.'],

// ===== ציונות והיישוב =====
['ציונות','מי עמד בראש הציונות הרוחנית?','אשר צבי גינצברג (אחד העם)','תאודור הרצל|חיים ויצמן|זאב ז׳בוטינסקי','אחד העם רצה בארץ מרכז רוחני ותרבותי לעם היהודי. הרצל עמד בראש הציונות המדינית.'],
['ציונות','מהי אמנציפציה?','הענקת שוויון זכויות ליהודים ושילובם בחברה הכללית','תנועת ההשכלה היהודית|עלייה המונית לארץ ישראל|גירוש היהודים ממערב אירופה','האמנציפציה החלה בצרפת אחרי המהפכה (1791). היא נתנה ליהודים זכויות אזרח מלאות.'],
['ציונות','מה הייתה מטרת הקונגרס הציוני הראשון?','לכנס את תומכי הרעיון הציוני מכל העולם','להכריז על הקמת המדינה|לדון בתכנית אוגנדה|לייסד את ההגנה','הרצל כינס את הקונגרס בבזל ב-1897. שם נוסדה ההסתדרות הציונית ונקבעה ״תכנית בזל״.'],
['ציונות','מתי התקיים הקונגרס הציוני הראשון?','1897','1882|1917|1903','הקונגרס התקיים בבזל, שוויץ. ב-1882 החלה העלייה הראשונה, וב-1903 עלתה תכנית אוגנדה.'],
['ציונות','מיהו זאב ז׳בוטינסקי?','מנהיג ציוני, מנהיג האצ״ל ומשורר','ראש הממשלה הראשון|מייסד ניל״י|מייסד הפלמ״ח','ז׳בוטינסקי ייסד את הציונות הרוויזיוניסטית ואת בית״ר והיה המפקד העליון של האצ״ל. ראש הממשלה הראשון היה בן גוריון.'],
['ציונות','מי עמד בראש הציונות הסינתטית?','חיים ויצמן','תאודור הרצל|אחד העם|דוד בן גוריון','ויצמן שילב פעולה מדינית עם התיישבות מעשית. לימים הוא היה הנשיא הראשון של המדינה.'],
['ציונות','מהו זרם הציונות הסינתטית?','שילוב הציונות המדינית והמעשית לשיפור מצב היהודים','ציונות המבוססת על תרבות ורוח בלבד|ציונות הדוגלת במאבק צבאי|ציונות המתנגדת לפעולה מדינית','״סינתזה״ פירושה שילוב. הזרם האמין שצריך גם הכרה בינלאומית וגם עלייה והתיישבות בפועל.'],
['ציונות','במה דגל זרם הציונות המדינית?','בהשגת הכרה בינלאומית רחבה ברעיון הבית הלאומי','בהתיישבות מעשית לפני כל הכרה|בחיזוק התרבות העברית בגולה|בשילוב דת ולאום','הרצל, מוביל הזרם, האמין שקודם צריך ״צ׳רטר״, כלומר אישור ממעצמות, ורק אחר כך עלייה המונית.'],
['ציונות','מהי פרשת אוגנדה?','הצעת הבריטים להרצל לשטח במזרח אפריקה','הצעה לחלוקת ארץ ישראל|תכנית עלייה מאתיופיה|הסכם עם האימפריה העות׳מאנית','ב-1903, אחרי פוגרום קישינב, הציעו הבריטים שטח במזרח אפריקה. ההצעה עוררה מחלוקת קשה ונדחתה ב-1905.'],
['ציונות','לשם מה התכנסה ועידת קטוביץ?','לאיחוד אגודות חובבי ציון להנהגה אחת','להכרזה על המדינה|לדיון בפליטי השואה|לייסוד הסוכנות היהודית','ועידת קטוביץ (1884) איחדה את אגודות חובבי ציון. בראשה עמד ליאון פינסקר.'],
['ציונות','מה הוא ״כל ישראל חברים״?','ארגון יהודי צרפתי להגנה על זכויות היהודים ולפעולה למענם','תנועת נוער ציונית|מפלגה בכנסת הראשונה|ארגון מחתרת בארץ','כי״ח (אליאנס) נוסד בפריז ב-1860. הוא הקים בתי ספר ברחבי העולם, ובארץ גם את מקווה ישראל.'],
['ציונות','מה הן ״סופות בנגב״?','גל פרעות בדרום רוסיה ב-1881–1882, מגורמי הדחיפה לעלייה הראשונה','מאורעות בנגב בזמן המנדט|קרבות במלחמת העצמאות|גל עלייה מצפון אפריקה','הפרעות פרצו אחרי רצח הצאר אלכסנדר השני. הן דחפו להקמת חובבי ציון ולעלייה הראשונה. (בסיכום כתוב בטעות 1981.)'],
['ציונות','מה ראשי התיבות ביל״ו?','בית יעקב לכו ונלכה','בני ישראל לארץ ונלכה|ברית יהודית לעלייה ולעבודה|בית ישראל לעם ולארץ','זה פסוק מישעיהו (ב׳, ה׳). אנשי ביל״ו היו סטודנטים מרוסיה שעלו בעלייה הראשונה.'],
['ציונות','איזה עיקרון הדגישו חברי ביל״ו שהתנגדו לרוטשילד?','עצמאות ועבודת אדמה','לימוד תורה|העסקת פועלים ערבים|מסחר ותעשייה','הם רצו לעבוד את האדמה בעצמם ולא להיות תלויים בפקידי הברון ובתמיכתו.'],
['ציונות','למי סייע הברון רוטשילד?','לעולי העלייה הראשונה','לעולי העלייה השלישית|ליישוב הישן בירושלים|לניצולי השואה','״הנדיב הידוע״ הציל מושבות שעמדו בפני קריסה, כמו ראשון לציון וזכרון יעקב, ומימן אותן.'],
['ציונות','לאילו יישובים קשורה שיטת הפקידות?','מושבות העלייה הראשונה','קיבוצי העלייה השלישית|היישוב הישן בירושלים|עיירות הפיתוח','פקידי הברון ניהלו את המושבות שתמך בהן והכתיבו לאיכרים מה לגדל ואיך לחיות. השיטה עוררה התנגדות.'],
['ציונות','מי היה משה מונטיפיורי?','נדבן יהודי שסייע ליהודי ירושלים','מנהיג העלייה הראשונה|מייסד תל אביב|נציב בריטי','מונטיפיורי היה נדבן אנגלי. הוא מימן את משכנות שאננים ואת טחנת הרוח בירושלים.'],
['ציונות','מה ייחודה של שכונת משכנות שאננים?','השכונה הראשונה מחוץ לחומות ירושלים','השכונה הראשונה בתל אביב|הקיבוץ הראשון|המושבה הראשונה','השכונה נבנתה ב-1860 במימון מונטיפיורי. היא פתחה את היציאה מהעיר העתיקה הצפופה.'],
['ציונות','מה גרם להתיישבות היהודית מחוץ לחומות ירושלים?','יוזמה פילנתרופית של יהודים עשירים ומבוססים','גירוש בידי העות׳מאנים|הוראת השלטון הבריטי|מגפה בעיר העתיקה','נדבנים כמו מונטיפיורי מימנו שכונות חדשות כדי להקל על הצפיפות והעוני בעיר העתיקה.'],
['ציונות','איזו קבוצה מכונה ״היישוב הישן״?','היהודים האדוקים שחיו בארץ לפני העליות הציוניות','עולי העלייה הראשונה|תושבי המושבות החקלאיות|חברי תנועת ביל״ו','היישוב הישן חי בעיקר בארבע ערי הקודש: ירושלים, חברון, צפת וטבריה. הוא התפרנס במידה רבה מכספי החלוקה.'],
['ציונות','מה הם כספי החלוקה?','כספים שנאספו באירופה וחולקו ליהודים לומדי תורה ביישוב הישן','כספי הברון רוטשילד למושבות|מענקים בריטיים לעולים|כספי השילומים מגרמניה','קהילות בגולה תמכו בלומדי התורה בארץ. החלוקה נעשתה לפי ״כוללים״ של ארצות המוצא.'],
['ציונות','מה הם ה״כוללים״?','מסגרות לימוד תורה שהוקמו בארץ לפי ארצות מוצא','מושבות חקלאיות שיתופיות|ועדי עובדים בהסתדרות|יחידות בהגנה','כל כולל קיבץ יוצאי ארץ אחת, למשל כולל הונגריה, וחילק לחבריו את כספי החלוקה.'],
['ציונות','מה משותף לפתח תקווה ולראש פינה?','שתיהן נוסדו בידי אנשי היישוב הישן','שתיהן נוסדו בעלייה השנייה|שתיהן קיבוצים|שתיהן נוסדו בידי ביל״ו','יוצאי ירושלים ייסדו את פתח תקווה ב-1878, ויוצאי צפת את ראש פינה. זו ראשית היציאה של היישוב הישן לחקלאות.'],
['ציונות','מיהו אליעזר בן יהודה?','לשונאי שהתעקש על השימוש בעברית ופיתח אותה','מייסד תל אביב|ראש ההגנה|מנהיג חובבי ציון','בן יהודה נחשב למחיה השפה העברית. הוא חיבר מילון, חידש מילים ודיבר בביתו רק עברית.'],
['ציונות','כיצד נקראה בעבר האקדמיה ללשון העברית?','ועד הלשון העברית','מועצת השפה|חברת עזרה|בית הספרים הלאומי','בן יהודה ייסד את ועד הלשון ב-1890. ב-1953 הוא הפך לאקדמיה ללשון העברית.'],
['ציונות','מדוע התעקשה חברת ״עזרה״ ללמד בגרמנית בטכניון?','טענה שהעברית אינה עשירה דיה לדיון אקדמי ולימוד מדעים','כי רוב המורים היו גרמנים בלבד|בדרישת השלטון העות׳מאני|כדי למשוך סטודנטים ערבים','ההחלטה פתחה את ״מלחמת השפות״ ב-1913. מורים ותלמידים שבתו, ובסוף העברית ניצחה.'],
['ציונות','מה הייתה השפה הראשונה שבה לימדו בטכניון?','גרמנית','עברית|אנגלית|יידיש','זו הייתה החלטת חברת ״עזרה״ הגרמנית, שעוררה את מלחמת השפות. בסוף נקבעה העברית.'],
['ציונות','איזו עיר כונתה בראשיתה ״אחוזת בית״?','תל אביב','חיפה|ראשון לציון|פתח תקווה','״אחוזת בית״ הייתה שכונה שנוסדה ליד יפו ב-1909. ב-1910 שונה שמה לתל אביב.'],
['ציונות','באיזו שנה נוסדה ״אחוזת בית״?','1909','1882|1917|1921','בהגרלת הצדפים המפורסמת חילקו 66 משפחות את המגרשים, ב-1909.'],
['ציונות','מאיזו עלייה עלו אנשי ״השומר״?','העלייה השנייה','העלייה הראשונה|העלייה השלישית|העלייה הרביעית','״השומר״ נוסד ב-1909 מתוך ״בר גיורא״, על ידי עולי העלייה השנייה (1904–1914).'],
['ציונות','איזה ארגון ייסד יצחק בן צבי?','בר גיורא','ניל״י|ההגנה|הלח״י','בן צבי, לימים הנשיא השני, ייסד את בר גיורא ב-1907 יחד עם ישראל שוחט ואחרים.'],
['ציונות','מהו ארגון השמירה הראשון?','בר גיורא','השומר|ההגנה|הנוטרים','בר גיורא (1907) קדם להשומר (1909), שהתפתח ממנו. ההגנה הוקמה רק ב-1920.'],
['ציונות','מתי הוקמה ניל״י ומי עמד בראשה?','1915, אהרון אהרונסון','1909, יצחק בן צבי|1920, זאב ז׳בוטינסקי|1940, אברהם שטרן','ניל״י פעלה במלחמת העולם הראשונה. אברהם שטרן ייסד את הלח״י ב-1940.'],
['ציונות','מה הייתה מטרת מחתרת ניל״י?','לסייע לבריטים לכבוש את ארץ ישראל מידי העות׳מאנים','להילחם בבריטים|להעלות עולים באופן בלתי לגאלי|לשמור על המושבות מפני שודדים','ניל״י אספה מודיעין לבריטים, כי חבריה האמינו שניצחון בריטי יקדם את הבית הלאומי. ראשי התיבות: ״נצח ישראל לא ישקר״.'],
['ציונות','מי גירש את תושבי תל אביב מבתיהם?','הטורקים במלחמת העולם הראשונה','הבריטים ב-1939|הערבים במאורעות תרפ״ט|הבריטים בשבת השחורה','ב-1917 גירשו השלטונות העות׳מאנים את תושבי יפו ותל אביב, מחשש שישתפו פעולה עם הבריטים.'],
['ציונות','מה משמעות ״כיבוש העבודה״?','ניסיון לסגל אורח חיים המדגיש את עבודת האדמה בידי יהודים','כיבוש שטחים בכוח|השתלטות על מפעלים בריטיים|העסקת פועלים ערבים במושבות','עולי העלייה השנייה רצו שיהודים יעבדו בעבודה עברית במו ידיהם, ולא רק יעסיקו אחרים.'],
['ציונות','הגעת איזו אונייה סימלה את ראשית העלייה השלישית?','רוסלן','אקסודוס|אלטלנה|סנט לואיס','רוסלן הגיעה ליפו בדצמבר 1919 והביאה חלוצים מרוסיה. אקסודוס היא אוניית מעפילים מ-1947.'],
['ציונות','מהו גדוד העבודה?','קומונה כלכלית שחבריה חיו חיי שיתוף','יחידה צבאית בריטית|גדוד במלחמת העצמאות|ארגון שמירה','גדוד העבודה ע״ש טרומפלדור נוסד בעלייה השלישית. חבריו סללו כבישים ועבדו יחד בשיתוף מלא.'],
['ציונות','היכן ממוקמת חצר תל חי?','באצבע הגליל (קריית שמונה)','בגליל התחתון|בעמק יזרעאל|ברמת הגולן','תל חי נמצאת בצפון אצבע הגליל, ליד קריית שמונה של היום.'],
['ציונות','מה התרחש בתל חי?','קרב נגד פורעים ערבים','חתימה על הסכם שלום|ייסוד הקיבוץ הראשון|הכרזת העצמאות','במרץ 1920 נפלו בקרב יוסף טרומפלדור ושבעה מחבריו. מכאן נולד הסמל ״טוב למות בעד ארצנו״.'],
['ציונות','איזו עלייה עיבתה את היישוב העירוני והורכבה מיהודים שברחו מפולין?','העלייה הרביעית','העלייה השנייה|העלייה החמישית|העלייה השלישית','העלייה הרביעית (1924–1929) נקראת ״עליית גרבסקי״. עולים ממעמד הביניים התיישבו בעיקר בערים, ובמיוחד בתל אביב.'],
['ציונות','איזו עלייה נחשבת לעלייה של יהודי גרמניה?','העלייה החמישית','העלייה הרביעית|העלייה השלישית|העלייה השנייה','העלייה החמישית (1929–1939) גדלה מאוד אחרי עליית הנאצים לשלטון ב-1933.'],
['ציונות','מה מוצא העולים בעליית ״אעלה בתמר״?','תימן','מרוקו|עיראק|רוסיה','עליית ״אעלה בתמר״ (1881–1882) הביאה יהודים מתימן, במקביל לעלייה הראשונה.'],
['ציונות','מה כוללת הצהרת בלפור?','הכרה רשמית של בריטניה בתביעות הציונות על ארץ ישראל','חלוקת הארץ לשתי מדינות|הגבלת העלייה|הכרזה על המנדט הצרפתי','ב-1917 הצהירה בריטניה שהיא רואה בעין יפה הקמת בית לאומי לעם היהודי. ההצהרה הושגה בדרך דיפלומטית.'],
['ציונות','באיזו שנה החל רשמית שלטון המנדט?','1922','1917|1920|1948','חבר הלאומים אישר את כתב המנדט ב-1922. ב-1917 כבשו הבריטים את הארץ, ומ-1920 שלטו בה בממשל אזרחי.'],
['ציונות','מתי פורסם הספר הלבן השני?','1930','1922|1939|1947','הספר הלבן של פאספילד (1930) בא אחרי מאורעות תרפ״ט. הספר הראשון יצא ב-1922 והשלישי ב-1939.'],
['ציונות','מה התרחש במאורעות תרפ״ף?','המון ערבי מוסת התנפל על יהודים בירושלים','טבח ביהודי חברון|גירוש יהודי תל אביב|הקמת ההגנה בידי הבריטים','באפריל 1920, בזמן חגיגות נבי מוסא, פרעו ערבים ביהודי העיר העתיקה. בעקבות זאת הוקמה ההגנה.'],
['ציונות','בעקבות מה החליטה אחדות העבודה להקים את ההגנה?','מאורעות תרפ״ף','מאורעות תרפ״ט|הצהרת בלפור|הספר הלבן','מאורעות תרפ״ף הראו שאי אפשר לסמוך על הבריטים בהגנה על היישוב. ההגנה הוקמה ב-1920.'],
['ציונות','אילו שני אירועים במאורעות תרפ״א זעזעו את היישוב?','טבח ביפו ורצח יושבי ״בית יצקר״ באבו כביר','טבח בחברון ובצפת|פיצוץ מלון המלך דוד|השבת השחורה','במאי 1921 נרצח גם הסופר י״ח ברנר בבית יצקר. הטבח בחברון ובצפת קרה בתרפ״ט.'],
['ציונות','באיזו שנה התרחשו מאורעות תרפ״ט?','1929','1920|1936|1921','תרפ״ט היא 1929. הסכסוך על הכותל הוביל לטבח בחברון ובצפת.'],
['ציונות','מה התרחש בחברון במאורעות תרפ״ט?','טבח ביהודים תושבי המקום','גירוש היהודים בידי הבריטים|הקמת יישוב יהודי חדש|קרב בין ההגנה לבריטים','באוגוסט 1929 נרצחו בחברון 67 יהודים, והקהילה העתיקה פונתה.'],
['ציונות','בעקבות אילו מאורעות הוקם ארגון האצ״ל?','מאורעות תרפ״ט','מאורעות תרפ״ף|מאורעות תרצ״ו|השבת השחורה','אחרי תרפ״ט פרשו מפקדים מההגנה, שרצו גישה תקיפה יותר, והקימו את ״ההגנה הלאומית״. היא הפכה לאצ״ל (1931).'],
['ציונות','במהלך איזה אירוע נחנך נמל תל אביב?','מאורעות תרצ״ו–תרצ״ט','מאורעות תרפ״ט|מלחמת העולם הראשונה|מלחמת העצמאות','במרד הערבי של 1936 שבתו פועלי נמל יפו. לכן היישוב פתח נמל עצמאי בתל אביב.'],
['ציונות','מה הציעה ועדת פיל?','לחלק את הארץ לשתי מדינות','להגביל לחלוטין את העלייה|להקים מדינה דו-לאומית|להעביר את המנדט לצרפת','ועדת פיל (1937) הייתה הראשונה שהציעה חלוקה, בעקבות המרד הערבי.'],
['ציונות','אילו גופים כונו ״המוסדות הלאומיים״?','גופי הממשל האוטונומי של יהודי ארץ ישראל בתקופת היישוב','משרדי הממשלה הבריטית|מוסדות הקהילה בגולה|מחתרות היישוב','אלה אספת הנבחרים, הוועד הלאומי והסוכנות היהודית. הם ניהלו את היישוב כמו ״מדינה שבדרך״.'],
['ציונות','אילו גופים הרכיבו את ״המדינה שבדרך״?','כנסת ישראל והסוכנות היהודית','הכנסת והממשלה|ההגנה והפלמ״ח|ההסתדרות והקק״ל','כנסת ישראל (עם אספת הנבחרים והוועד הלאומי) ניהלה את הפנים, והסוכנות טיפלה בעלייה ובקשר עם הבריטים.'],
['ציונות','מהי תנועת המרי העברי?','שיתוף פעולה בין המחתרות למאבק בבריטים','תנועת נוער ציונית|מפלגה פוליטית|ארגון עלייה מארצות ערב','ב-1945–1946 פעלו יחד ההגנה, האצ״ל והלח״י נגד מדיניות הספר הלבן.'],
['ציונות','על ידי מי בוצע ליל הגשרים?','לוחמי תנועת המרי העברי','הצבא הבריטי|ניל״י|הלגיון הערבי','ביוני 1946 פוצצו לוחמי הפלמ״ח, במסגרת המרי, גשרים כדי לנתק את הארץ משכנותיה.'],
['ציונות','מהי פעולת ליל הגשרים?','פיצוץ 11 גשרים שחיברו את ארץ ישראל לארצות השכנות','פריצה לכלא עכו|הפצצת נמל חיפה|העלאת מעפילים בלילה','הפעולה נועדה לשבש את התחבורה הבריטית. בתגובה ערכו הבריטים את ״השבת השחורה״.'],
['ציונות','מהי השבת השחורה?','שבת שבה נעצרו ראשי היישוב, נערכו חיפושי נשק והוטל עוצר על אזורים יהודיים','שבת פרוץ מלחמת יום הכיפורים|יום גירוש תושבי תל אביב|יום פיצוץ מלון המלך דוד','ב-29 ביוני 1946 ערכו הבריטים ״מבצע אגתה״ בתגובה לליל הגשרים.'],
['ציונות','מי ביצע את פיצוץ מלון המלך דוד ב-1946?','האצ״ל','הלח״י|הפלמ״ח|ניל״י','האצ״ל פוצץ את אגף המלון שבו ישבה המזכירות הבריטית. בפיצוץ נהרגו 91 בני אדם.'],
['ציונות','כחלק מאיזה מאבק פוצץ מלון המלך דוד?','מאבק היישוב היהודי בשלטון הבריטי','מלחמת העצמאות|המאבק בעות׳מאנים|מאורעות תרפ״ט','הפיצוץ (יולי 1946) היה חלק ממאבק המחתרות בבריטים, ובא בתגובה לשבת השחורה.'],
['ציונות','מה הוביל להקמת הלח״י?','פילוג באצ״ל לאחר ההחלטה להפסיק את המאבק בבריטים','מאורעות תרפ״ט|הקמת המדינה|פירוק הפלמ״ח','בפרוץ מלחמת העולם השנייה הפסיק האצ״ל את המאבק בבריטים. אברהם שטרן התנגד ופרש ב-1940.'],

// ===== שואה =====
['שואה','במה הואשם ישראל רז׳ה קסטנר?','בשיתוף פעולה עם הנאצים בהונגריה','בריגול לטובת בריטניה|ברצח ארלוזורוב|בגניבת כספי שילומים','קסטנר ניהל משא ומתן עם אייכמן והציל ״רכבת״ של כ-1,700 יהודים. הוא הואשם שלא הזהיר את האחרים. בית המשפט העליון זיכה אותו אחרי שנרצח.'],
['שואה','מי היו הנוסעים באוניית סנט לואיס?','פליטים יהודים מגרמניה','מעפילים מתימן|חיילים בריטים|ניצולי שואה לאחר המלחמה','ב-1939 הפליגה האונייה עם כ-900 פליטים. קובה וארה״ב סירבו לקלוט אותם והיא חזרה לאירופה.'],
['שואה','עם איזה שלב בשואה מזוהה ועידת ואנזה?','הפתרון הסופי','חוקי נירנברג|ליל הבדולח|הקמת הגטאות','בינואר 1942 תיאמו בכירים נאצים את ההשמדה השיטתית של יהודי אירופה.'],
['שואה','מי מעניק את אות חסיד אומות העולם?','יד ושם','הכנסת|נשיא המדינה|האו״ם','ועדה ביד ושם בודקת עדויות ומעניקה את האות ללא-יהודים שהצילו יהודים בסיכון חייהם.'],
['שואה','מי הועמדו לדין במשפטי נירנברג?','ראשי המשטר הנאצי','משתפי פעולה יהודים|קציני האס-אס הזוטרים בלבד|אדולף אייכמן','בית הדין הבינלאומי (1945–1946) שפט את מנהיגי הרייך. אייכמן ברח ונשפט בישראל ב-1961.'],
['שואה','מה הייתה טענת בגין ביחס להסכם השילומים?','קבלת השילומים היא עוול מוסרי ומחילה רשמית לנאצים','הסכום נמוך מדי|יש לחלק את הכסף לניצולים בלבד|ההסכם חיוני לכלכלה','בגין הוביל הפגנה סוערת מול הכנסת ב-1952. בן גוריון טען שההסכם הכרחי לכלכלת המדינה.'],
['שואה','באיזה מושג השתמש בן גוריון ביחס להסכם השילומים?','״גרמניה האחרת״','״לא עוד״|״מחילה ופיוס״|״עם לבדד ישכון״','בן גוריון הבחין בין גרמניה הנאצית לבין גרמניה המערבית החדשה, שאפשר לנהל איתה יחסים.'],
['שואה','באילו רעיונות השתמשו הנאצים בתפיסת עולמם?','גזענות','ליברליזם|קומוניזם|פציפיזם','האידאולוגיה הנאצית חילקה בני אדם ל״גזעים״ עליונים ונחותים. הנאצים ראו בקומוניזם אויב.'],
['שואה','מה היה השינוי באנטישמיות בעת החדשה?','היא הפכה לגזענית ו״מדעית״','היא הפכה לדתית בלבד|היא נעלמה במערב|היא הפכה לכלכלית בלבד','השנאה הישנה הייתה דתית ואפשר היה להתנצר. האנטישמיות הגזענית ראתה ביהודים גזע, ולכן לא השאירה דרך מילוט.'],
['שואה','כיצד עלו הנאצים לשלטון?','באמצעות בחירות דמוקרטיות','בהפיכה צבאית|במינוי בידי בעלות הברית|במהפכה אלימה','המפלגה הנאצית הייתה הגדולה ברייכסטאג, והיטלר מונה לקנצלר בינואר 1933. ניסיון ההפיכה שלו ב-1923 נכשל.'],
['שואה','את מי שלח היטלר ראשונים למחנות ריכוז?','קומוניסטים וסוציאליסטים','יהודי פולין|צוענים|שבויי מלחמה סובייטים','דכאו, המחנה הראשון (1933), נועד בעיקר למתנגדים פוליטיים.'],
['שואה','מה קבעו חוקי נירנברג?','שהיהודים אינם אזרחים של הרייך','שיש להשמיד את היהודים|שיהודים חייבים לעזוב לפלשתינה|שיש להעמיד לדין פושעי מלחמה','חוקי 1935 שללו את האזרחות מהיהודים ואסרו נישואים בין יהודים ל״ארים״. אין לבלבל עם משפטי נירנברג.'],
['שואה','מה התרחש בליל הבדולח?','התקפות על בתי כנסת, בתים ועסקים יהודיים בגרמניה','פלישת גרמניה לפולין|ועידת ואנזה|גירוש יהודי הונגריה','בנובמבר 1938 נשרפו מאות בתי כנסת ונשברו חלונות ראווה, ומכאן השם. כ-30 אלף יהודים נשלחו למחנות.'],
['שואה','מה נידון בוועידת אוויאן?','גורלם של הפליטים היהודים שביקשו לברוח מגרמניה','הפתרון הסופי|חלוקת ארץ ישראל|הענשת הנאצים','ביולי 1938 נפגשו 32 מדינות, וכמעט אף אחת לא הסכימה לקלוט פליטים.'],
['שואה','מה היה מבצע ברברוסה?','מבצע של גרמניה הנאצית לכיבוש מזרח אירופה (הרחבת השלטון מזרחה)','כיבוש צרפת|פלישה לבריטניה|הקמת מחנה אושוויץ','ביוני 1941 פלשה גרמניה לברית המועצות. בעקבות הפלישה החל רצח המוני של יהודים.'],
['שואה','באיזו דרך רצחו הגרמנים יהודים במבצע ברברוסה?','ירי בבורות','תאי גזים|הרעבה בגטאות|צעדות מוות','האיינזצגרופן רצחו כמיליון וחצי יהודים בירי, למשל בבאבי יאר. תאי הגזים הופעלו מאוחר יותר.'],
['שואה','מה הייתה מטרת מבצע ריינהרד?','להשמיד את יהדות פולין','לכבוש את ברית המועצות|לגרש את יהודי הונגריה|לפנות את המחנות בסוף המלחמה','במבצע (1942–1943) הופעלו מחנות ההשמדה בלז׳ץ, סוביבור וטרבלינקה.'],
['שואה','מה היה מחנה ההשמדה הראשון?','חלמנו','אושוויץ|טרבלינקה|דכאו','חלמנו החל לפעול בדצמבר 1941 עם משאיות גז. דכאו היה מחנה ריכוז, לא מחנה השמדה.'],
['שואה','מי היו הפרטיזנים?','יהודים ולא יהודים שלחמו בשלטון הגרמני באירופה','חיילי צבא בריטניה|משתפי פעולה עם הנאצים|ניצולים שעלו לארץ','הפרטיזנים לחמו מהיערות בחבלה ובמארבים. רבים מהם היו יהודים שברחו מהגטאות.'],
['שואה','מי היו שארית הפליטה?','ניצולי שואה ששרדו את המלחמה','המגורשים מספרד|פליטי מלחמת העצמאות|יהודי ברית המועצות','הכינוי לקוח מהתנ״ך. רבים מהניצולים שהו במחנות עקורים ומשם עלו לארץ.'],
['שואה','מה הם דפי עד?','דפים שבהם מעידים ניצולים על קרוביהם שנרצחו','פרוטוקולים של משפט אייכמן|תעודות של חסידי אומות עולם|מסמכים נאציים','יד ושם אוסף את דפי העד כדי לשמור את שמות הנרצחים ופרטיהם.'],
['שואה','מי אמר ״במקום זה בו אני עומד... עמדי ניצבים שישה מיליון קטגורים״?','גדעון האוזנר במשפט אייכמן','דוד בן גוריון|מנחם בגין|חיים ויצמן','זו פתיחת נאום התביעה של היועץ המשפטי לממשלה, גדעון האוזנר, ב-1961.'],
['שואה','במה מהווה משפט אייכמן נקודת מפנה?','שינוי ביחס לניצולים, וגזר דין מוות ראשון בישראל','ההסכם הראשון עם גרמניה|הקמת יד ושם|הכרה בינלאומית במדינה','העדויות שהושמעו במשפט נתנו קול לניצולים. אייכמן הוצא להורג ב-1962, הפעם היחידה בישראל שבה בוצע גזר דין מוות אזרחי.'],
['שואה','איזה צעד הוביל לסיום מלחמת העולם השנייה?','2 פצצות אטום שהטילה ארה״ב על יפן','כיבוש ברלין בידי ארה״ב|ועידת יאלטה|פלישת נורמנדי','גרמניה נכנעה במאי 1945, ויפן נכנעה בספטמבר אחרי הירושימה ונגסאקי. ברלין נכבשה בידי ברית המועצות.'],

// ===== מדינת ישראל =====
['מדינה','איזו עיר נכבשה במבצע עובדה?','אילת','באר שבע|ירושלים|צפת','במרץ 1949 הגיעו כוחות צה״ל לאום רשרש והניפו את ״דגל הדיו״. זה היה המבצע האחרון במלחמת העצמאות.'],
['מדינה','איזו מלחמה הסתיימה בהסכמי שביתת הנשק ברודוס?','מלחמת העצמאות','מבצע קדש|ששת הימים|יום הכיפורים','ב-1949 נחתמו ברודוס הסכמים עם מצרים, ירדן, לבנון וסוריה, בתיווך ראלף באנץ׳. כך נקבע ״הקו הירוק״.'],
['מדינה','מתי הוקם צה״ל?','26 במאי 1948','14 במאי 1948|29 בנובמבר 1947|1 בינואר 1949','פקודת צבא הגנה לישראל פורסמה 12 ימים אחרי הכרזת העצמאות. ב-29 בנובמבר התקבלה החלטת החלוקה.'],
['מדינה','מתי פורק ארגון ההגנה?','1948','1947|1950|1956','עם הקמת צה״ל ב-1948 התאחדו בו ההגנה, ובהמשך גם האצ״ל והלח״י.'],
['מדינה','מתי הופצצה האונייה אלטלנה?','יוני 1948','מאי 1948|ינואר 1949|נובמבר 1947','ב-22 ביוני 1948, בזמן ההפוגה הראשונה, בן גוריון הורה להפגיז את האונייה מול חוף תל אביב.'],
['מדינה','מה הובילה הספינה אלטלנה?','נשק שרכש האצ״ל ועולים חדשים','מעפילים מאירופה בלבד|ציוד רפואי לצה״ל|מזון לירושלים הנצורה','המחלוקת הייתה למי יגיע הנשק. בן גוריון ראה בכך איום על ״צבא אחד למדינה אחת״.'],
['מדינה','בעקבות מי ומתי התקיימה ״ההפוגה הראשונה״?','פולקה ברנדוט, 11 ביוני 1948','ראלף באנץ׳, ינואר 1949|דג המרשלד, 1956|הנרי קיסינג׳ר, 1974','הרוזן ברנדוט היה מתווך האו״ם. הלח״י רצח אותו בספטמבר 1948, ובאנץ׳ החליף אותו.'],
['מדינה','מתי נחקק חוק השבות?','5 ביולי 1950','14 במאי 1948|1 בינואר 1952|1967','החוק נחקק ביום השנה למות הרצל (כ׳ בתמוז). הוא מעגן את זכות כל יהודי לעלות.'],
['מדינה','מה הייתה הבעיה בחוק השבות?','החוק לא קבע הגדרה למיהו יהודי','החוק חל רק על ניצולי שואה|החוק לא חל על יהודי ארצות ערב|החוק אסר עלייה מברית המועצות','בהיעדר הגדרה הגיעו מקרים כמו האח דניאל ושליט לבג״ץ. ב-1970 הוסף לחוק תיקון שמגדיר מיהו יהודי.'],
['מדינה','מה הסכם/מכתב הסטטוס קוו?','מכתב ששלח בן גוריון למנהיגי הציבור החרדי','הסכם עם ירדן על ירושלים|מכתב לנשיא ארה״ב|הסכם שביתת נשק עם מצרים','ב-1947 שלח בן גוריון מכתב לאגודת ישראל. הוא הבטיח שבת, כשרות, דיני אישות ואוטונומיה בחינוך.'],
['מדינה','מהם דיני האישות?','נישואין וגירושין מופקדים בידי מערכת השיפוט הרבנית','חוקי הירושה|חוקי האזרחות|חוקי השבת','זה אחד מסעיפי הסטטוס קוו. לכל עדה דתית יש בתי דין משלה לענייני נישואין וגירושין.'],
['מדינה','מה קובע חוק נכסי נפקדים?','אדמות מי שעזב לארצות אויב במלחמת העצמאות יופקעו ממנו','כל עולה מקבל קרקע|קרקעות המדינה יימכרו|הקרקעות שייכות לקק״ל בלבד','החוק (1950) העביר את נכסיהם של מי שעזבו לידי האפוטרופוס לנכסי נפקדים.'],
['מדינה','באיזו תפיסה השתמש היישוב לפני ואחרי הקמת המדינה?','לפני — יישובית, אחרי — ממלכתית','לפני — ממלכתית, אחרי — יישובית|תמיד ממלכתית|תמיד יישובית','בן גוריון קידם ״ממלכתיות״: העברת סמכויות מתנועות ומפלגות למדינה, למשל צבא אחד וחינוך ממלכתי.'],
['מדינה','מה קרה בעקבות העלייה הגדולה בשנות ה-50?','עול כלכלי כבד','שגשוג כלכלי מיידי|הפסקה מוחלטת של העלייה|ירידה באוכלוסייה','אוכלוסיית המדינה הוכפלה תוך שנים ספורות. בעקבות זאת הונהגו הצנע והמעברות.'],
['מדינה','מהם מבצעי העלייה של שנות ה-50 וה-60?','מרבד הקסמים, עזרא ונחמיה ויכין','שלמה, משה ויהושע|שלח את עמי ומבצע יונתן|אקסודוס ועליית גומולקה','מרבד הקסמים העלה את יהודי תימן, עזרא ונחמיה את יהודי עיראק, ויכין את יהודי מרוקו. משה ושלמה היו מאתיופיה.'],
['מדינה','מהו מבצע עזרא ונחמיה?','העלאת יהודי עיראק בשנות ה-50','העלאת יהודי תימן|העלאת יהודי אתיופיה|העלאת יהודי מרוקו','בשנים 1950–1952 עלו כ-120 אלף יהודים מעיראק. השם לקוח ממנהיגי שיבת ציון מבבל.'],
['מדינה','מי עלו במבצע יכין?','יהודי מרוקו','יהודי עיראק|יהודי תימן|יהודי אתיופיה','מבצע יכין (1961–1964) היה חשאי, והעלה כ-97 אלף יהודים ממרוקו.'],
['מדינה','מהי עליית גומולקה?','עליית שארית יהודי פולין ב-1956','עליית יהודי רומניה ב-1948|עליית יהודי ברה״מ בשנות ה-90|עליית יהודי מרוקו','העלייה נקראת על שם ולדיסלב גומולקה, מנהיג פולין, שהתיר את יציאת היהודים.'],
['מדינה','באילו שנים הייתה עליית ״שלח את עמי״?','שנות ה-70','שנות ה-50|שנות ה-90|שנות ה-30','אחרי ששת הימים גבר המאבק של יהודי ברה״מ, ובשנות ה-70 עלו כ-150 אלף. העלייה הגדולה מברה״מ הייתה בשנות ה-90.'],
['מדינה','מתי התרחש מבצע שלמה?','שנות ה-90','שנות ה-50|שנות ה-70|שנות ה-80','במאי 1991 הוטסו יהודי אתיופיה בתוך 36 שעות. מבצע משה התרחש ב-1984.'],
['מדינה','כמה עולים עלו במבצע שלמה?','כ-14 אלף','כ-1,400|כ-50 אלף|כ-100 אלף','כ-14,000 עולים הוטסו ברכבת אווירית בתוך יממה וחצי בלבד.'],
['מדינה','מדוע היה קשה לממש את עליית ביתא ישראל?','בגלל הריחוק הגאוגרפי','בגלל התנגדות הכנסת|בגלל מחסור במטוסים בלבד|בגלל חוק השבות','המרחק הגדול, יחד עם מצב פוליטי קשה באתיופיה ובסודן, חייב מבצעים חשאיים ומורכבים.'],
['מדינה','בין אילו קבוצות נוצר פער תרבותי בשנות העלייה הגדולה?','בין עולי ארצות האסלאם וניצולי השואה לבין הצברים','בין דתיים לחילונים בלבד|בין עולים מאמריקה לעולים מאירופה|בין ערבים ליהודים','מדיניות ״כור ההיתוך״ דרשה מהעולים לוותר על תרבותם. זה יצר מתחים מול הוותיקים והצברים.'],
['מדינה','מה מאפיין את עיירות הפיתוח?','מרכזים עירוניים שהוקמו במטרה לפזר אוכלוסייה','קיבוצים חקלאיים|שכונות יוקרה|בסיסים צבאיים','בשנות ה-50 הוקמו עיירות כמו דימונה וקריית שמונה. הן יישבו עולים בפריפריה כדי לפזר את האוכלוסייה.'],
['מדינה','כיצד פרצו אירועי ואדי סאליב?','שוטרים ירו ברגלו של שיכור כדי לרסנו','שביתת פועלים בנמל|הפגנה נגד הממשל הצבאי|פינוי משכונת מעברות','ב-1959, בחיפה, פרצה מחאה של עולים ממרוקו נגד אפליה עדתית. זה היה ביטוי מוקדם למתח העדתי.'],
['מדינה','מה הרקע למחאת הפנתרים השחורים?','קיפוח כלכלי-חברתי על בסיס מוצא','התנגדות להסכמי השלום|מחאה נגד גיוס חרדים|מחאה על מחירי הדיור בלבד','בשנים 1971–1972 מחו צעירים ממוצא מזרחי בשכונת מוסררה בירושלים על אפליה ועוני.'],
['מדינה','מי היו אסירי ציון בשנות ה-70?','יהודים שנאבקו בשלטונות ברה״מ על זכותם להגר לישראל','מחבלים שנכלאו בישראל|לוחמי מחתרות בתקופת המנדט|עולים שנעצרו בגבול','בגלל המאבק הם נכלאו או נשלחו לגולג. המוכר שבהם הוא נתן שרנסקי.'],
['מדינה','מדוע עתר בנימין שליט לבג״ץ?','כדי שילדיו מאם לא-יהודייה יירשמו כבני הלאום היהודי','כדי לקבל אזרחות|כדי לפטור את ילדיו משירות|כדי לבטל את חוק השבות','בג״ץ קיבל את העתירה ב-1970. בתגובה תיקנה הכנסת את חוק השבות וקבעה מיהו יהודי.'],
['מדינה','מיהו האח דניאל?','אוסוולד רופאייזן — יהודי שהסתתר במנזר בשואה והתנצר','פרטיזן יהודי בליטא|רב שהציל ילדים בשואה|חסיד אומות עולם פולני','רופאייזן ביקש לעלות לפי חוק השבות. בג״ץ (1962) קבע שמי שהמיר את דתו אינו נחשב יהודי לעניין החוק.'],
['מדינה','מה מכונה הטבח בכפר קאסם?','הרג ערבים אזרחי ישראל בידי לוחמי מג״ב ביום הראשון של מבצע קדש','פיגוע במלחמת ששת הימים|קרב במלחמת העצמאות|אירוע באינתיפאדה השנייה','ב-1956 נהרגו 49 תושבים שחזרו לכפר ולא ידעו על העוצר.'],
['מדינה','באיזו שנה נקבע המושג ״פקודה בלתי חוקית בעליל״?','1957','1948|1967|1973','השופט בנימין הלוי קבע את המושג במשפט כפר קאסם: על פקודה כזו מתנוסס ״דגל שחור״, ואסור לציית לה.'],
['מדינה','מהי יחידה 101 ומי עמד בראשה?','יחידה מיוחדת בשנות ה-50 בראשות אריאל שרון','יחידת מודיעין בראשות חיים הרצוג|סיירת בשנות ה-70 בראשות יוני נתניהו|יחידת צנחנים בראשות משה דיין','היחידה הוקמה ב-1953 לפעולות תגמול. אחרי כמה חודשים אוחדה עם גדוד הצנחנים.'],
['מדינה','לשם מה שימשה יחידה 101?','מעבדה לבחינת שיטות לחימה','יחידת מודיעין|יחידת חילוץ|יחידת הדרכה לטירונים','שיטות הלחימה שפותחו בה, כמו פשיטות לילה ודבקות במשימה, הפכו לבסיס תורת הלחימה של צה״ל.'],
['מדינה','מי הן יחידות הפדאיון?','חוליות הכפופות למודיעין המצרי שחדרו מגבולות מצרים וירדן','יחידות קומנדו ירדניות|לוחמי חיזבאללה|כוחות או״ם','הפדאיון ביצעו פיגועים בשנות ה-50, ופעילותם הייתה אחת הסיבות למבצע קדש.'],
['מדינה','איזה תפקיד מרכזי מילא משה שרת לפני שהיה ראש ממשלה?','שר החוץ','שר הביטחון|הרמטכ״ל|יו״ר הכנסת','שרת היה שר החוץ הראשון, וכיהן כראש ממשלה בשנים 1954–1955, כשבן גוריון פרש לשדה בוקר.'],
['מדינה','מי היה ראש הממשלה במבצע קדש (מלחמת סיני)?','דוד בן גוריון','לוי אשכול|משה שרת|גולדה מאיר','ב-1956 בן גוריון היה ראש הממשלה ושר הביטחון, ומשה דיין היה הרמטכ״ל.'],
['מדינה','באיזו מלחמה הוצנח גדוד צנחנים ליד מעבר המיתלה?','מלחמת סיני','מלחמת ששת הימים|מלחמת יום הכיפורים|מלחמת ההתשה','הצניחה ליד המיתלה פתחה את מבצע קדש באוקטובר 1956.'],
['מדינה','לפני איזו מלחמה הייתה ״תקופת ההמתנה״?','מלחמת ששת הימים','מלחמת יום הכיפורים|מלחמת סיני|מלחמת לבנון הראשונה','במאי 1967 חסמה מצרים את מצרי טיראן. ישראל גייסה מילואים והמתינה כשלושה שבועות לפני שיצאה למלחמה.'],
['מדינה','מי היה ראש הממשלה במלחמת ששת הימים?','לוי אשכול','גולדה מאיר|דוד בן גוריון|יצחק רבין','אשכול היה ראש הממשלה, ובתקופת ההמתנה מינה את משה דיין לשר הביטחון.'],
['מדינה','מי היה הרמטכ״ל במלחמת ששת הימים?','יצחק רבין','משה דיין|דוד אלעזר|חיים בר-לב','רבין היה הרמטכ״ל ודיין היה שר הביטחון. דוד אלעזר פיקד אז על פיקוד הצפון.'],
['מדינה','בכמה חזיתות פעל צה״ל במלחמת ששת הימים?','3','2|4|5','צה״ל לחם נגד מצרים בסיני, נגד ירדן ביהודה ושומרון ובירושלים, ונגד סוריה ברמת הגולן.'],
['מדינה','מי אמר ״הר הבית בידינו״?','מוטה גור','משה דיין|יצחק רבין|הרב גורן','מוטה גור, מפקד חטיבת הצנחנים, אמר את המשפט בקשר ב-7 ביוני 1967.'],
['מדינה','מהי תכנית אלון?','התיישבות בשטחים ריקים יחסית ובעלי חשיבות ביטחונית שיסופחו לישראל','נסיגה מלאה לקווי 1967|הקמת מדינה פלסטינית|פיתוח עיירות בנגב','יגאל אלון הציע אחרי 1967 להחזיק בבקעת הירדן ובאזורים ביטחוניים, ולהחזיר את האזורים הצפופים.'],
['מדינה','מי היה שר הביטחון במלחמת ההתשה?','משה דיין','יגאל אלון|שמעון פרס|עזר ויצמן','דיין כיהן כשר הביטחון ברציפות מ-1967 עד 1974, כולל במלחמת ההתשה ובמלחמת יום הכיפורים.'],
['מדינה','מה הם המעוזים?','מוצבים מבוצרים שהוקמו לאורך תעלת סואץ','מוצבים בגבול לבנון|יישובי ספר בגולן|בסיסי חיל האוויר בסיני','המעוזים היו חלק מ״קו בר-לב״, שנבנה במלחמת ההתשה.'],
['מדינה','מי היה הנשיא במלחמת יום הכיפורים?','אפרים קציר','זלמן שזר|יצחק נבון|חיים הרצוג','קציר נבחר לנשיא ב-1973, כמה חודשים לפני המלחמה. שזר סיים את כהונתו באותה שנה.'],

['מדינה','מי היה ראש הממשלה בזמן מבצע יונתן?','יצחק רבין','מנחם בגין|גולדה מאיר|שמעון פרס','רבין כיהן בקדנציה הראשונה (1974–1977), ושמעון פרס היה שר הביטחון.'],

['מדינה','מה היה היעד הראשון במבצע חומת מגן?','רמאללה','ג׳נין|שכם|חברון','צה״ל נכנס ראשון לרמאללה וכיתר את המוקטעה של ערפאת. אחר כך פעל גם בג׳נין, בשכם ובערים נוספות.'],

['מדינה','היכן ממוקמת מדרשת בן גוריון?','בנקודה הצופה אל נחל צין','מול הכנרת|בהר הכרמל|ליד מכתש רמון','המדרשה נמצאת בשדה בוקר שבנגב, ליד קבר בן גוריון ומול נוף נחל צין.'],
['מדינה','מי אמר ״עם שאינו יודע את עברו, ההווה שלו דל ועתידו לוט בערפל״?','יגאל אלון','דוד בן גוריון|משה דיין|יצחק רבין','יגאל אלון, מפקד הפלמ״ח ולימים שר החינוך, הדגיש את חשיבות ההיסטוריה והמורשת.'],

['מדינה','איזה אגף בצה״ל הקים הנשיא הרצוג?','אגף המודיעין','אגף התכנון|אגף כוח האדם|חיל המדע','הרצוג היה ראש אמ״ן הראשון. את חיל המדע הקים אפרים קציר.'],

['נשק','נכון או לא נכון: יש לסחוט את ההדק במהירות.','לא נכון','נכון','סחיטת הדק היא לחיצה איטית, רציפה והדרגתית. לחיצה מהירה או חטופה מזיזה את הנשק ופוגעת בדיוק.'],
