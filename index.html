<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בוחן בה״ד 1</title>
<meta name="description" content="תרגול שאלות לקראת בה״ד 1: סבבים קצרים, בחינה חוזרת והסבר אחרי כל תשובה.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#58702a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="בוחן בה״ד">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: app shell — home (topic medallions) → lesson (top progress, question, fixed answer footer) → lesson-complete */
:root{
  --bg:#f6f5ef; --surface:#ffffff; --fg:#1c2117; --muted:#6a7160; --line:#dedcd0; --line-deep:#c9c6b6;
  --accent:#58702a; --accent-deep:#3f5219; --accent-soft:#eaf0d8;
  --sel:#3b82c4; --sel-soft:#e4f0fb;
  --good:#3c9a3f; --good-deep:#2b7a2e; --good-soft:#d9f2d4; --good-ink:#1f5e22;
  --bad:#d9443a; --bad-deep:#ae2f27; --bad-soft:#fde0dc; --bad-ink:#8f231c;
  --fire:#f2a01c; --fire-deep:#c87a00; --gold:#f5c33b;
  --display:"Rubik","Arial Hebrew",sans-serif; --body:"Assistant","Arial",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12150f; --surface:#1b1f17; --fg:#eceee4; --muted:#9ba290; --line:#30362a; --line-deep:#252a20;
  --accent:#9cbc52; --accent-deep:#6f8a33; --accent-soft:#263018;
  --sel:#6aaee8; --sel-soft:#1b2b3a;
  --good:#5cc35f; --good-deep:#3c9a3f; --good-soft:#18301a; --good-ink:#a6e8a3;
  --bad:#ef6b61; --bad-deep:#c2433a; --bad-soft:#3a1b18; --bad-ink:#ffb4ac;
  --fire:#f6ad33; --fire-deep:#b87100; --gold:#f5c33b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12150f; --surface:#1b1f17; --fg:#eceee4; --muted:#9ba290; --line:#30362a; --line-deep:#252a20;
  --accent:#9cbc52; --accent-deep:#6f8a33; --accent-soft:#263018;
  --sel:#6aaee8; --sel-soft:#1b2b3a;
  --good:#5cc35f; --good-deep:#3c9a3f; --good-soft:#18301a; --good-ink:#a6e8a3;
  --bad:#ef6b61; --bad-deep:#c2433a; --bad-soft:#3a1b18; --bad-ink:#ffb4ac;
  --fire:#f6ad33; --fire-deep:#b87100; --gold:#f5c33b; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;direction:rtl;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
#app{height:100%}
.screen{height:100%;display:flex;flex-direction:column}
.inner{width:100%;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.icon-btn{background:none;border:0;padding:6px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{color:var(--fg)}
.icon-btn svg{width:26px;height:26px}

/* big chunky button */
.big{width:100%;border:0;border-radius:16px;padding:15px 18px;font:800 1.08rem var(--display);letter-spacing:.02em;background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-deep);transition:transform .06s,box-shadow .06s}
.big:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--accent-deep)}
.big:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-deep);cursor:default}
.big.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.big.ok{background:var(--good);box-shadow:0 4px 0 var(--good-deep)}
.big.no{background:var(--bad);box-shadow:0 4px 0 var(--bad-deep)}

/* ---------- HOME ---------- */
#home{overflow-y:auto}
.home-head{padding-block:22px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font:900 1.9rem/1.05 var(--display);margin:0;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.head-tools{display:flex;align-items:center;gap:6px}
.xp-pill{display:flex;align-items:center;gap:5px;font:800 .95rem var(--display);color:var(--fire-deep);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.xp-pill svg{width:18px;height:18px}
.home-body{display:flex;flex-direction:column;gap:22px;padding-block:12px 40px}
.quick{display:flex;flex-direction:column;gap:12px;background:var(--accent-soft);border:2px solid var(--accent);border-radius:20px;padding:18px}
.quick h2{font:800 1.25rem var(--display);margin:0}
.quick p{margin:0;color:var(--muted)}
.len{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.len span{font-weight:700;font-size:.9rem;color:var(--muted)}
.seg{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:5px 14px;font:700 .95rem var(--display);font-variant-numeric:tabular-nums}
.seg[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-soft);color:var(--sel)}
.sec-title{font:800 1.1rem var(--display);margin:0 0 -8px}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 0;margin:-8px 0;background:var(--bg)}
.tab{display:flex;align-items:center;justify-content:center;gap:7px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--muted);border-radius:14px;padding:10px 8px;font:800 1rem var(--display)}
.tab svg{width:20px;height:20px;flex:none}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep)}
.pane{display:flex;flex-direction:column;gap:22px}
.pane[hidden]{display:none}
.tab-hint{margin:-12px 0 0;color:var(--muted);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.topic{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:16px 10px 14px;transition:transform .06s}
.topic:active{transform:translateY(3px);border-bottom-width:2px}
.medal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:900 1.5rem var(--display);color:#fff;background:var(--c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.topic b{font:700 1rem var(--display)}
.topic small{color:var(--muted);font-variant-numeric:tabular-nums}
.tbar{width:80%;height:8px;border-radius:99px;background:var(--line);overflow:hidden;direction:rtl}
.tbar i{display:block;height:100%;background:var(--c);border-radius:99px}
.topic.full .medal::after{content:"✓";position:absolute;font-size:.9rem;bottom:-4px;left:-4px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#5a3d00;display:grid;place-items:center;border:2px solid var(--surface)}
.medal{position:relative}
.prog{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.prog-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prog-row b{font:800 1rem var(--display);font-variant-numeric:tabular-nums}
.prog .bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.toggle{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font:700 .98rem var(--body);text-align:right}
.toggle .sw{flex:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:right .2s}
.toggle[aria-pressed="true"] .sw{background:var(--good)}
.toggle[aria-pressed="true"] .sw::after{right:21px}
.link{background:none;border:0;padding:0;color:var(--muted);font:600 .88rem var(--body);text-decoration:underline}

/* ---------- LESSON ---------- */
#lesson{position:relative}
.top{display:flex;align-items:center;gap:12px;padding-block:14px 6px}
.pbar{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden;position:relative}
.pbar i{position:absolute;inset:0 0 0 auto;width:0;background:var(--good);border-radius:999px;transition:width .45s cubic-bezier(.3,1.5,.5,1),background .3s}
.pbar i::after{content:"";position:absolute;top:3px;left:8px;right:8px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.pbar.fire i{background:linear-gradient(270deg,var(--gold),var(--fire));box-shadow:0 0 12px var(--fire)}
.combo{display:flex;align-items:center;gap:2px;font:900 1.05rem var(--display);color:var(--fire-deep);min-width:46px;justify-content:center;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;font-variant-numeric:tabular-nums}
.combo.on{opacity:1;transform:scale(1)}
.combo.bump{animation:bump .35s}
.combo svg{width:24px;height:24px}
@keyframes bump{40%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
.stage{flex:1;overflow-y:auto;padding-block:14px 20px;display:flex;flex-direction:column;gap:16px}
.kicker{display:flex;align-items:center;gap:8px;font:700 .85rem var(--display);color:var(--sel)}
.kicker .retry{color:var(--fire-deep)}
.qrow{display:flex;gap:10px;align-items:flex-start}
#qtext{font:800 1.45rem/1.35 var(--display);margin:0;text-wrap:balance;flex:1;min-width:0}
#speak{background:var(--sel);color:#fff;border:0;border-radius:14px;padding:8px;box-shadow:0 3px 0 #2a5f91;flex:none}
#speak svg{width:24px;height:24px;display:block}
#speak:active{transform:translateY(3px);box-shadow:none}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:right;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:13px 14px;font:600 1.02rem/1.4 var(--body);min-width:0;transition:transform .06s,background .15s,border-color .15s}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.opt kbd{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font:700 .85rem var(--display);color:var(--muted)}
.opt.sel{border-color:var(--sel);background:var(--sel-soft);color:var(--sel)}
.opt.sel kbd{border-color:var(--sel);color:var(--sel)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good-ink);animation:pop .4s}
.opt.right kbd{border-color:var(--good);color:var(--good-ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.opt.wrong kbd{border-color:var(--bad);color:var(--bad-ink)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.5}
@keyframes pop{35%{transform:scale(1.04)}100%{transform:scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.foot{border-top:2px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .2s,border-color .2s}
.foot .inner{padding-block:14px 16px;display:flex;flex-direction:column;gap:12px}
.foot.ok{background:var(--good-soft);border-color:transparent}
.foot.no{background:var(--bad-soft);border-color:transparent}
.sheet{display:none;flex-direction:column;gap:6px;max-height:38vh;overflow-y:auto}
.foot.ok .sheet,.foot.no .sheet{display:flex;animation:rise .28s cubic-bezier(.2,1.3,.5,1)}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.verdict{display:flex;align-items:center;gap:10px;font:900 1.3rem var(--display)}
.verdict i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.verdict i svg{width:22px;height:22px}
.foot.ok .verdict{color:var(--good-ink)} .foot.ok .verdict i{color:var(--good)}
.foot.no .verdict{color:var(--bad-ink)} .foot.no .verdict i{color:var(--bad)}
.ans{margin:0;font-weight:700}
.foot.no .ans{color:var(--bad-ink)}
.why{margin:0;font-size:.97rem}
.foot.ok .why{color:var(--good-ink)} .foot.no .why{color:var(--bad-ink)}
.float{position:fixed;font:900 1.3rem var(--display);color:var(--fire-deep);pointer-events:none;z-index:30;animation:floatup 1s ease-out forwards;text-shadow:0 2px 0 var(--surface)}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-10px);background:var(--fire);color:#fff;font:900 1.05rem var(--display);padding:8px 18px;border-radius:999px;box-shadow:0 4px 0 var(--fire-deep);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.5,1);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* quit modal */
.modal{position:fixed;inset:0;background:rgba(10,12,8,.55);display:grid;place-items:end center;z-index:40;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.modal .box{background:var(--surface);border-radius:22px;padding:22px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:rise .25s}
.modal h3{font:800 1.25rem var(--display);margin:0}
.modal p{margin:0;color:var(--muted)}

/* ---------- ACCESS / SUBSCRIPTION ---------- */
.access{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--fire);border-radius:18px;padding:14px 16px}
.access.ok{border-color:var(--line)}
.access b{font:800 1.02rem var(--display)}
.access p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.access .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.modal .box{max-height:calc(100dvh - 32px);overflow:auto}
.pw-price{font:900 1.7rem var(--display);color:var(--accent)}
.pw-price small{font:600 .9rem var(--body);color:var(--muted)}
.pw-list{margin:0;padding:0 20px 0 0;text-align:right;display:flex;flex-direction:column;gap:6px}
.pw-step{display:flex;flex-direction:column;gap:10px;text-align:right}
.pw-step p{color:var(--fg)}
.pw-note{font-size:.82rem;color:var(--muted)}
.modal p.pw-note{color:var(--muted)}
#gsiBtn{display:flex;justify-content:center;min-height:44px}
.pw-mail{background:var(--sel-soft);border:2px solid var(--sel);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.pw-mail .addr{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.pw-mail .addr b{direction:ltr;font:700 1rem var(--body);word-break:break-all}
.pw-mail .link{color:var(--sel)}
.pw-step label.terms{display:flex;align-items:center;gap:8px;font-size:.92rem}
.pw-step label.terms input{width:20px;height:20px;accent-color:var(--accent);flex:none}
a.big{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
a.big[aria-disabled="true"]{opacity:.45;pointer-events:none}
.og-errors{color:var(--bad-ink);font-weight:600}
.og-errors:empty{display:none}
.path-end .big{margin-top:10px}

/* ---------- INSTALL ---------- */
.install{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:2px solid var(--accent);border-radius:18px;padding:12px 14px}
.install img{width:44px;height:44px;border-radius:11px;flex:none}
.install .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.install .txt b{font:800 1rem var(--display)}
.install .txt small{color:var(--muted);font-size:.86rem;line-height:1.3}
.install .go{width:auto;padding:10px 16px;font-size:.95rem;flex:none}
.install .x{flex:none;align-self:flex-start;margin:-4px -6px 0 0}
.install .x svg{width:20px;height:20px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;text-align:right}
.steps li{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:10px 12px;font-weight:600}
.steps .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 .95rem var(--display)}
.steps svg{width:22px;height:22px;flex:none;color:var(--sel);vertical-align:middle}

/* ---------- DONE ---------- */
#done{overflow-y:auto}
.done-body{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:36px 32px;text-align:center;flex:1}
.trophy{width:132px;height:132px;animation:drop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes drop{from{transform:translateY(-60px) scale(.4) rotate(-15deg);opacity:0}}
.done-body h2{font:900 2rem/1.1 var(--display);margin:0;color:var(--fire-deep);text-wrap:balance}
.done-body h2.perfect{color:var(--gold);text-shadow:0 2px 0 var(--fire-deep)}
.done-body .sub{margin:-8px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.stat{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--surface);animation:rise .4s backwards}
.stat:nth-child(2){animation-delay:.12s}.stat:nth-child(3){animation-delay:.24s}.stat:nth-child(4){animation-delay:.36s}
.stat span{display:block;background:var(--c);color:#fff;font:800 .75rem var(--display);padding:4px 2px;letter-spacing:.03em}
.stat b{display:block;font:900 1.35rem var(--display);padding:10px 2px;color:var(--c);font-variant-numeric:tabular-nums}
.done-actions{display:flex;flex-direction:column;gap:12px;width:100%}
.review{width:100%;text-align:right;display:flex;flex-direction:column;gap:10px}
.review h3{font:800 1.05rem var(--display);margin:6px 0 0}
.rv{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rv strong{font-family:var(--display);font-weight:700}
.rv .p{color:var(--bad-ink);font-size:.93rem;text-decoration:line-through;text-decoration-thickness:1px}
.rv .a{color:var(--good-ink);font-weight:700}
.rv .w{color:var(--muted);font-size:.93rem}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}

/* path */
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:4px 10px}
.stage-head{width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;background:var(--accent);color:#fff;border-radius:18px;padding:14px 18px;box-shadow:0 4px 0 var(--accent-deep);margin-top:10px}
.stage-head b{font:900 1.15rem var(--display)}
.stage-head span{font-size:.9rem;opacity:.9}
.stage-head.locked{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-deep)}
.node-wrap{position:relative;transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center;padding-bottom:16px}
.node{width:72px;height:66px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--accent);color:#fff;box-shadow:0 7px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s;position:relative}
.node svg{width:32px;height:32px}
.node:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px 0 var(--accent-deep)}
.node.review{background:var(--gold);color:#7a4c00;box-shadow:0 7px 0 var(--fire-deep)}
.node.lock{background:var(--line);color:var(--muted);box-shadow:0 7px 0 var(--line-deep);cursor:default}
.node.cur{width:82px;height:76px;outline:6px solid var(--accent-soft);outline-offset:4px}
.node .acc{position:absolute;bottom:-26px;font:800 .75rem var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.tip{margin-bottom:12px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font:900 .95rem var(--display);color:var(--accent);animation:hover 1.4s ease-in-out infinite;white-space:nowrap;position:relative}
.tip::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line);border-bottom:0}
.tip.review{color:var(--fire-deep)}
@keyframes hover{50%{transform:translateY(-5px)}}
.path-end{font:800 1rem var(--display);color:var(--muted);text-align:center}
/* leaderboard */
.board{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.bd-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bd-head b{font:900 1.15rem var(--display)}
.bd-head span{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:.88rem}
.bd-note{margin:0;color:var(--muted);font-size:.95rem}
.bd-chase{margin:0;background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-weight:600}
.bd-chase b{font-family:var(--display);color:var(--fire-deep)}
.bd-chase.lead{background:color-mix(in srgb,var(--gold) 22%,var(--surface))}
.bd-join{display:flex;gap:8px}
.bd-join input,.modal input{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:600 1rem var(--body);background:var(--bg);color:var(--fg)}
.bd-join input:focus,.modal input:focus{outline:none;border-color:var(--sel)}
.bd-join .big{width:auto;padding:12px 20px}
.bd-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.bd-list li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px}
.bd-list li.me{background:var(--sel-soft);outline:2px solid var(--sel)}
.bd-list li.gap{justify-content:center;color:var(--muted);padding:0}
.rk{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:900 .95rem var(--display);background:var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.rk.r0{background:var(--gold);color:#5a3d00}.rk.r1{background:#c9ced6;color:#3c434d}.rk.r2{background:#d99a62;color:#4a2a0e}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm b{font:700 1rem var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--muted);font-size:.8rem}
.bd-bar{display:block;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bd-bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.sc{flex:none;display:flex;flex-direction:column;align-items:center;font:900 1.15rem var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.sc small{font:600 .7rem var(--body);color:var(--muted)}
.overtake{margin:0;width:100%;box-sizing:border-box;background:var(--fire);color:#fff;border-radius:16px;padding:12px 16px;font:900 1.1rem var(--display);box-shadow:0 4px 0 var(--fire-deep);animation:drop .6s cubic-bezier(.2,1.6,.4,1)}
.overtake small{display:block;font:600 .9rem var(--body);opacity:.95}
.bd-sync{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:12px}
.bd-sync .big{width:auto;padding:10px 18px;font-size:.98rem}
.rd{display:flex;gap:8px}
.rd .big{width:auto}
#rdCode{text-align:center;letter-spacing:.3em;font:800 1.3rem var(--display);text-transform:uppercase;direction:ltr}
.code{font:900 2.4rem var(--display);letter-spacing:.25em;direction:ltr;color:var(--accent);background:var(--accent-soft);border-radius:16px;padding:14px 8px;font-variant-numeric:tabular-nums;user-select:all}
.err{margin:0;color:var(--bad-ink);font-weight:700}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{margin:0}
</style>

</head>
<body>
<div id="app">
  <!-- HOME -->
  <section id="home" class="screen">
    <div class="inner home-head">
      <div class="brand">
        <h1>בוחן בה״ד 1</h1>
        <p>סבבים קצרים · בחינה חוזרת כל 5 סבבים · הסבר אחרי כל תשובה</p>
      </div>
      <div class="head-tools">
        <span class="xp-pill" title="סך ה-XP שלך"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span id="sessXp">0</span></span>
        <button class="icon-btn snd" aria-label="השתק צלילים"></button>
      </div>
    </div>
    <div class="inner home-body">
      <div class="install" id="install" hidden>
        <img src="/icons/icon-192.png" alt="">
        <div class="txt"><b>להתקין כאפליקציה</b><small>אייקון במסך הבית, מסך מלא, ועובד גם בלי אינטרנט</small></div>
        <button class="big go" id="installGo">התקנה</button>
        <button class="icon-btn x" id="installX" aria-label="לא עכשיו"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="access" id="access" hidden></div>
      <div class="prog">
        <div class="prog-row"><b id="progTxt"></b><button class="link" id="reset">איפוס התקדמות</button></div>
        <div class="bar"><i id="progBar"></i></div>
        <div class="len" role="group" aria-label="אורך סבב">
          <span>אורך סבב:</span>
          <button class="seg" id="len10" data-n="10" aria-pressed="true">10 · ~5 דק׳</button>
          <button class="seg" id="len15" data-n="15" aria-pressed="false">15 · ~8 דק׳</button>
          <button class="seg" id="len20" data-n="20" aria-pressed="false">20 · ~10 דק׳</button>
        </div>
      </div>
      <div class="tabs" role="tablist" aria-label="סוג תרגול">
        <button class="tab" role="tab" id="tabPath" aria-controls="panePath" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></svg>מסלול למידה</button>
        <button class="tab" role="tab" id="tabTopics" aria-controls="paneTopics" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>לפי נושא</button>
      </div>
      <div class="pane" id="panePath" role="tabpanel" aria-labelledby="tabPath">
        <div class="board" id="board"></div>
        <div class="path" id="path"></div>
      </div>
      <div class="pane" id="paneTopics" role="tabpanel" aria-labelledby="tabTopics" hidden>
        <p class="tab-hint">בוחרים נושא ומקבלים סבב שאלות רק ממנו</p>
        <button class="toggle" id="onlyNew" aria-pressed="false"><span class="sw"></span><span>רק שאלות שעוד לא עניתי עליהן נכון</span></button>
        <div class="grid" id="topics"></div>
      </div>
    </div>
  </section>

  <!-- LESSON -->
  <section id="lesson" class="screen" hidden>
    <div class="inner top">
      <button class="icon-btn" id="quit" aria-label="יציאה מהשיעור"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="pbar" id="pbar"><i id="pfill"></i></div>
      <div class="combo" id="combo" aria-live="polite"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s1 3.5-1.5 6.5C8.5 11 7 12.5 7 15a5 5 0 0 0 10 0c0-2-1-3.5-2-4.5.2 1.6-.4 2.8-1.5 3.3.6-2.6-.3-6.6-1.5-11.8z"/></svg><b id="comboN">0</b></div>
      <button class="icon-btn snd" aria-label="השתק צלילים"></button>
    </div>
    <div class="stage inner" id="stage">
      <div class="kicker"><span id="qtag"></span><span id="qretry" class="retry" hidden>· חוזרים על טעות</span></div>
      <div class="qrow"><h2 id="qtext"></h2><button id="speak" aria-label="הקרא את השאלה" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button></div>
      <div class="opts" id="opts"></div>
    </div>
    <div class="foot" id="foot">
      <div class="inner">
        <div class="sheet" id="sheet" role="status" aria-live="polite">
          <div class="verdict"><i id="vIcon"></i><span id="vText"></span></div>
          <p class="ans" id="fbAns"></p>
          <p class="why" id="fbWhy"></p>
        </div>
        <button class="big" id="check" disabled>בדוק</button>
      </div>
    </div>
  </section>

  <!-- DONE -->
  <section id="done" class="screen" hidden>
    <div class="inner done-body">
      <svg class="trophy" id="trophy" viewBox="0 0 120 120" aria-hidden="true"></svg>
      <h2 id="doneTitle"></h2>
      <p class="sub" id="doneSub"></p>
      <div class="stats" id="stats"></div>
      <p class="overtake" id="overtake" hidden></p>
      <div class="done-actions">
        <button class="big" id="again">שיעור נוסף</button>
        <button class="big ghost" id="redo" hidden>תרגל רק את הטעויות</button>
        <button class="big ghost" id="toHome">חזרה למסלול</button>
      </div>
      <div class="review" id="review"></div>
    </div>
  </section>
</div>
<canvas id="fx"></canvas>

<script>
// [מספר קבוע, נושא, שאלה, תשובה נכונה, מסיחים מופרדים ב-|, הסבר]
// 100 שאלות חינמיות. שאר השאלות מגיעות מהשרת (/api/questions) למנויים ולחברים.
const QTOTAL=1124; const CAT_N={"מורשת":192,"אזרחות":87,"ציונות":174,"שואה":84,"מדינה":257,"נשק":98,"עזרה ראשונה":76,"קשר":47,"תחקיר":34,"גאוגרפיה":51,"המנון":24};
const FREE_Q=[
[0,'מורשת','לפי מה נקבע חג החנוכה?','חז״ל','התורה|הכנסת|הרבנות הראשית','חנוכה אינו מופיע בתורה. חז״ל קבעו אותו כחג מדרבנן לזכר ניצחון החשמונאים ונס פך השמן.'],
[1,'מורשת','מי כתב את השולחן ערוך?','רבי יוסף קארו','הרמב״ם|רש״י|רבי יהודה הנשיא','רבי יוסף קארו חיבר את השולחן ערוך בצפת במאה ה-16. הרמב״ם כתב את ״משנה תורה״, ורבי יהודה הנשיא חתם את המשנה.'],
[2,'מורשת','מה מהבאים אינו חלק מגזרות השמד?','איסור על קיום חתונות ואירועים מיוחדים','איסור שמירת שבת|איסור ברית מילה|איסור לימוד תורה','גזרות אנטיוכוס כוונו נגד מצוות היסוד: שבת, ברית מילה ולימוד תורה. איסור על חתונות לא היה חלק מהן.'],
[3,'מורשת','מי ייסד את תנועת החסידות?','רבי ישראל בעל שם טוב','הגאון מווילנה|משה מנדלסון|רבי יוסף קארו','הבעל שם טוב ייסד את החסידות במאה ה-18 במזרח אירופה. הגאון מווילנה הנהיג את המתנגדים לה. (בסיכום זה מופיע בטעות כ״תנועת הציונות״.)'],
[4,'מורשת','מתי חל שושן פורים?','ט״ו באדר','י״ד באדר|י״ג באדר|ט״ו בשבט','בערים מוקפות חומה, כמו ירושלים, חוגגים ביום ט״ו. ב-י״ד באדר חל פורים הרגיל, ו-י״ג באדר הוא תענית אסתר.'],
[5,'מורשת','לאילו חלקים מתחלקת התורה שבעל פה?','משנה, תוספתא, מדרש, תלמוד','תורה, נביאים, כתובים|חומש, הפטרה, מגילות|שולחן ערוך, משנה תורה, זוהר','תורה, נביאים וכתובים הם חלקי התנ״ך, כלומר התורה שבכתב. התורה שבעל פה כוללת את המשנה, התוספתא, המדרש והתלמוד.'],
[6,'מורשת','מי הם המוסתערבים?','יהודים דוברי ערבית במזרח התיכון','יהודים שהתנצרו בספרד|מוסלמים שהתגיירו|יהודים מאשכנז שהיגרו לספרד','המוסתערבים הם יהודים ותיקים במזרח התיכון שאימצו את השפה והתרבות הערבית. יהודים שהתנצרו בספרד נקראים אנוסים.'],
[7,'מורשת','מה מאפיין את חג הסיגד?','צמים ומקיימים טקס על ראש הר גבוה','יושבים בסוכה שבעה ימים|מדליקים נרות שמונה ימים|קוראים במגילה ושולחים מנות','הסיגד הוא חג של יהודי אתיופיה, 50 יום אחרי יום כיפור. בחג צמים, עולים להר ומתפללים לשיבה לירושלים.'],
[8,'מורשת','היכן מתכנסים יוצאי אתיופיה בחג הסיגד?','טיילת ארמון הנציב בירושלים','הכותל המערבי|הר הרצל|מצדה','הטקס המרכזי נערך בטיילת ארמון הנציב, ממנה רואים את העיר העתיקה. כך הוא ממשיך את המסורת של עלייה להר.'],
[52,'אזרחות','מהו עיקרון הפרדת הרשויות?','הפרדה ופיזור בין שלוש רשויות: מחוקקת, מבצעת ושופטת','הפרדה בין דת למדינה|הפרדה בין הצבא לממשלה|הפרדה בין השלטון המרכזי למקומי','בישראל הכנסת מחוקקת, הממשלה מבצעת ובתי המשפט שופטים. החלוקה מונעת ריכוז כוח ויוצרת בקרה הדדית.'],
[53,'אזרחות','מה מקור שם הכנסת?','הכנסת הגדולה בירושלים בימי הבית השני','בית הכנסת הגדול בבבל|כינוס הקונגרס הציוני|אספת הנבחרים בתקופת המנדט','הכנסת הגדולה הייתה מוסד ההנהגה בתחילת ימי הבית השני. לפי המסורת היו בה 120 חברים, ולכן גם בכנסת יש 120.'],
[54,'אזרחות','מהם שני המרכיבים של אופייה הדמוקרטי של ישראל?','פורמלי-מוסדי ותרבותי-ערכי','דתי ולאומי|כלכלי וחברתי|צבאי ואזרחי','הפורמלי-מוסדי הוא המנגנונים, כמו בחירות ושלטון החוק. התרבותי-ערכי הוא הערכים, כמו זכויות אדם, שוויון וסובלנות.'],
[55,'אזרחות','מה טען השופט חיים כהן?','יש למצוא את שורשי הדמוקרטיה ביהדות ובמשפט העברי','יש לנתק את המשפט מהיהדות|הדמוקרטיה סותרת את היהדות|יש לאמץ את המשפט הבריטי','השופט חיים כהן הראה שערכים כמו כבוד האדם ושוויון בפני החוק נמצאים כבר במקורות היהודיים.'],
[56,'אזרחות','מהם עקרונות המשפט?','הזכות להליך הוגן, שוויון בפני החוק, פומביות המשפט','חובת שירות, חופש דת, זכות הצבעה|בחירות חופשיות, ריבונות, הפרדת רשויות|חופש עיתונות, התאגדות וקניין','אלה העקרונות שמבטיחים משפט צודק. פומביות פירושה שהמשפט פתוח לציבור, וזה מגן מפני שרירות.'],
[57,'אזרחות','מה תפקיד הקואליציה?','לגבות בכנסת את צעדי הממשלה ולהגן על חקיקתה','לבקר את הממשלה ולהציע חלופה|לבקר בתי המשפט|לבחור את נשיא המדינה','הקואליציה היא רוב חברי הכנסת שתומכים בממשלה. האופוזיציה היא זו שמבקרת ומציעה חלופה.'],
[58,'אזרחות','צה״ל מהווה זרוע מבצעת של...','הממשלה','הכנסת|נשיא המדינה|בית המשפט העליון','חוק יסוד: הצבא קובע שהצבא נתון למרות הממשלה. שר הביטחון הוא הממונה מטעמה.'],
[59,'אזרחות','מהם סמלי המדינה?','דגל, סמל, המנון','דגל, מטבע, בירה|הכנסת, הממשלה, הנשיא|מגילת העצמאות, הדגל, השפה','הדגל הוא הטלית עם מגן דוד, הסמל הוא המנורה עם ענפי זית, וההמנון הוא ״התקווה״.'],
[60,'אזרחות','ממי מורכבת ממשלת ישראל?','מכלל השרים','מכל חברי הכנסת|מראש הממשלה והנשיא|מחברי הקואליציה בלבד','הממשלה כוללת את ראש הממשלה ואת השרים. שר לא חייב להיות חבר כנסת, והנשיא אינו חלק מהממשלה.'],
[70,'ציונות','מי עמד בראש הציונות הרוחנית?','אשר צבי גינצברג (אחד העם)','תאודור הרצל|חיים ויצמן|זאב ז׳בוטינסקי','אחד העם רצה בארץ מרכז רוחני ותרבותי לעם היהודי. הרצל עמד בראש הציונות המדינית.'],
[71,'ציונות','מהי אמנציפציה?','הענקת שוויון זכויות ליהודים ושילובם בחברה הכללית','תנועת ההשכלה היהודית|עלייה המונית לארץ ישראל|גירוש היהודים ממערב אירופה','האמנציפציה החלה בצרפת אחרי המהפכה (1791). היא נתנה ליהודים זכויות אזרח מלאות.'],
[72,'ציונות','מה הייתה מטרת הקונגרס הציוני הראשון?','לכנס את תומכי הרעיון הציוני מכל העולם','להכריז על הקמת המדינה|לדון בתכנית אוגנדה|לייסד את ההגנה','הרצל כינס את הקונגרס בבזל ב-1897. שם נוסדה ההסתדרות הציונית ונקבעה ״תכנית בזל״.'],
[73,'ציונות','מתי התקיים הקונגרס הציוני הראשון?','1897','1882|1917|1903','הקונגרס התקיים בבזל, שוויץ. ב-1882 החלה העלייה הראשונה, וב-1903 עלתה תכנית אוגנדה.'],
[74,'ציונות','מיהו זאב ז׳בוטינסקי?','מנהיג ציוני, מנהיג האצ״ל ומשורר','ראש הממשלה הראשון|מייסד ניל״י|מייסד הפלמ״ח','ז׳בוטינסקי ייסד את הציונות הרוויזיוניסטית ואת בית״ר והיה המפקד העליון של האצ״ל. ראש הממשלה הראשון היה בן גוריון.'],
[75,'ציונות','מי עמד בראש הציונות הסינתטית?','חיים ויצמן','תאודור הרצל|אחד העם|דוד בן גוריון','ויצמן שילב פעולה מדינית עם התיישבות מעשית. לימים הוא היה הנשיא הראשון של המדינה.'],
[76,'ציונות','מהו זרם הציונות הסינתטית?','שילוב הציונות המדינית והמעשית לשיפור מצב היהודים','ציונות המבוססת על תרבות ורוח בלבד|ציונות הדוגלת במאבק צבאי|ציונות המתנגדת לפעולה מדינית','״סינתזה״ פירושה שילוב. הזרם האמין שצריך גם הכרה בינלאומית וגם עלייה והתיישבות בפועל.'],
[77,'ציונות','במה דגל זרם הציונות המדינית?','בהשגת הכרה בינלאומית רחבה ברעיון הבית הלאומי','בהתיישבות מעשית לפני כל הכרה|בחיזוק התרבות העברית בגולה|בשילוב דת ולאום','הרצל, מוביל הזרם, האמין שקודם צריך ״צ׳רטר״, כלומר אישור ממעצמות, ורק אחר כך עלייה המונית.'],
[78,'ציונות','מהי פרשת אוגנדה?','הצעת הבריטים להרצל לשטח במזרח אפריקה','הצעה לחלוקת ארץ ישראל|תכנית עלייה מאתיופיה|הסכם עם האימפריה העות׳מאנית','ב-1903, אחרי פוגרום קישינב, הציעו הבריטים שטח במזרח אפריקה. ההצעה עוררה מחלוקת קשה ונדחתה ב-1905.'],
[133,'שואה','במה הואשם ישראל רז׳ה קסטנר?','בשיתוף פעולה עם הנאצים בהונגריה','בריגול לטובת בריטניה|ברצח ארלוזורוב|בגניבת כספי שילומים','קסטנר ניהל משא ומתן עם אייכמן והציל ״רכבת״ של כ-1,700 יהודים. הוא הואשם שלא הזהיר את האחרים. בית המשפט העליון זיכה אותו אחרי שנרצח.'],
[134,'שואה','מי היו הנוסעים באוניית סנט לואיס?','פליטים יהודים מגרמניה','מעפילים מתימן|חיילים בריטים|ניצולי שואה לאחר המלחמה','ב-1939 הפליגה האונייה עם כ-900 פליטים. קובה וארה״ב סירבו לקלוט אותם והיא חזרה לאירופה.'],
[135,'שואה','עם איזה שלב בשואה מזוהה ועידת ואנזה?','הפתרון הסופי','חוקי נירנברג|ליל הבדולח|הקמת הגטאות','בינואר 1942 תיאמו בכירים נאצים את ההשמדה השיטתית של יהודי אירופה.'],
[136,'שואה','מי מעניק את אות חסיד אומות העולם?','יד ושם','הכנסת|נשיא המדינה|האו״ם','ועדה ביד ושם בודקת עדויות ומעניקה את האות ללא-יהודים שהצילו יהודים בסיכון חייהם.'],
[137,'שואה','מי הועמדו לדין במשפטי נירנברג?','ראשי המשטר הנאצי','משתפי פעולה יהודים|קציני האס-אס הזוטרים בלבד|אדולף אייכמן','בית הדין הבינלאומי (1945–1946) שפט את מנהיגי הרייך. אייכמן ברח ונשפט בישראל ב-1961.'],
[138,'שואה','מה הייתה טענת בגין ביחס להסכם השילומים?','קבלת השילומים היא עוול מוסרי ומחילה רשמית לנאצים','הסכום נמוך מדי|יש לחלק את הכסף לניצולים בלבד|ההסכם חיוני לכלכלה','בגין הוביל הפגנה סוערת מול הכנסת ב-1952. בן גוריון טען שההסכם הכרחי לכלכלת המדינה.'],
[139,'שואה','באיזה מושג השתמש בן גוריון ביחס להסכם השילומים?','״גרמניה האחרת״','״לא עוד״|״מחילה ופיוס״|״עם לבדד ישכון״','בן גוריון הבחין בין גרמניה הנאצית לבין גרמניה המערבית החדשה, שאפשר לנהל איתה יחסים.'],
[140,'שואה','באילו רעיונות השתמשו הנאצים בתפיסת עולמם?','גזענות','ליברליזם|קומוניזם|פציפיזם','האידאולוגיה הנאצית חילקה בני אדם ל״גזעים״ עליונים ונחותים. הנאצים ראו בקומוניזם אויב.'],
[141,'שואה','מה היה השינוי באנטישמיות בעת החדשה?','היא הפכה לגזענית ו״מדעית״','היא הפכה לדתית בלבד|היא נעלמה במערב|היא הפכה לכלכלית בלבד','השנאה הישנה הייתה דתית ואפשר היה להתנצר. האנטישמיות הגזענית ראתה ביהודים גזע, ולכן לא השאירה דרך מילוט.'],
[157,'מדינה','איזו עיר נכבשה במבצע עובדה?','אילת','באר שבע|ירושלים|צפת','במרץ 1949 הגיעו כוחות צה״ל לאום רשרש והניפו את ״דגל הדיו״. זה היה המבצע האחרון במלחמת העצמאות.'],
[158,'מדינה','איזו מלחמה הסתיימה בהסכמי שביתת הנשק ברודוס?','מלחמת העצמאות','מבצע קדש|ששת הימים|יום הכיפורים','ב-1949 נחתמו ברודוס הסכמים עם מצרים, ירדן, לבנון וסוריה, בתיווך ראלף באנץ׳. כך נקבע ״הקו הירוק״.'],
[159,'מדינה','מתי הוקם צה״ל?','26 במאי 1948','14 במאי 1948|29 בנובמבר 1947|1 בינואר 1949','פקודת צבא הגנה לישראל פורסמה 12 ימים אחרי הכרזת העצמאות. ב-29 בנובמבר התקבלה החלטת החלוקה.'],
[160,'מדינה','מתי פורק ארגון ההגנה?','1948','1947|1950|1956','עם הקמת צה״ל ב-1948 התאחדו בו ההגנה, ובהמשך גם האצ״ל והלח״י.'],
[161,'מדינה','מתי הופצצה האונייה אלטלנה?','יוני 1948','מאי 1948|ינואר 1949|נובמבר 1947','ב-22 ביוני 1948, בזמן ההפוגה הראשונה, בן גוריון הורה להפגיז את האונייה מול חוף תל אביב.'],
[162,'מדינה','מה הובילה הספינה אלטלנה?','נשק שרכש האצ״ל ועולים חדשים','מעפילים מאירופה בלבד|ציוד רפואי לצה״ל|מזון לירושלים הנצורה','המחלוקת הייתה למי יגיע הנשק. בן גוריון ראה בכך איום על ״צבא אחד למדינה אחת״.'],
[163,'מדינה','בעקבות מי ומתי התקיימה ״ההפוגה הראשונה״?','פולקה ברנדוט, 11 ביוני 1948','ראלף באנץ׳, ינואר 1949|דג המרשלד, 1956|הנרי קיסינג׳ר, 1974','הרוזן ברנדוט היה מתווך האו״ם. הלח״י רצח אותו בספטמבר 1948, ובאנץ׳ החליף אותו.'],
[164,'מדינה','מתי נחקק חוק השבות?','5 ביולי 1950','14 במאי 1948|1 בינואר 1952|1967','החוק נחקק ביום השנה למות הרצל (כ׳ בתמוז). הוא מעגן את זכות כל יהודי לעלות.'],
[165,'מדינה','מה הייתה הבעיה בחוק השבות?','החוק לא קבע הגדרה למיהו יהודי','החוק חל רק על ניצולי שואה|החוק לא חל על יהודי ארצות ערב|החוק אסר עלייה מברית המועצות','בהיעדר הגדרה הגיעו מקרים כמו האח דניאל ושליט לבג״ץ. ב-1970 הוסף לחוק תיקון שמגדיר מיהו יהודי.'],
[166,'מדינה','מה הסכם/מכתב הסטטוס קוו?','מכתב ששלח בן גוריון למנהיגי הציבור החרדי','הסכם עם ירדן על ירושלים|מכתב לנשיא ארה״ב|הסכם שביתת נשק עם מצרים','ב-1947 שלח בן גוריון מכתב לאגודת ישראל. הוא הבטיח שבת, כשרות, דיני אישות ואוטונומיה בחינוך.'],
[245,'נשק','נכון או לא נכון: יש לסחוט את ההדק במהירות.','לא נכון','נכון','סחיטת הדק היא לחיצה איטית, רציפה והדרגתית. לחיצה מהירה או חטופה מזיזה את הנשק ופוגעת בדיוק.'],
[246,'נשק','מה תפקיד הכספית בשרשרת הפיצוץ?','הצתת אבק השריפה','דחיפת הקליע בקנה|נעילת הבריח|חליצת התרמיל','הנוקר פוגע בפיקה, הכספית שבה נדלקת ומציתה את אבק השריפה. הגזים שנוצרים הם אלה שדוחפים את הקליע.'],
[247,'נשק','מהי הפעולה הראשונה בתהליך הירי?','דריכה (משיכת ידית הדריכה)','נקירה|פעולה לאחור|פעולה לפנים','קודם דורכים ומושכים את הידית. רק אחרי זה מגיעות הפעולה לפנים, הנקירה והפעולה לאחור.'],
[248,'נשק','מהו סדר הפעולות בתהליך הירי?','דריכה, פעולה לפנים, נקירה, פעולה לאחור','נקירה, דריכה, פעולה לאחור, פעולה לפנים|פעולה לאחור, דריכה, נקירה, פעולה לפנים|דריכה, נקירה, פעולה לפנים, פעולה לאחור','דורכים, המכלול מכניס כדור לבית הבליעה (פעולה לפנים), הנוקר פוגע בפיקה (נקירה), והמכלול נהדף אחורה וחולץ את התרמיל.'],
[249,'נשק','יורים עם אוויר בריאות או בלי?','עם אוויר בריאות — כמעט תמיד הירי יהיה לאחר מאמץ','בלי — רק אחרי נשיפה מלאה|רק במטווח איפוס|זה לא משנה','בשטח יורים בדרך כלל אחרי מאמץ, ואז אין זמן לרוקן ריאות. ירי עם אוויר נותן הפוגה ארוכה ויציבה יותר.'],
[250,'נשק','מה היתרון בירי עם אוויר בריאות?','הפוגה ארוכה יותר, ולכן יותר זמן יציבות לירי מדויק','ירי מהיר יותר|הפחתת הרתע|שיפור הראייה','כשעוצרים את הנשימה עם אוויר בריאות אפשר להחזיק יותר זמן בלי שהגוף ״ידרוש״ נשימה, ולכן הכוונה יציבה יותר.'],
[251,'נשק','לאילו חלקים מתחלקת ההכרזה?','איפוס ומצב אמת','ירי יום וירי לילה|טעינה ופריקה|מעצור ראשון ומעצור שני','ההכרזה היא דיווח של היורה איפה הייתה הכוונת ברגע הירי. היא משמשת גם באיפוס וגם במצב אמת.'],
[252,'נשק','מהם שבעת עקרונות הקליעה?','מצב גוף-קרקע, מצב גוף-נשק, חוק המכוון, נשימה, מצב אפס, סחיטת הדק, הכרזה','טעינה, דריכה, נצירה, ירי, פריקה, ניקוי, איפוס|שכיבה, כריעה, עמידה, ריצה, מחסה, הסתערות, דילוג|קת, קנה, כוונת, הדק, מחסנית, בריח, נוקר','אלה שבעת העקרונות שהיורה שומר עליהם בכל ירייה. התשובות האחרות הן פעולות תפעול, מצבי ירי או חלקי נשק.'],
[253,'נשק','מה העיקרון במצב גוף-קרקע?','הרבה נקודות אחיזה בקרקע, ונשענים על עצמות ולא על שרירים','נשענים על שרירים ולא על עצמות|מינימום מגע עם הקרקע|הרגליים צמודות זו לזו','שרירים מתעייפים ורועדים, ועצמות לא. ככל שיש יותר נקודות מגע עם הקרקע, המצב יציב יותר.'],
[301,'עזרה ראשונה','מה הדבר הראשון שהמע״ר יבצע?','הרחקת הפצוע ממקור הסכנה תוך קריאה לעזרה','החייאה|חבישה|מתן שתייה','קודם בטיחות: אסור להפוך לנפגע נוסף. אחרי שהפצוע במקום בטוח מתחילים בטיפול.'],
[302,'עזרה ראשונה','מהו שלב S?','שלב הבטיחות — נטרול האיום תוך העברת דיווח','עצירת דימום|בדיקת נשימה|הערכת הכרה','S (Safety) בא לפני כל שלבי הטיפול. מנטרלים את האיום ומדווחים כדי שתגיע עזרה.'],
[303,'עזרה ראשונה','מדוע מבצעים הרמת לסת בשלב A?','חשש לחסימת נתיב אוויר','לעצירת דימום|לבדיקת הכרה|למניעת היפותרמיה','שלב A (Airway) עוסק בנתיב האוויר. בנפגע מחוסר הכרה הלשון עלולה לחסום אותו, והרמת הלסת פותחת אותו.'],
[304,'עזרה ראשונה','מה אינו חלק משלב A?','סילוק הפרשות ונצירת נשק הפצוע','הרמת לסת|פתיחת נתיב אוויר|בדיקת חסימה בנתיב האוויר','לפי הסיכום, שלב A מתמקד בפתיחת נתיב האוויר ובבדיקתו. נצירת נשק שייכת לשלב הבטיחות.'],
[305,'עזרה ראשונה','מהם הסימנים לחסימת נתיב אוויר?','אי שקט, התרחבות בית החזה, חיוורון','דופק איטי ועור חם ואדום|צמא ושתן כהה|כאב ראש ובחילה','חוסר חמצן גורם לאי שקט ולחיוורון, והמאמץ לנשום נראה בתנועות בית החזה. צמא ושתן כהה הם סימני התייבשות.'],

function riser(t0,dur=.45,vol=.22){noise(t0,dur,vol,{from:300,to:9000,q:2.5,rev:.6});voice(220,t0,{type:'sawtooth',vol:.04,a:dur*.9,dec:.05,slide:1760,rev:.4})}
function sparkle(t0,n=8,base=2093,vol=.05){for(let i=0;i<n;i++)voice(base*Math.pow(2,[0,4,7,12,16,19][Math.random()*6|0]/12),t0+i*.03+Math.random()*.015,{type:i%2?'sine':'triangle',vol,dec:.3,rev:1})}
const LADDER=[0,2,4,7,9,12,14,16,19,21,24,26,28,31,33,36];
const hz=semi=>523.25*Math.pow(2,semi/12);
const SFX={
  tap(){voice(900,0,{vol:.14,dec:.06,slide:420,rev:.05})},
  select(){voice(520,0,{vol:.2,dec:.08,slide:1100,rev:.1});voice(1560,.01,{type:'triangle',vol:.06,dec:.06,rev:0})},
  ok(n){const step=Math.min(n-1,LADDER.length-1),r=hz(LADDER[step]),big=Math.min(n,10);
    kick(0,.7+big*.02);
    saw([r,r*1.26,r*1.5],0,{vol:.05+big*.004,dec:.35+big*.03,cut:9000,cutEnd:1200});
    // bright arpeggio flurry: more notes the longer the streak
    const arp=[0,4,7,12,16,19,24].slice(0,3+Math.min(Math.floor(n/2),4));
    arp.forEach((s,i)=>bell(r*Math.pow(2,s/12),.05+i*.045,.11,.8));
    voice(r/2,0,{type:'triangle',vol:.22,dec:.35,rev:.1});
    if(n>=3){sparkle(.12,6+big,2637,.045);clap(.0,.2)}
    if(n>=5)crash(.05,.08+big*.01,.9)},
  coin(){voice(1975.5,0,{type:'square',vol:.09,dec:.06,rev:.3});voice(2637,.075,{type:'square',vol:.1,dec:.35,rev:.6});voice(5274,.075,{vol:.04,dec:.25,rev:.6})},
  jackpot(n=14){for(let i=0;i<n;i++){const t=i*.06+Math.random()*.02;voice(1975.5*(1+Math.random()*.06),t,{type:'square',vol:.05,dec:.05,rev:.4});voice(2637*(1+Math.random()*.06),t+.05,{type:'square',vol:.05,dec:.18,rev:.6})}},
  no(){voice(330,0,{type:'triangle',vol:.22,dec:.16,slide:294,rev:.2});voice(247,.13,{type:'triangle',vol:.22,dec:.34,slide:220,rev:.25});voice(110,.13,{vol:.18,dec:.3,rev:0})},
  combo(n){const up=n>=10?7:n>=5?4:0;
    riser(0,.42,.24);
    const t=.42;kick(t,1);clap(t,.4);crash(t,.25,1.6);
    saw([hz(up-12),hz(up-12+4),hz(up-12+7),hz(up)],t,{vol:.09,dec:1.1,cut:10000,cutEnd:700});
    [0,4,7,12,16,19,24].forEach((s,i)=>bell(hz(s+up),t+.04+i*.05,.1,1));
    sparkle(t+.1,18,2637,.05);
    if(n>=10)SFX.jackpot(18)},
  rise(){riser(0,.5,.18)},
  tick(i){voice(1600+(i%6)*120,0,{type:'square',vol:.035,dec:.03,rev:.05})},
  win(perfect){
    // drum roll building up
    for(let i=0;i<10;i++){const t=i*.055*(1-i*.04);noise(t,.04,.12+i*.02,{type:'bandpass',from:1800,to:1600,q:.7,a:.002,rev:.3})}
    riser(0,.55,.22);
    const T=.55;
    kick(T,1.1);clap(T,.5);crash(T,.32,2.2);
    saw([hz(-12),hz(-8),hz(-5),hz(0)],T,{vol:.1,dec:1.8,a:.01,cut:11000,cutEnd:600});
    voice(hz(-24),T,{type:'triangle',vol:.35,dec:1.2,rev:.1});
    // fanfare arpeggio: C - F - G - C(high)
    [[0,4,7],[5,9,12],[7,11,14],[12,16,19]].forEach((c,i)=>{const t=T+.22+i*.17;kick(t,.6);c.forEach(s=>bell(hz(s),t,.09,i===3?1.8:.7));saw(c.map(hz),t,{vol:.045,dec:i===3?1.4:.25,cut:8000,cutEnd:1500})});
    sparkle(T+.9,24,2637,.05);
    SFX.jackpot(perfect?28:12);
    if(perfect){const P=T+1.05;crash(P,.28,2.4);kick(P,1);[24,28,31,36].forEach((s,i)=>bell(hz(s),P+i*.08,.1,1.6));saw([hz(12),hz(16),hz(19),hz(24)],P,{vol:.07,dec:2,a:.02,cut:12000,cutEnd:900});sparkle(P+.2,30,3520,.045)}
  },
  unlock(){riser(0,.3,.15);[7,12,19,24].forEach((s,i)=>bell(hz(s),.3+i*.06,.1,1));kick(.3,.7);sparkle(.4,10)}
};

const fx=$('#fx'),ctx=fx.getContext('2d');let parts=[],raf=0;
function sizeFx(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio}

function burst(x,y,n,spread,colors){if(reduced)return;const cs=colors||['#3c9a3f','#f5c33b','#3b82c4','#f2a01c','#d9443a','#9cbc52'];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(Math.random()*.6+.4)*spread;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spread*.5,r:Math.random()*5+3,c:pick(cs),rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1,sq:Math.random()<.5})}if(!raf)loop()}
function loop(){ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);for(const p of parts){p.vy+=.35;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.012;ctx.save();ctx.globalAlpha=Math.max(p.life,0);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;if(p.sq)ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{ctx.beginPath();ctx.arc(0,0,p.r*.7,0,7);ctx.fill()}ctx.restore()}raf=parts.length?requestAnimationFrame(loop):0;if(!raf)ctx.clearRect(0,0,innerWidth,innerHeight)}
function rain(){if(reduced)return;for(let i=0;i<6;i++)setTimeout(()=>burst(Math.random()*innerWidth,-10,28,9),i*160)}

/* ---------- PATH ---------- */
const PER=5; // learn rounds per stage, then a review
let PATH=store.get('bq-path',{done:[]});
const savePath=()=>store.set('bq-path',PATH);
const typeAt=i=>i%(PER+1)===PER?'review':'learn';
function seenInPath(){const s=new Set();PATH.done.forEach(r=>{if(r.t==='learn')r.qs.forEach(i=>s.add(i))});return s}
function buildRound(){
  const i=PATH.done.length,t=typeAt(i);
  if(t==='review'){
    const recent=PATH.done.slice(i-PER).filter(r=>r.t==='learn');
    const all=[...new Set(recent.flatMap(r=>r.qs))],wrong=[...new Set(recent.flatMap(r=>r.wrong))];
    const n=Math.min(Math.max(LEN,15),all.length),first=shuffle(wrong).slice(0,n);
    return {t,qs:shuffle([...first,...shuffle(all.filter(x=>!first.includes(x))).slice(0,n-first.length)])};
  }
  const seen=seenInPath(),fresh=D.map((q,j)=>j).filter(j=>!seen.has(j));
  if(!fresh.length)return null;
  return {t,qs:shuffle(fresh).slice(0,LEN)};
}
const ICO={
  learn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>',
  done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg>',
  review:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10v2h3v3a5 5 0 0 1-4.3 5A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 8.3 13 5 5 0 0 1 4 8V5h3zm-1 4v1a3 3 0 0 0 1.4 2.5A7 7 0 0 1 7 8V7zm12 0h-1v1a7 7 0 0 1-.4 2.5A3 3 0 0 0 18 8z"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>'
};
function drawPath(){
  const cur=PATH.done.length, seen=seenInPath(), left=D.filter((q,j)=>!seen.has(j)).length;
  const totalLearn=PATH.done.filter(r=>r.t==='learn').length+Math.ceil(left/LEN);
  const totalStages=Math.max(1,Math.ceil(totalLearn/PER));
  const curStage=Math.floor(cur/(PER+1));
  const finished=!left&&typeAt(cur)==='learn';
  const end=finished?cur:Math.min((curStage+2)*(PER+1),totalStages*(PER+1));
  let h='';
  for(let i=0;i<end;i++){
    const st=Math.floor(i/(PER+1));
    if(i%(PER+1)===0){const locked=i>cur;h+=`<div class="stage-head${locked?' locked':''}"><b>שלב ${st+1} מתוך ${totalStages}</b><span>${PER} סבבים ואז בחינה חוזרת על החומר</span></div>`}
    const t=typeAt(i),state=i<cur?'done':i===cur?'cur':'lock',x=Math.round(Math.sin(i*1.05)*72);
    const r=PATH.done[i];
    const icon=state==='lock'?ICO.lock:state==='done'?(t==='review'?ICO.review:ICO.done):ICO[t];
    const label=t==='review'?'בחינה חוזרת':'סבב '+(i%(PER+1)+1);
    h+=`<div class="node-wrap" style="--x:${x}px">${state==='cur'?`<span class="tip${t==='review'?' review':''}">${t==='review'?'בחינה חוזרת!':'התחל'}</span>`:''}<button class="node ${t} ${state}" id="n${i}" data-i="${i}" ${state==='lock'?'disabled':''} aria-label="${label}${state==='done'?' (הושלם)':''}">${icon}${r?`<span class="acc">${r.acc}%</span>`:''}</button></div>`;
  }
  if(finished)h+=locked()?`<p class="path-end">סיימת את ${FREE_Q.length} השאלות החינמיות! <button class="big" id="pathUnlock">לפתוח את כל ${QTOTAL.toLocaleString('en')} השאלות</button></p>`:'<p class="path-end">סיימת את כל המסלול! אפשר להמשיך בתרגול חופשי, או לאפס ולהתחיל מחדש.</p>';
  $('#path').innerHTML=h;
  if($('#pathUnlock'))$('#pathUnlock').onclick=()=>openPaywall();
}
$('#path').onclick=e=>{const b=e.target.closest('.node');if(!b||b.disabled)return;const i=+b.dataset.i;
  if(i<PATH.done.length){const r=PATH.done[i],qs=r.qs.map(j=>D[j]).filter(Boolean);if(!qs.length){openPaywall();return}startLesson(shuffle(qs),null,{replay:true,t:r.t,i});return}
  startPathRound()};
function startPathRound(){const r=buildRound();if(r)r.qs=r.qs.filter(j=>D[j]);if(!r||!r.qs.length){if(locked())openPaywall();else show('home');return}startLesson(r.qs.map(j=>D[j]),null,{t:r.t,i:PATH.done.length,qs:r.qs})}

// ACCT: every device has an account (id+secret), even before joining the board, and its progress is backed up silently.

function mergeProgress(p){

  (p.done||[]).forEach(i=>{if(i<QTOTAL&&!DONE.has(i)){DONE.add(i);changed=true}});
  if(p.path&&Array.isArray(p.path.done)&&p.path.done.length>PATH.done.length){PATH={done:p.path.done};changed=true}
  if((p.xp||0)>TOTALXP){TOTALXP=p.xp;changed=true}
  if(changed){saveDone();savePath();xpFloor();store.set('bq-xp',TOTALXP);drawXp()}
  return changed}

function rows(b,max){

  if(r>=max)idx=[...idx.slice(0,max-2),-1,r-1,r].filter((x,i,a)=>a.indexOf(x)===i);
  const top=Math.max(1,b[0].xp);
  return '<ol class="bd-list">'+idx.map(i=>{if(i===-1)return '<li class="gap">···</li>';const p=b[i],mine=ME&&p.id===ME.id;
    return `<li class="${mine?'me':''}"><span class="rk ${i<3?'r'+i:''}">${i+1}</span><span class="nm"><b>${esc(p.name)}${mine?' (אתה)':''}</b><small>${stageLabel(p)} · ${p.correct} נכונות</small><i class="bd-bar"><i style="width:${p.xp/top*100}%"></i></i></span><span class="sc">${p.xp}<small>XP</small></span></li>`}).join('')+'</ol>';
}

}
$('#again').onclick=()=>{if(L.ctx){if(buildRound())startPathRound();else show('home')}else{show('home');launch(L.topic)}};
$('#redo').onclick=()=>startLesson(shuffle([...L.wrong.values()].map(x=>x.item)),L.topic,null);
$('#toHome').onclick=()=>show('home');

/* ---------- KEYS ---------- */
document.addEventListener('keydown',e=>{
  if($('.modal'))return;
  if($('#lesson').hidden)return;
  const k={'1':0,'2':1,'3':2,'4':3}[e.key];
  if(k!==undefined&&k<L.opts.length){choose(k);return}
  if(e.key==='Enter'){e.preventDefault();$('#check').click()}
});

/* ---------- ACCESS: 100 free questions, the rest for friends and subscribers ---------- */
// The server decides who gets the rest (/api/questions). They are cached for offline use and dropped if access ends.
const QCACHE='bq-qs';
// /?paywall-test=1 turns the paywall on in this browser only, to try sign-in and payment before launch; =0 turns it off
(()=>{const t=new URLSearchParams(location.search).get('paywall-test');if(t===null)return;
  document.cookie=`bq_pwtest=${t==='1'?'1':''}; path=/; max-age=${t==='1'?2592000:0}; samesite=lax${location.protocol==='https:'?'; secure':''}`;
  history.replaceState(null,'',location.pathname);if(t!=='1'){try{localStorage.removeItem('bq-cfg')}catch(e){}}})();
let CFG=store.get('bq-cfg',null), ACCESS=store.get('bq-access',null), USER=null, SIGNED=false;
const locked=()=>!!(CFG&&CFG.paywall)&&!(ACCESS&&ACCESS.full);
const priceTxt=()=>'₪'+Number(CFG&&CFG.price||19.9).toFixed(2);
function addQuestions(rows){let n=0;(rows||[]).forEach(r=>{if(Array.isArray(r)&&Number.isInteger(r[0])&&!D[r[0]]){D[r[0]]=r.slice(1);n++}});if(n)reindex();return n}
addQuestions(store.get(QCACHE,null));
async function call(path,opts={}){
  const r=await fetch(path,{...opts,cache:'no-store',headers:{'X-Acct':ACCT.id+'.'+ACCT.secret,...(opts.body?{'Content-Type':'application/json'}:{})}});
  const j=await r.json().catch(()=>({}));return {status:r.status,ok:r.ok,j}}
async function refreshAccess(){
  try{const c=await call('/api/config');if(c.ok){CFG=c.j;store.set('bq-cfg',CFG)}}catch(e){}
  try{const a=await call('/api/account');if(a.ok){USER=a.j.user;SIGNED=!!a.j.signedIn;ACCESS=a.j.access;store.set('bq-access',ACCESS)}}catch(e){}
  try{const q=await call('/api/questions');
    if(q.ok){ACCESS=q.j.access||ACCESS;store.set('bq-access',ACCESS);store.set(QCACHE,q.j.questions);if(addQuestions(q.j.questions)&&!$('#home').hidden)drawHome()}
    else if(q.status===402){ACCESS=q.j.access||{full:false};store.set('bq-access',ACCESS);
      if(store.get(QCACHE,null)){store.set(QCACHE,null);location.reload();return}}
  }catch(e){}
  if(!$('#home').hidden)drawHome();else drawAccess();
}
function drawAccess(){
  const el=$('#access');if(!el)return;
  if(!CFG||!CFG.paywall){el.hidden=true;return}
  el.hidden=false;
  if(ACCESS&&ACCESS.full){
    const friend=ACCESS.reason==='friend',until=ACCESS.paidUntil?new Date(ACCESS.paidUntil).toLocaleDateString('he-IL'):'';
    const sub=friend?'אתה ברשימת החברים, הכול פתוח':ACCESS.status==='canceled'||ACCESS.status==='cancel_requested'?`המנוי בוטל. הגישה פתוחה עד ${until}`:'המנוי מתחדש כל חודש';
    el.className='access ok';
    el.innerHTML=`<div class="row"><div><b>${friend?'גישה מלאה לכל השאלות':'מנוי פעיל'}</b><p>${sub}</p></div>${SIGNED&&!friend?'<button class="link" id="accMng">ניהול מנוי</button>':''}</div>`;
    if($('#accMng'))$('#accMng').onclick=manageSub;
    return}
  el.className='access';
  el.innerHTML=`<div><b>יש לך גישה ל־${FREE_Q.length} מתוך ${QTOTAL.toLocaleString('en')} שאלות</b><p>מנוי פותח את כל השאלות ואת המסלול המלא</p></div><button class="big" id="accGo">לכל השאלות · ${priceTxt()} לחודש</button>${SIGNED&&payingRecently()?'<button class="link" id="accCheck">כבר שילמתי, לבדוק שוב</button>':''}`;
  $('#accGo').onclick=()=>openPaywall();
  if($('#accCheck'))$('#accCheck').onclick=()=>checkPaid(true);
}
const loadScript=src=>new Promise((ok,no)=>{const old=document.querySelector(`script[src="${src}"]`);if(old&&old.dataset.loaded)return ok();
  const s=old||document.createElement('script');s.src=src;s.async=true;s.onload=()=>{s.dataset.loaded=1;ok()};s.onerror=no;if(!old)document.head.appendChild(s)});
async function openPaywall(errMsg){
  SFX.tap();
  const m=modal(`<h3>כל ${QTOTAL.toLocaleString('en')} השאלות</h3>
    <div class="pw-price">${priceTxt()} <small>לחודש · ביטול בכל רגע</small></div>
    <ul class="pw-list"><li>כל הנושאים, עם הסבר אחרי כל תשובה</li><li>מסלול הלמידה המלא ובחינות חוזרות</li><li>עובד בטלפון ובמחשב, גם בלי אינטרנט</li></ul>
    <div id="pwStep" class="pw-step"></div>
    <p class="pw-note">התשלום מתבצע אצל סאמיט בחיבור מאובטח, ופרטי הכרטיס לא עוברים דרכנו. <a href="/terms.html" target="_blank" rel="noopener">תקנון ומדיניות ביטול</a></p>
    <button class="big ghost" id="pwClose">לא עכשיו</button>`);
  m.querySelector('#pwClose').onclick=()=>m.remove();
  const step=m.querySelector('#pwStep');
  if(!CFG||!CFG.paywall){step.innerHTML='<p>כרגע כל השאלות פתוחות לכולם.</p>';return}
  if(!SIGNED){
    step.innerHTML=`<p><b>שלב 1 מתוך 2:</b> התחברות, כדי שהמנוי יישמר לך בכל מכשיר</p><div id="gsiBtn"></div>
      ${navigator.standalone?'<p class="pw-note">אם ההתחברות לא נפתחת באפליקציה, פתחו את האתר ב-Safari, הירשמו שם, והגישה תעבור לאפליקציה.</p>':''}`;
    if(!CFG.googleClientId){step.querySelector('#gsiBtn').textContent='ההתחברות עוד לא הוגדרה.';return}
    try{await loadScript('https://accounts.google.com/gsi/client');
      google.accounts.id.initialize({client_id:CFG.googleClientId,ux_mode:'redirect',login_uri:location.origin+'/api/auth-google'});
      const b=step.querySelector('#gsiBtn');
      google.accounts.id.renderButton(b,{type:'standard',theme:'filled_blue',size:'large',text:'continue_with',shape:'pill',locale:'he',width:Math.min(320,b.clientWidth||300)});
      b.addEventListener('click',()=>store.set('bq-after-login',1),true);
    }catch(e){step.querySelector('#gsiBtn').textContent='לא הצלחתי לטעון את ההתחברות. בדקו את החיבור לאינטרנט.'}
    return}
  const mail=USER?USER.email:'';
  step.innerHTML=`<p><b>שלב 2 מתוך 2:</b> תשלום בדף המאובטח של סאמיט</p>
    ${mail?`<div class="pw-mail"><span>בדף התשלום הקלידו את המייל הזה, וכך המנוי ייפתח לכם אוטומטית:</span>
      <span class="addr"><b>${esc(mail)}</b><button class="link" id="pwCopy" type="button">העתקה</button></span></div>`:''}
    <div class="og-errors" role="alert">${errMsg?esc(errMsg):''}</div>
    <label class="terms"><input type="checkbox" id="pwAgree"> קראתי ואני מסכים/ה <a href="/terms.html" target="_blank" rel="noopener">לתקנון</a></label>
    <a class="big" id="payGo" href="${esc(CFG.payUrl||'#')}" aria-disabled="true">לתשלום ${priceTxt()} לחודש</a>
    <button class="link" id="pwCheck" type="button">כבר שילמתי, לבדוק שוב</button>`;
  const go=step.querySelector('#payGo'),agree=step.querySelector('#pwAgree');
  agree.onchange=()=>go.setAttribute('aria-disabled',!agree.checked);
  go.onclick=e=>{if(!agree.checked){e.preventDefault();return}store.set('bq-paying',Date.now())};
  const cp=step.querySelector('#pwCopy');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(mail);cp.textContent='הועתק ✓'}catch(e){cp.textContent='לא הועתק'}};
  step.querySelector('#pwCheck').onclick=()=>{m.remove();checkPaid(true)};
}
// After paying, SUMIT reports the payment to our server within seconds; ask a few times before giving up.
let checking=false;
async function checkPaid(loud){
  if(checking)return;checking=true;
  if(loud)toast('בודק את התשלום…');
  for(let i=0;i<8;i++){
    const r=await call('/api/account',{method:'POST',body:JSON.stringify({action:'sync'})}).catch(()=>null);
    if(r&&r.ok&&r.j.access&&r.j.access.full){checking=false;store.set('bq-paying',0);ACCESS=r.j.access;store.set('bq-access',ACCESS);
      toast('המנוי הופעל! כל השאלות פתוחות');burst(innerWidth/2,200,90,10);await refreshAccess();return true}
    if(r&&r.status===401)break;
    await new Promise(ok=>setTimeout(ok,i<3?2500:5000));
  }
  checking=false;
  if(loud||store.get('bq-paying',0))toast('התשלום עוד לא הגיע אלינו. אם שילמתם, זה יכול לקחת כמה דקות');
  drawAccess();return false;
}
const payingRecently=()=>Date.now()-store.get('bq-paying',0)<6*36e5;
function manageSub(){
  const until=ACCESS&&ACCESS.paidUntil?new Date(ACCESS.paidUntil).toLocaleDateString('he-IL'):'';
  const active=ACCESS&&ACCESS.status==='active';
  const m=modal(`<h3>ניהול מנוי</h3>${USER?`<p>${esc(USER.email)}</p>`:''}
    <p>${active?`המנוי פעיל ומתחדש כל חודש (${priceTxt()}).`:`המנוי בוטל. הגישה פתוחה עד ${until}.`}</p>
    ${active?'<button class="big no" id="subCancel">ביטול המנוי</button>':''}
    <button class="big ghost" id="subOut">התנתקות</button><button class="big ghost" id="subClose">סגירה</button>`);
  m.querySelector('#subClose').onclick=()=>m.remove();
  m.querySelector('#subOut').onclick=async()=>{await call('/api/account',{method:'POST',body:JSON.stringify({action:'logout'})}).catch(()=>{});m.remove();SIGNED=false;USER=null;refreshAccess()};
  const c=m.querySelector('#subCancel');if(c)c.onclick=async()=>{
    if(c.dataset.sure!=='1'){c.dataset.sure='1';c.textContent=`בטוח? הגישה תישאר עד ${until}`;return}
    c.disabled=true;c.textContent='מבטל…';
    const r=await call('/api/account',{method:'POST',body:JSON.stringify({action:'cancel'})}).catch(()=>({ok:false,j:{}}));
    if(r.ok){ACCESS=r.j.access;store.set('bq-access',ACCESS);m.remove();
      toast(ACCESS.status==='cancel_requested'?`בקשת הביטול התקבלה. לא תחויבו שוב, והגישה נשארת עד ${until}`:'המנוי בוטל');drawAccess()}
    else{c.disabled=false;c.textContent='הביטול נכשל. נסו שוב';}};
}
// coming back from Google sign-in or from the payment form
function afterReturn(){
  const u=new URLSearchParams(location.search),login=u.get('login'),paid=u.get('paid');
  if(!login&&!paid){if(SIGNED&&locked()&&payingRecently())checkPaid(false);return}
  history.replaceState(null,'',location.pathname);
  if(login==='error')toast('ההתחברות נכשלה. נסו שוב');
  if(paid==='fail')openPaywall('התשלום לא עבר. אפשר לנסות שוב.');
  else if(paid)checkPaid(true);
  else if(login==='ok'&&store.get('bq-after-login',0)){store.set('bq-after-login',0);if(locked())openPaywall()}
}

drawSnd();drawLen();drawHome();drawXp();pollBoard(true);
refreshAccess().then(afterReturn);
// back from the payment page in another tab, or the installed app returns to the foreground
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SIGNED&&locked()&&payingRecently())checkPaid(false)});
if(store.get('bq-adopt',0))adoptAcct();
else if(ME)pullMe().then(syncMe);
(()=>{const q=new URLSearchParams(location.search).get('code');if(!q)return;history.replaceState(null,'',location.pathname);codeModal(q.toUpperCase())})();
</script>
