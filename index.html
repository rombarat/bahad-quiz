['עזרה ראשונה','איך עוצרים שטד״ח?','לחץ ישיר ולחץ עקיף','הרמת רגליים|חבישה רפויה|קירור האזור','לחץ ישיר הוא לחץ על הפצע עצמו. לחץ עקיף הוא לחיצה על נקודת לחיצה בין הפצע ללב.'],
['עזרה ראשונה','מהן נקודות הלחיצה?','מפשעה, צוואר וזרוע','ברך, מרפק וכתף|מצח, חזה ובטן|שוק, אמה וכף יד','בנקודות האלה עורק גדול עובר קרוב לפני השטח ומעל עצם, ולכן אפשר ללחוץ אותו ולהפחית את הדימום.'],
['עזרה ראשונה','איך עוצרים דימום בבית השחי ובעכוז?','באמצעות נקודות לחיצה','חוסם עורקים|הרמת הגפה|חבישה הדוקה בלבד','באזורים האלה אי אפשר להניח חוסם עורקים, כי הם לא גפה. לכן משתמשים בלחץ עקיף.'],
['עזרה ראשונה','מהן סכנות השטד״ח?','הלם, היפותרמיה ונמק','התייבשות, מכת חום ובחילות|שבר, זיהום וכוויה|שיעול, חום ופריחה','איבוד דם מוביל להלם ולקירור הגוף. נמק יכול להופיע אחרי חוסם עורקים שנשאר זמן רב.'],
['עזרה ראשונה','מהם סימני ההלם?','דופק מהיר וחלש, נשימה מהירה ושטחית, הכרה מדרדרת, חיוורון, זיעה קרה','דופק איטי וחזק ועור חם|נשימה איטית ועמוקה ועור אדום|צמא בלבד','בהלם הגוף מנסה לפצות על חוסר דם. הלב והנשימה מואצים, והדם מופנה מהעור לאיברים החיוניים.'],
['עזרה ראשונה','באילו מקרים נשתמש בחוסם עורקים?','חושך, לחץ ישיר שנכשל, בעיה בנשימה','בכל חתך קטן|בדימום מהאף|רק בפגיעה בראש','במצבים האלה אי אפשר לשלוט בדימום בלחץ, או שהידיים צריכות להתפנות לטיפול בבעיה מסכנת חיים אחרת.'],
['עזרה ראשונה','מהם סוגי חוסמי העורקים?','גומי, הולנדי, רוסי, CAT','בד, פלסטיק ומתכת|רך, קשיח וחצי-קשיח|ידני וחשמלי','אלה ארבעת הסוגים בסיכום. CAT הוא החוסם המודרני עם מוט סיבוב.'],
['עזרה ראשונה','מה התיאור המתאים לחוסם עורקים הולנדי?','יצירת חוסם ממשולשי בד, כשאין חוסם גומי','חוסם עורקים מתוצרת הולנד|חוסם ייעודי לראש|חוסם עשוי פלסטיק','״הולנדי״ הוא שם של שיטה ולא של מדינת ייצור. זה חוסם מאולתר ממשולשי בד.'],
['עזרה ראשונה','תוך כמה זמן מהנחת חוסם עורקים יכול להיווצר נמק?','3–4 שעות','15 דקות|30 דקות|24 שעות','בלי זרימת דם הרקמות מתחילות למות אחרי כמה שעות. לכן רושמים את שעת ההנחה ומפנים מהר.'],
['עזרה ראשונה','היכן רושמים לאחר הנחת חוסם עורקים?','מעל החוסם, על המצח ועל הבטן','על הנשק|על כף היד|על הקסדה בלבד','הרישום (שעה ופרטים) צריך להיות גלוי לכל מטפל בהמשך הדרך, כדי שידעו כמה זמן החוסם מונח.'],
['עזרה ראשונה','כיצד מטפלים במכת חום?','שפיכת 40 ליטר מים מהצוואר ומטה','עטיפה בשמיכה|מתן שתייה חמה|השכבה בשמש','מכת חום מסכנת חיים, וצריך לקרר את הגוף מהר. מים בכמות גדולה על הגוף הם הדרך המהירה בשטח.'],
['עזרה ראשונה','מהי התייבשות?','שיבוש מאזן הנוזלים בגוף','עלייה בחום הגוף|ירידה ברמת הסוכר|חסימת נתיב אוויר','התייבשות קורית כשהגוף מאבד יותר נוזלים ממה שהוא מקבל. עלייה בחום היא מכת חום.'],
['עזרה ראשונה','מהם סימני ההתייבשות?','צמא, עור סמוק, דופק מהיר, שתן כהה ומועט, כאבי ראש, בחילות','עור לח וקר ודופק איטי|שתן בהיר ומרובה|רעד וצמרמורות','כשחסרים נוזלים הכליות חוסכות מים, ולכן השתן כהה ומועט. הלב מאיץ כדי לפצות על הנפח החסר.'],
['עזרה ראשונה','מה אינו תסמין למכת קור?','עור לח וסמוק','רעד וצמרמורות|בלבול|עור חיוור וקר','בקור כלי הדם בעור מתכווצים, ולכן העור חיוור וקר. עור סמוק מתאים יותר לחום או להתייבשות.'],
['עזרה ראשונה','מה ההבדל בין פגיעת קור היקפית למרכזית?','היקפית בקצוות הגוף, מרכזית היא היפותרמיה','היקפית היא היפותרמיה, מרכזית בקצוות|אין הבדל|היקפית קורה רק בשלג','פגיעה היקפית, כמו כוויית קור, היא באצבעות ובאוזניים. פגיעה מרכזית היא ירידה בחום הגוף כולו.'],
['עזרה ראשונה','מה עושים בהכשה של חיה ארסית?','מרגיעים, מחטאים, מקבעים למניעת תזוזה ומפנים במהירות','מוצצים את הארס|מניחים חוסם עורקים מעל ההכשה|מניחים קרח וממתינים','תנועה ודופק מהיר מפזרים את הארס. מציצה וחוסם עורקים אינם מומלצים, והפינוי לטיפול באנטי-ארס הוא העיקר.'],
['עזרה ראשונה','מה לא נעשה בהכשת נחש?','נעביר את המטופל לאזור מקורה','נרגיע את החייל|נקבע את האיבר למניעת תזוזה|נפנה במהירות','לפי הסיכום, זו הפעולה שאינה חלק מהטיפול. השאר: הרגעה, קיבוע ופינוי מהיר.'],
['עזרה ראשונה','נכון או לא נכון: מע״ר תמיד יבדוק תגובה לכאב.','לא נכון','נכון','בודקים תגובה לכאב רק אם הפצוע לא מגיב לקול. אם הוא מגיב לקול אין צורך.'],
['עזרה ראשונה','נכון או לא נכון: החייאה (CPR) אינה מתאימה לנפגעי טראומה.','נכון','לא נכון','בנפגע טראומה דום הלב נובע בדרך כלל מאיבוד דם. עיסויים לא יעזרו כשאין דם להזרים, ולכן העדיפות היא עצירת הדימום.'],

const PER=5; // learn rounds per stage, then a review

  const i=PATH.done.length,t=typeAt(i);
  if(t==='review'){
    const recent=PATH.done.slice(i-PER).filter(r=>r.t==='learn');
    const all=[...new Set(recent.flatMap(r=>r.qs))],wrong=[...new Set(recent.flatMap(r=>r.wrong))];
    const n=Math.min(Math.max(LEN,15),all.length),first=shuffle(wrong).slice(0,n);

  }
  const seen=seenInPath(),fresh=D.map((q,j)=>j).filter(j=>!seen.has(j));
  if(!fresh.length)return null;
  return {t,qs:shuffle(fresh).slice(0,LEN)};
}

  if(!ME){el.innerHTML=`<div class="bd-head"><b>טבלת המובילים</b><span>${BOARD?BOARD.length:0} משתתפים</span></div>
    <p class="bd-note">כתוב שם כדי להיכנס לטבלה ולראות איפה כולם נמצאים.</p>
    <form class="bd-join" id="joinForm"><input id="joinName" maxlength="20" placeholder="השם שלך" autocomplete="nickname" required><button class="big" type="submit">הצטרף</button></form>
    ${rows(BOARD||[],5)}`;
    $('#joinForm').onsubmit=async e=>{e.preventDefault();const n=$('#joinName').value.trim();if(!n)return;ME={id:rid(16),secret:rid(32),name:n.slice(0,20)};store.set('bq-me',ME);SFX.unlock();await syncMe();toast('ברוך הבא לטבלה, '+ME.name+'!')};
    return}
  const b=BOARD||[],r=rankOf(b,ME.id),me=b[r];
  let chase='';
  if(r>0){const ahead=b[r-1],gap=ahead.correct-(me?me.correct:0)+1;chase=`<p class="bd-chase">עוד <b>${gap}</b> תשובות נכונות כדי לעקוף את <b>${esc(ahead.name)}</b></p>`}
  else if(r===0&&b.length>1)chase=`<p class="bd-chase lead">אתה במקום הראשון! ${esc(b[1].name)} במרחק ${b[0].correct-b[1].correct} תשובות</p>`;
  el.innerHTML=`<div class="bd-head"><b>טבלת המובילים</b><span>${b.length} משתתפים<button class="link" id="rename">שינוי שם</button></span></div>${chase}${rows(b,8)}`;
  $('#rename').onclick=()=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<form class="box" id="rnForm"><h3>שינוי שם</h3><input id="rnName" maxlength="20" value="${esc(ME.name)}" required><button class="big" type="submit">שמור</button><button class="big ghost" type="button" id="rnCancel">ביטול</button></form>`;document.body.appendChild(m);$('#rnName').focus();$('#rnCancel').onclick=()=>m.remove();$('#rnForm').onsubmit=e=>{e.preventDefault();const n=$('#rnName').value.trim();if(n){ME.name=n.slice(0,20);store.set('bq-me',ME);syncMe()}m.remove()};m.onclick=e=>{if(e.target===m)m.remove()}};
}
function rows(b,max){
  if(!b.length)return '<p class="bd-note">עוד אין משתתפים. תהיה הראשון!</p>';
  const r=ME?rankOf(b,ME.id):-1;let idx=[...Array(Math.min(max,b.length)).keys()];
  if(r>=max)idx=[...idx.slice(0,max-2),-1,r-1,r].filter((x,i,a)=>a.indexOf(x)===i);
  const top=Math.max(1,b[0].correct);
  return '<ol class="bd-list">'+idx.map(i=>{if(i===-1)return '<li class="gap">···</li>';const p=b[i],mine=ME&&p.id===ME.id;
    return `<li class="${mine?'me':''}"><span class="rk ${i<3?'r'+i:''}">${i+1}</span><span class="nm"><b>${esc(p.name)}${mine?' (אתה)':''}</b><small>${stageLabel(p)}</small><i class="bd-bar"><i style="width:${p.correct/top*100}%"></i></i></span><span class="sc">${p.correct}<small>נכונות</small></span></li>`}).join('')+'</ol>';
}
let boardTimer=0;
function pollBoard(on){clearInterval(boardTimer);if(on){loadBoard();boardTimer=setInterval(()=>{if(!document.hidden)loadBoard()},30000)}}

/* ---------- LESSON-JS ---------- */
const OK_WORDS=['מעולה!','בול!','יפה מאוד!','כל הכבוד!','מצוין!','חזק!','ככה עושים את זה!','מדויק!'];
const NO_WORDS=['כמעט!','לא נורא, ממשיכים','לא הפעם','נחזור לזה בסוף'];
const ICON_OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg>';
const ICON_NO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
let L=null;
function startLesson(items,topic,ctx){
  ac();
  L={ctx:ctx||null,items,topic,queue:items.map(q=>({q,retry:false})),total:items.length,done:0,combo:0,maxCombo:0,xp:0,firstTry:0,wrong:new Map(),t0:Date.now(),cur:null,opts:[],sel:-1,state:'pick'};
  $('#pfill').style.width='0%';$('#pbar').classList.remove('fire');setCombo(false);
  show('lesson');next();
}
function next(){
  if(!L.queue.length)return finish();
  L.cur=L.queue.shift();L.sel=-1;L.state='pick';
  const [cat,q,a,ds]=L.cur.q;
  L.opts=shuffle([a,...ds.split('|')]);
  $('#qtag').textContent=cat;$('#qretry').hidden=!L.cur.retry;
  $('#qtext').textContent=q;
  $('#opts').innerHTML=L.opts.map((o,k)=>`<button class="opt" id="o${k}" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(o)}</span></button>`).join('');
  const f=$('#foot');f.className='foot';
  const c=$('#check');c.className='big';c.textContent='בדוק';c.disabled=true;
  $('#stage').scrollTop=0;
  $$('#opts .opt').forEach(b=>b.onclick=()=>choose(+b.dataset.k));
}
function choose(k){
  if(L.state!=='pick')return;
  L.sel=k;SFX.select();
  $$('#opts .opt').forEach(b=>b.classList.toggle('sel',+b.dataset.k===k));
  $('#check').disabled=false;
}
function setCombo(bump){
  const el=$('#combo');$('#comboN').textContent=L.combo;
  el.classList.toggle('on',L.combo>=2);
  $('#pbar').classList.toggle('fire',L.combo>=3);
  if(bump&&L.combo>=2){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
}
function check(){
  if(L.state!=='pick'||L.sel<0)return;
  L.state='fb';
  const [,q,a,,why]=L.cur.q, picked=L.opts[L.sel], ok=picked===a;
  const btns=$$('#opts .opt');
  btns.forEach(b=>{b.disabled=true;const v=L.opts[+b.dataset.k];b.classList.remove('sel');if(v===a)b.classList.add('right');else if(+b.dataset.k===L.sel)b.classList.add('wrong');else b.classList.add('dim')});
  const f=$('#foot'),c=$('#check');
  if(ok){
    L.done++;L.combo++;DONE.add(IDX.get(L.cur.q));saveDone();L.maxCombo=Math.max(L.maxCombo,L.combo);if(!L.cur.retry)L.firstTry++;
    const gain=10+(L.combo>=3?Math.min(L.combo-2,5)*2:0);L.xp+=gain;
    SFX.ok(L.combo);buzz(18);
    const r=$('#o'+L.sel).getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,L.combo>=5?34:18,L.combo>=5?8:5);
    floatText('+'+gain+' XP',r.left+r.width/2,r.top);setTimeout(SFX.coin,260);
    if([3,5,10,15,20].includes(L.combo)){SFX.combo(L.combo);buzz([20,30,60]);setTimeout(()=>{toast(L.combo+' ברצף!'+(L.combo>=5?' בונוס XP':''));const b=$('#combo').getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2,40,9,['#f2a01c','#f5c33b','#ffe07a','#d9443a'])},420)}
    f.className='foot ok';$('#vIcon').innerHTML=ICON_OK;$('#vText').textContent=pick(OK_WORDS);
    $('#fbAns').textContent='';$('#fbAns').hidden=true;
    c.className='big ok';
  }else{
    L.combo=0;
    if(!L.wrong.has(q))L.wrong.set(q,{item:L.cur.q,picked});
    L.queue.push({q:L.cur.q,retry:true});
    SFX.no();buzz([40,40,40]);
    const s=$('#stage');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');
    f.className='foot no';$('#vIcon').innerHTML=ICON_NO;$('#vText').textContent=pick(NO_WORDS);
    $('#fbAns').hidden=false;$('#fbAns').textContent='התשובה הנכונה: '+a;
    c.className='big no';
  }
  $('#fbWhy').textContent=why;
  setCombo(ok);
  $('#pfill').style.width=(L.done/L.total*100)+'%';if(ok&&L.done===L.total)SFX.rise();
  c.textContent=L.queue.length?'המשך':'לסיום השיעור';c.disabled=false;c.focus({preventScroll:true});
}
$('#check').onclick=()=>{if(L.state==='pick')check();else if(L.state==='fb')next()};
$('#speak').onclick=()=>speak($('#qtext').textContent+'. '+L.opts.map((o,i)=>(i+1)+'. '+o).join('. '));

/* quit confirm (in-page) */
$('#quit').onclick=()=>{
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="box"><h3>לצאת מהשיעור?</h3><p>ההתקדמות בשיעור הזה לא תישמר.</p><button class="big" id="stay">להמשיך ללמוד</button><button class="big ghost" id="leave">לצאת</button></div>';
  document.body.appendChild(m);$('#stay').focus();
  $('#stay').onclick=()=>m.remove();
  $('#leave').onclick=()=>{m.remove();speechSynthesis&&speechSynthesis.cancel();show('home')};
  m.onclick=e=>{if(e.target===m)m.remove()};
};

/* ---------- DONE ---------- */
const TROPHY=`<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe07a"/><stop offset="1" stop-color="#f2a01c"/></linearGradient></defs>
<path d="M22 22h-8a14 14 0 0 0 14 18M98 22h8a14 14 0 0 1-14 18" fill="none" stroke="#c87a00" stroke-width="7" stroke-linecap="round"/>
<path d="M26 14h68v26a34 34 0 0 1-68 0z" fill="url(#g1)" stroke="#c87a00" stroke-width="4"/>
<path d="M60 26l5 10 11 1.5-8 7.5 2 11-10-5.5-10 5.5 2-11-8-7.5 11-1.5z" fill="#fff" opacity=".9"/>
<rect x="53" y="73" width="14" height="14" fill="#f2a01c" stroke="#c87a00" stroke-width="4"/>
<rect x="36" y="87" width="48" height="16" rx="5" fill="#58702a" stroke="#3f5219" stroke-width="4"/>`;
function countUp(el,to,suf,ticks){if(reduced){el.textContent=to+suf;return}const t0=performance.now(),d=900;let last=-1,k=0;(function f(t){const p=Math.min((t-t0)/d,1),e=1-Math.pow(1-p,3),v=Math.round(to*e);el.textContent=v+suf;if(ticks&&v!==last&&t-(f.lt||0)>45){SFX.tick(k++);f.lt=t}last=v;if(p<1)requestAnimationFrame(f)})(t0)}
function finish(){
  const tEl=$('#toast');if(tEl)tEl.classList.remove('show');
  const acc=Math.round(L.firstTry/L.total*100), secs=Math.round((Date.now()-L.t0)/1000);
  const perfect=L.wrong.size===0; if(perfect)L.xp+=10;
  sessXp+=L.xp;$('#sessXp').textContent=sessXp;TOTALXP+=L.xp;store.set('bq-xp',TOTALXP);
  const ctx=L.ctx;let pathMsg='';
  if(ctx&&!ctx.replay){PATH.done.push({t:ctx.t,qs:ctx.qs,wrong:[...L.wrong.values()].map(x=>IDX.get(x.item)),acc});savePath()}
  if(ctx){const pos=ctx.i%(PER+1),stage=Math.floor(ctx.i/(PER+1))+1;
    if(ctx.t==='review')pathMsg=`שלב ${stage} הושלם! השלב הבא נפתח`;
    else{const leftR=PER-pos-1;pathMsg=`סבב ${pos+1} מתוך ${PER} בשלב ${stage}`+(leftR?` · עוד ${leftR} עד הבחינה החוזרת`:' · הבא בתור: בחינה חוזרת')}}
  show('done');
  $('#overtake').hidden=true;
  if(ME){const before=BOARD?BOARD.slice():null,oldR=rankOf(before,ME.id);
    syncMe().then(after=>{if(!after)return;const nr=rankOf(after,ME.id);if(nr<0)return;
      const passed=before&&oldR>=0?before.slice(nr,oldR).filter(p=>p.id!==ME.id).map(p=>p.name):[];
      const o=$('#overtake');
      if(passed.length){o.innerHTML=`עקפת את ${passed.slice(0,3).map(esc).join(', ')}${passed.length>3?' ועוד '+(passed.length-3):''}!<small>אתה עכשיו במקום ${nr+1} מתוך ${after.length}</small>`;o.hidden=false;setTimeout(()=>{SFX.combo(10);const r=o.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,60,10,['#f2a01c','#f5c33b','#ffe07a','#d9443a'])},900)}
      else if(nr>0){const a=after[nr-1];o.innerHTML=`מקום ${nr+1} מתוך ${after.length}<small>עוד ${a.correct-after[nr].correct+1} תשובות נכונות כדי לעקוף את ${esc(a.name)}</small>`;o.hidden=false}
      else if(after.length>1){o.innerHTML=`אתה במקום הראשון!<small>${esc(after[1].name)} במרחק ${after[0].correct-after[1].correct} תשובות</small>`;o.hidden=false}})}
  $('#trophy').innerHTML=TROPHY;
  const t=$('#doneTitle');t.className=perfect?'perfect':'';
  t.textContent=perfect?'שיעור מושלם!':acc>=80?'השיעור הושלם!':acc>=50?'סיימת! עוד קצת תרגול':'סיימת! כל טעות היא למידה';
  $('#doneSub').textContent=(pathMsg||((L.topic?L.topic+' · ':'')+L.total+' שאלות'))+(perfect?' · +10 XP בונוס שלמות':'');
  if(ctx&&ctx.t==='review'&&!ctx.replay&&!perfect)t.textContent='בחינה חוזרת הושלמה!';
  $('#again').textContent=ctx?(typeAt(PATH.done.length)==='review'?'לבחינה החוזרת':'לסבב הבא'):'שיעור נוסף';
  const mm=Math.floor(secs/60),ss=String(secs%60).padStart(2,'0');
  $('#stats').innerHTML=[['XP','#f2a01c','xp'],['דיוק','#3c9a3f','acc'],['רצף שיא','#d9443a','cmb'],['זמן','#3b82c4','tm']].map(([n,c,id])=>`<div class="stat" style="--c:${c}"><span>${n}</span><b id="s-${id}">0</b></div>`).join('');
  setTimeout(()=>countUp($('#s-xp'),L.xp,'',true),1100);countUp($('#s-acc'),acc,'%');countUp($('#s-cmb'),L.maxCombo,'');$('#s-tm').textContent=mm+':'+ss;
  const w=[...L.wrong.values()];
  $('#redo').hidden=!w.length;
  $('#review').innerHTML=w.length?'<h3>מה כדאי לחזור עליו</h3>'+w.map(x=>`<div class="rv"><strong>${esc(x.item[1])}</strong><span class="p">${esc(x.picked)}</span><span class="a">${esc(x.item[2])}</span><span class="w">${esc(x.item[4])}</span></div>`).join(''):'';
  setTimeout(()=>{SFX.win(perfect);buzz([30,60,30]);rain();const r=$('#trophy').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,perfect?80:45,10,perfect?['#f5c33b','#ffe07a','#f2a01c','#fff']:null)},250);
  $('#again').focus({preventScroll:true});
}
$('#again').onclick=()=>{if(L.ctx){if(buildRound())startPathRound();else show('home')}else{show('home');launch(L.topic)}};
$('#redo').onclick=()=>startLesson(shuffle([...L.wrong.values()].map(x=>x.item)),L.topic,null);
$('#toHome').onclick=()=>show('home');

/* ---------- KEYS ---------- */
document.addEventListener('keydown',e=>{
  if($('.modal'))return;
  if($('#lesson').hidden)return;
  const k={'1':0,'2':1,'3':2,'4':3}[e.key];
  if(k!==undefined&&k<L.opts.length){choose(k);return}
  if(e.key==='Enter'){e.preventDefault();$('#check').click()}
});

drawSnd();drawLen();drawHome();pollBoard(true);if(ME)syncMe();
</script>
</body>
