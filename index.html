['נשק','מהו סדר הפעולות בתהליך הירי?','דריכה, פעולה לפנים, נקירה, פעולה לאחור','נקירה, דריכה, פעולה לאחור, פעולה לפנים|פעולה לאחור, דריכה, נקירה, פעולה לפנים|דריכה, נקירה, פעולה לפנים, פעולה לאחור','דורכים, המכלול מכניס כדור לבית הבליעה (פעולה לפנים), הנוקר פוגע בפיקה (נקירה), והמכלול נהדף אחורה וחולץ את התרמיל.'],
['נשק','יורים עם אוויר בריאות או בלי?','עם אוויר בריאות — כמעט תמיד הירי יהיה לאחר מאמץ','בלי — רק אחרי נשיפה מלאה|רק במטווח איפוס|זה לא משנה','בשטח יורים בדרך כלל אחרי מאמץ, ואז אין זמן לרוקן ריאות. ירי עם אוויר נותן הפוגה ארוכה ויציבה יותר.'],
['נשק','מה היתרון בירי עם אוויר בריאות?','הפוגה ארוכה יותר, ולכן יותר זמן יציבות לירי מדויק','ירי מהיר יותר|הפחתת הרתע|שיפור הראייה','כשעוצרים את הנשימה עם אוויר בריאות אפשר להחזיק יותר זמן בלי שהגוף ״ידרוש״ נשימה, ולכן הכוונה יציבה יותר.'],
['נשק','לאילו חלקים מתחלקת ההכרזה?','איפוס ומצב אמת','ירי יום וירי לילה|טעינה ופריקה|מעצור ראשון ומעצור שני','ההכרזה היא דיווח של היורה איפה הייתה הכוונת ברגע הירי. היא משמשת גם באיפוס וגם במצב אמת.'],
['נשק','מהם שבעת עקרונות הקליעה?','מצב גוף-קרקע, מצב גוף-נשק, חוק המכוון, נשימה, מצב אפס, סחיטת הדק, הכרזה','טעינה, דריכה, נצירה, ירי, פריקה, ניקוי, איפוס|שכיבה, כריעה, עמידה, ריצה, מחסה, הסתערות, דילוג|קת, קנה, כוונת, הדק, מחסנית, בריח, נוקר','אלה שבעת העקרונות שהיורה שומר עליהם בכל ירייה. התשובות האחרות הן פעולות תפעול, מצבי ירי או חלקי נשק.'],
['נשק','מה העיקרון במצב גוף-קרקע?','הרבה נקודות אחיזה בקרקע, ונשענים על עצמות ולא על שרירים','נשענים על שרירים ולא על עצמות|מינימום מגע עם הקרקע|הרגליים צמודות זו לזו','שרירים מתעייפים ורועדים, ועצמות לא. ככל שיש יותר נקודות מגע עם הקרקע, המצב יציב יותר.'],
['נשק','למה מצמידים את כפות הרגליים לקרקע בעת ירי?','לספיגת הרתע','לשיפור הנשימה|להסתתרות|לשיפור הראייה','הצמדת הרגליים מייצבת את הגוף ומאפשרת לו לספוג את הרתע בלי לזוז, כך שהנשק חוזר למקום.'],
['נשק','מהו חוק המכוון?','חוק שמפרט את עקרונות מיקום הכוונת על האיפוסון','חוק שקובע את מרחק המטווח|סדר טעינת הנשק|כללי הבטיחות במטווח','החוק קובע איך מיישרים את הלהב בתוך חור הכוונת האחורית ומול המטרה, כדי שהכיוון יהיה אחיד בכל ירייה.'],
['נשק','מהו משחק המישורים?','פעולה שמקלה על החייל להתמקד בלהב','תרגיל לשיפור היציבות|שיטה לזיהוי מטרות בלילה|מעבר בין מצבי ירי','העין לא יכולה להתמקד בשלושה מישורים בבת אחת: כוונת, להב ומטרה. לכן מתמקדים בלהב, והמטרה מטושטשת מעט.'],
['נשק','מהם החלקים הפנימיים?','שושנה, נוקר, פין טלוויזיה ופין פציל','קת, קנה ומחסנית|כוונת, איפוסון ולהב|ידית, הדק ונצרה','אלה חלקים בתוך מכלול הבריח. קת, קנה, כוונת והדק הם חלקים חיצוניים.'],
['נשק','מהם סוגי התחמושת שניתן להשתמש בהם?','כדור רגיל, נותב, ירוק, חק״ש ותרגול','רגיל וחודר שריון בלבד|נותב ותבערה בלבד|רגיל, חלול ומתפוצץ','לפי הסיכום אלה הסוגים לרובה: רגיל, נותב (ראש אדום), ירוק, חק״ש ותחמושת תרגול.'],
['נשק','מה מאפיין כדור נותב?','זרחן בקצה שמסמן את נתיב המעוף, ראש קליע אדום','ראש קליע ירוק|ראש קליע כחול ללא זרחן|קליע פלסטיק לתרגול','הזרחן נדלק ומאפשר לראות את מסלול הקליע. כך אפשר לתקן ירי ולסמן מטרות. הנותב מזוהה בראש האדום.'],
['נשק','כמה סוגי מחסניות יש?','2 — מחסנית רגילה ומחסנית לחק״ש','1|3|4','יש מחסנית רגילה ומחסנית ייעודית לחק״ש.'],
['נשק','מהו מצב אפס?','בדיקה עצמית של היורה לוודא את היחס בין מצב הגוף למטרה','מצב שבו הנשק נצור|איפוס מחדש של הכוונת|מצב ללא מחסנית','עוצמים עיניים, נושמים ופותחים. אם הכוונת זזה מהמטרה, הגוף לא מכוון למטרה באופן טבעי וצריך לתקן.'],
['נשק','כיצד נעשים התיקונים במצב אפס?','תמיד על ידי הזזת הגוף','על ידי הזזת הכוונת|על ידי הזזת הנשק בלבד|על ידי החלפת מחסנית','אם רק מזיזים את הנשק בידיים, השרירים מתוחים והנשק יחזור ברתע לכיוון הטבעי. לכן מתקנים את כל מצב הגוף.'],
['נשק','כמה מצבי ירי יש?','5','3|4|7','בסיכום מופיעים 5 מצבי ירי, ביניהם שכיבה, כריעה, עמידה ועמידה אינסטינקטיבית.'],
['נשק','מתי נשתמש בעמידה אינסטינקטיבית?','כשהחייל נדרש לזמן תגובה מהיר','באיפוס|בירי מעל מחסה נמוך|בירי לטווח 100 מ׳','עמידה אינסטינקטיבית מוותרת על חלק מהדיוק בשביל מהירות, למשל במפגש פתאומי בטווח קצר.'],
['נשק','מתי לא נוכל לבצע ירי בשכיבה?','כל התשובות נכונות','כשהירי מעל מחסה בינוני או גבוה|כשהירי תוך כדי ריצה|כשהמארב ממוקם במדרון','בכל שלושת המצבים אי אפשר לשכב ולירות ביעילות. לכן ״כל התשובות נכונות״.'],
['נשק','בכריעה — כמה מהקת מעל שקע הכתף?','שליש','שני שליש|חצי|כל הקת','בכריעה שליש מהקת מעל שקע הכתף. בעמידה שני שליש.'],
['נשק','בעמידה — כמה מהקת מעל שקע הכתף?','שני שליש','שליש|חצי|רבע','בעמידה שני שליש מהקת מעל שקע הכתף, ובכריעה שליש.'],
['נשק','מהם מועדי האיפוס?','כל 6 שבועות, לפני כל פעילות מבצעית, וכשהנשק הגיע מהנשקייה','פעם בשנה|רק לפני פעילות מבצעית|כל שבוע','מאפסים לפי לו״ז קבוע, לפני כל פעילות מבצעית ואחרי שהנשק היה בטיפול או הגיע חדש.'],
['נשק','כיצד מבצעים מטווח איפוס?','5 כדורים, מציאת מקבץ, מציאת נפ״מ, הבאת נפ״מ לנפ״ר ואיפוס סופי','איפוס סופי, 5 כדורים ומציאת מקבץ|מציאת נפ״ר, ירי 10 כדורים ואיפוס|מקבץ, איפוס סופי ונפ״מ','יורים מקבץ, מוצאים את מרכזו (נפ״מ), מתקנים את הכוונות כך שיגיע לנקודת הפגיעה הרצויה (נפ״ר), ומסיימים באיפוס סופי.'],
['נשק','מהו שק משען?','מקנה יציבות באיפוס, מקטין רעידות ועוזר להשיג מקבץ קטן','מגן על הנשק מלכלוך|מחליף את מצב השכיבה|משמש לנשיאת תחמושת','שק המשען מנטרל את חוסר היציבות של היורה. כך המקבץ משקף את הנשק ואת הכוונות.'],
['נשק','מה נותן לנו המקבץ?','מדד לאיכות הירי ומעקב אחר שיפור ביכולת היורה','מדד למהירות הקליע|מדד לטווח הנשק|מדד לבלאי הקנה','גודל המקבץ מראה כמה עקבי היורה. השוואה בין מקבצים מראה אם הוא משתפר.'],
['נשק','מהו מקבץ תקין ומתי מודדים נפ״מ?','עד 5 ס״מ, ומודדים נפ״מ רק אם פגעו 4 כדורים','עד 10 ס״מ, ונפ״מ אם פגעו 3|עד 3 ס״מ, ונפ״מ אם פגעו 5|עד 5 ס״מ, ונפ״מ אם פגעו 2','מקבץ של 5 ס״מ לכל היותר מעיד על ירי תקין. כדי לחשב מרכז אמין צריך לפחות 4 פגיעות.'],
['נשק','מדוע מקבץ הוא מדד לשמירה על עקרונות הקליעה?','מקבץ גדול מ-5 ס״מ מעיד שהיורה לא שמר על העקרונות, ואי אפשר לאפס לפיו','המקבץ מודד את מהירות הקליע|מקבץ קטן מעיד על נשק לא מאופס|המקבץ קובע את מרחק המטווח','פיזור גדול נובע מטעויות של היורה ולא מהכוונות. לכן תיקון כוונות לפיו יהיה שגוי.'],
['נשק','מתי לא נחשב את הנפ״מ?','כשיש 2 קבוצות רחוקות זו מזו, או כשיש רק 3 פגיעות','כשכל 5 הכדורים פגעו|כשהמקבץ קטן מ-5 ס״מ|כשהירי בשכיבה','בשני המקרים המרכז לא מייצג את הירי, ולכן חוזרים על המקבץ במקום לתקן כוונות.'],
['נשק','מהו מצב האיפוס הסופי?','שכיבה, 50 מ׳ למטרה הישגית','עמידה, 25 מ׳|כריעה, 100 מ׳|שכיבה, 25 מ׳','את נקודת הפגיעה מודדים ב-25 מ׳, ואת האיפוס הסופי מבצעים בשכיבה ב-50 מ׳ על מטרה הישגית.'],
['נשק','מהו ההישג הנדרש באיפוס הסופי?','35 נקודות, מרכז הנפ״מ בעיגול ה-10, ולפחות 3 פגיעות בעיגול השחור','25 נקודות ו-2 פגיעות בשחור|50 נקודות ו-5 פגיעות בשחור|30 נקודות ללא תנאי נוסף','צריך לעמוד בכל שלושת התנאים: ניקוד, מיקום המרכז ומספר הפגיעות בשחור.'],
['נשק','באיזה מרחק מודדים נקודת פגיעה רצויה?','25 מ׳','10 מ׳|50 מ׳|100 מ׳','בשלב הראשון של האיפוס יורים מקבצים ב-25 מ׳. אחר כך עוברים לאיפוס הסופי ב-50 מ׳.'],
['נשק','צידוד ועלרוד — היכן מתקנים כל אחד?','צידוד בכוונה האחורית, עלרוד בכוונה הקדמית','צידוד בקדמית, עלרוד באחורית|שניהם בכוונה האחורית|שניהם בכוונה הקדמית','צידוד (ימין-שמאל) מתקנים בכוונה האחורית, ועלרוד (מעלה-מטה) בלהב הקדמי.'],
['נשק','מה השינוי באיפוסון החדש?','כוונת הברזל השתנתה למשולש','נוסף איפוסון אופטי|הכוונת הפכה לעגולה|הלהב הוסר','לפי הסיכום, באיפוסון החדש צורת כוונת הברזל היא משולש.'],
['נשק','מהו איפוס קרבי?','ירי על אבן בגודל אגרוף','ירי על מטרה הישגית ב-50 מ׳|ירי 5 כדורים בשכיבה|ירי בלילה עם נותבים','איפוס קרבי הוא בדיקה מהירה בשטח, כשאין מטווח מסודר. יורים על מטרה בגודל אגרוף ובודקים את הפגיעה.'],
['נשק','מהו מרחק הבטיחות המינימלי בין היורים למטרות?','10 מ׳','5 מ׳|25 מ׳|50 מ׳','מתחת ל-10 מ׳ יש סכנה מרסיסים ומקליעים שניתזים מהמטרה.'],
['נשק','מהם שלבי טעינת הנשק?','נשק 60 מעלות, חמש אצבעות על ידית האחיזה, ודא נצירה, מחסנית בהכנס, נשק טען','דריכה, מחסנית בהכנס, נצירה|מחסנית בהכנס, דריכה, ירי|נצירה, דריכה, מחסנית בהכנס','מכוונים את הנשק לכיוון בטוח, מחזיקים נכון, מוודאים נצירה ורק אחר כך מכניסים מחסנית. בטעינה אין דריכה.'],
['נשק','איזו חברה פיתחה את ה-M16?','קולט','סמית׳ אנד וסון|התעשייה הצבאית|FN','ה-M16 מבוסס על ה-AR-15 של יוג׳ין סטונר, וקולט ייצרה אותו לצבא ארה״ב. התעשייה הצבאית פיתחה את הגליל והתבור.'],
['נשק','מהי מהירות הלוע של ה-M16?','886 מ׳ לשנייה','343 מ׳ לשנייה|650 מ׳ לשנייה|1,200 מ׳ לשנייה','343 מ׳ לשנייה היא מהירות הקול. הקליע של ה-M16 טס כמעט פי שלושה מהר יותר, 886 מ׳ לשנייה.'],
['נשק','ממה עלולים להיגרם מעצורים?','כל התשובות נכונות','תקלה מכנית באחד מחלקי הנשק|בעיה במחסנית|בעיה בתחמושת','מעצור יכול לנבוע מכל אחד מהגורמים: הנשק, המחסנית או התחמושת. לכן ״כל התשובות נכונות״.'],
['נשק','מה מהבאים אינו סיבה למעצור?','הנשק לא עבר איפוס','תקלה מכנית בחלק בנשק|בעיה במחסנית|בעיה בתחמושת','איפוס משפיע על הדיוק, לא על פעולת הנשק. נשק לא מאופס יירה, רק לא במקום הנכון.'],
['נשק','מהו סדר תפעול מעצור ראשון?','הכרזה, נצירה, הבטה במכלול וזיהוי, מכה בעקב המחסנית, דריכה','הכרזה, הוצאת מחסנית, דריכה, ירי|נצירה, דריכה, הכרזה, מכה בעקב|מכה בעקב, דריכה, הכרזה, נצירה','קודם מכריזים ונוצרים כדי שיהיה בטוח. המכה בעקב מוודאת שהמחסנית יושבת, והדריכה מכניסה כדור חדש.'],
['נשק','במעצור ראשון, אם פיקת הכדור נקורה — היכן הבעיה?','בכדור עצמו','בנוקר|במחסנית|בקנה','אם יש סימן נקירה על הפיקה, הנוקר עשה את שלו. הכדור הוא שלא נדלק.'],
['נשק','במעצור ראשון, אם פיקת הכדור לא נקורה — היכן הבעיה?','בנוקר','בכדור|במחסנית|בבריח','אם אין סימן על הפיקה, הנוקר לא פגע בה כלל. לכן התקלה במנגנון הנקירה.'],
['נשק','נכון או לא נכון: מעצור שני יתורגל רק במטווחים יבשים.','נכון','לא נכון','לפי הסיכום, את מעצור שני מתרגלים רק ביבש, בלי ירי חי.'],
['נשק','מהי הסיבה למעצור שלישי?','נגמרה המחסנית','פיקה לא נקורה|תרמיל תקוע|נוקר שבור','במעצור שלישי המחסנית התרוקנה והמכלול ננעל מאחור. לכן מחליפים מחסנית ולוחצים על עצר המחלק.'],
['נשק','מהו סדר תפעול מעצור שלישי?','הכרזה, הבטה וזיהוי, נצירה, הוצאת מחסנית תוך ירידה לכריעה, הכנסת מחסנית מלאה, לחיצה על עצר המחלק','הכרזה, מכה בעקב המחסנית, דריכה|נצירה, פירוק הנשק, ניקוי|הכרזה, דריכה כפולה, ירי','אין צורך לדרוך: הלחיצה על עצר המחלק משחררת את המכלול קדימה והוא מכניס כדור מהמחסנית החדשה.'],
['נשק','מהם המעצורים החריגים?','אי חליצה, ארובה, ברוך','מעצור ראשון, שני ושלישי|נקירה, דריכה, חליצה|מחסנית ריקה, נצרה, קנה סתום','אלה מעצורים שלא מטפלים בהם בתפעול הרגיל של מעצור ראשון, שני או שלישי.'],
['נשק','מהו מעצור אי חליצה?','המכלול כמעט לפנים ללא נעילה ואי אפשר לדרוך; לרוב התרמיל תקוע בבית הבליעה','המחסנית נגמרה|הכדור לא נקר|התרמיל עומד אנכית בחלון הפליטה','התרמיל הריק לא נשלף מבית הבליעה ולכן המכלול נתקע. תרמיל שעומד בחלון הפליטה הוא מעצור ״ארובה״.'],
['נשק','מהם מצבי התפעול של מעצור?','רתק, דילוגים והסתערות','שכיבה, כריעה ועמידה|יום ולילה|טעינה, ירי ופריקה','מתפעלים מעצור לפי המצב הטקטי: ברתק (ירי מחפה), בדילוגים או בהסתערות.'],
['נשק','האם בכל מעצור צריך להוציא מחסנית?','לא — עדיפות לתפעול המעצור, ורק אחר כך טיפול במחסנית','כן, תמיד מוציאים מחסנית ראשונה|רק במעצור ראשון|רק בירי לילה','המטרה היא לחזור לירות מהר. מוציאים מחסנית רק כשהמעצור מחייב זאת, למשל במעצור שלישי או בלילה.'],
['נשק','מהן הבעיות העיקריות בירי לילה?','זיהוי מטרות וכיוונון','רתע ונשימה|מעצורים ותחמושת|טעינה ופריקה','בחושך קשה לראות את המטרה וגם את הכוונות. לכן פותחו שיטות כמו דמוי רשף.'],
['נשק','מהן הדרכים לזיהוי מטרות בלילה?','שיטת דמוי רשף, ירי לילה בכוונת ברזל וסימולטור','פנס ומשקפת|ירי נותבים בלבד|ראיית לילה בלבד','אלה השיטות שבסיכום. דמוי רשף פירושו לזהות את מקום האויב לפי הבזק הירי שלו.'],
['נשק','איך מתפעלים בלילה כשלא מצליחים לזהות את המעצור?','מוציאים את המחסנית ומתפעלים כמעצור שני','מתפעלים כמעצור ראשון|מדליקים פנס|מפסיקים לירות וממתינים לבוקר','בחושך אי אפשר לראות איזה מעצור יש. התפעול של מעצור שני מטפל ברוב המקרים בלי צורך לזהות.'],
['נשק','היכן ימוקמו המטרות בירי לילה?','בסוללת ה-100 מ׳','בסוללת ה-25 מ׳|בסוללת ה-50 מ׳|בסוללת ה-200 מ׳','לפי הסיכום, בירי לילה המטרות מוצבות בסוללת ה-100 מ׳.'],

// ===== עזרה ראשונה =====
['עזרה ראשונה','מה הדבר הראשון שהמע״ר יבצע?','הרחקת הפצוע ממקור הסכנה תוך קריאה לעזרה','החייאה|חבישה|מתן שתייה','קודם בטיחות: אסור להפוך לנפגע נוסף. אחרי שהפצוע במקום בטוח מתחילים בטיפול.'],
['עזרה ראשונה','מהו שלב S?','שלב הבטיחות — נטרול האיום תוך העברת דיווח','עצירת דימום|בדיקת נשימה|הערכת הכרה','S (Safety) בא לפני כל שלבי הטיפול. מנטרלים את האיום ומדווחים כדי שתגיע עזרה.'],
['עזרה ראשונה','מדוע מבצעים הרמת לסת בשלב A?','חשש לחסימת נתיב אוויר','לעצירת דימום|לבדיקת הכרה|למניעת היפותרמיה','שלב A (Airway) עוסק בנתיב האוויר. בנפגע מחוסר הכרה הלשון עלולה לחסום אותו, והרמת הלסת פותחת אותו.'],
['עזרה ראשונה','מה אינו חלק משלב A?','סילוק הפרשות ונצירת נשק הפצוע','הרמת לסת|פתיחת נתיב אוויר|בדיקת חסימה בנתיב האוויר','לפי הסיכום, שלב A מתמקד בפתיחת נתיב האוויר ובבדיקתו. נצירת נשק שייכת לשלב הבטיחות.'],
['עזרה ראשונה','מהם הסימנים לחסימת נתיב אוויר?','אי שקט, התרחבות בית החזה, חיוורון','דופק איטי ועור חם ואדום|צמא ושתן כהה|כאב ראש ובחילה','חוסר חמצן גורם לאי שקט ולחיוורון, והמאמץ לנשום נראה בתנועות בית החזה. צמא ושתן כהה הם סימני התייבשות.'],
['עזרה ראשונה','מהו שלב B?','חיפוש פגיעה במערכת הנשימה','פתיחת נתיב אוויר|עצירת שטד״ח|הערכת הכרה','B (Breathing): בודקים שהפצוע נושם כראוי ומחפשים פגיעה בבית החזה. פתיחת נתיב אוויר היא A.'],
['עזרה ראשונה','מה אינו חלק משלב B?','הערכה מחודשת של מצב ההכרה','בדיקת תנועות בית החזה|האזנה לנשימה|חיפוש פגיעה במערכת הנשימה','הערכת הכרה שייכת לשלב D (Disability). שלב B עוסק רק בנשימה.'],
['עזרה ראשונה','באיזה שלב מבצעים הערכה מחודשת של מצב ההכרה?','שלב D — Disability','שלב A|שלב B|שלב C','הסדר הוא A נתיב אוויר, B נשימה, C דימום וזרימת דם, ו-D מצב נוירולוגי והכרה.'],
['עזרה ראשונה','מה אינו חלק ממשולש החיים?','עיכול','נשימה|הכרה|דופק','משולש החיים כולל נשימה, דופק והכרה. אלה המדדים שמראים שהפצוע בחיים. עיכול לא נבדק בשטח.'],
['עזרה ראשונה','מהם 3 הרפלקסים?','בליעה, שיעול ושרירים','נשימה, דופק והכרה|אישונים, ברך ובליעה|מצמוץ, שיעול ועיטוש','לפי הסיכום אלה שלושת הרפלקסים. נשימה, דופק והכרה הם משולש החיים.'],
['עזרה ראשונה','מה המע״ר יעביר בדיווח שלו?','הפציעה העיקרית, מצב הכרה ומצב נשימה','שם, מספר אישי ויחידה|סוג הנשק ומיקום האויב|גיל, משקל וסוג דם','זה המידע שהגורם הרפואי צריך כדי להיערך ולתעדף: מה הפגיעה, האם הפצוע בהכרה והאם הוא נושם.'],
['עזרה ראשונה','מהי הפגיעה הנפוצה ביותר בצה״ל?','פציעה טראומטית','מכת חום|הכשת נחש|התייבשות','רוב הפגיעות הן טראומה, למשל מירי, רסיסים או תאונות. לכן ההכשרה מתמקדת בעצירת דימום ובנתיב אוויר.'],
['עזרה ראשונה','אל מי מפנים פצוע בצורה רגלית?','למע״ר ולחובש המחלקתי','לפלוגת החייאה קדמית|ישירות לבית חולים|למחלקת הרפואה הגדודית','פינוי רגלי הוא קצר, לדרג הקרוב ביותר. ברמת המחלקה זה המע״ר והחובש.'],
['עזרה ראשונה','מי הגורם הרפואי ברמת הפלוגה?','חובש פלוגתי','מע״ר|מחלקת הרפואה|פלוגת החייאה קדמית','הדרגים: במחלקה מע״ר וחובש, בפלוגה חובש פלוגתי, בגדוד מחלקת הרפואה, ובחטיבה פלוגת החייאה קדמית.'],
['עזרה ראשונה','מי הגורם הרפואי ברמת החטיבה?','פלוגת החייאה קדמית','חובש פלוגתי|מע״ר וחובש|מחלקת הרפואה','זה הדרג הגבוה במדרג. מחלקת הרפואה שייכת לגדוד, והחובש הפלוגתי לפלוגה.'],
['עזרה ראשונה','מה הזמן הממוצע שניידת מד״א צריכה להגיע לאירוע?','5 דקות','1 דקה|15 דקות|30 דקות','לפי הסיכום, זמן ההגעה הממוצע הוא 5 דקות.'],
['עזרה ראשונה','איך עוצרים שטד״ח?','לחץ ישיר ולחץ עקיף','הרמת רגליים|חבישה רפויה|קירור האזור','לחץ ישיר הוא לחץ על הפצע עצמו. לחץ עקיף הוא לחיצה על נקודת לחיצה בין הפצע ללב.'],
['עזרה ראשונה','מהן נקודות הלחיצה?','מפשעה, צוואר וזרוע','ברך, מרפק וכתף|מצח, חזה ובטן|שוק, אמה וכף יד','בנקודות האלה עורק גדול עובר קרוב לפני השטח ומעל עצם, ולכן אפשר ללחוץ אותו ולהפחית את הדימום.'],
['עזרה ראשונה','איך עוצרים דימום בבית השחי ובעכוז?','באמצעות נקודות לחיצה','חוסם עורקים|הרמת הגפה|חבישה הדוקה בלבד','באזורים האלה אי אפשר להניח חוסם עורקים, כי הם לא גפה. לכן משתמשים בלחץ עקיף.'],
['עזרה ראשונה','מהן סכנות השטד״ח?','הלם, היפותרמיה ונמק','התייבשות, מכת חום ובחילות|שבר, זיהום וכוויה|שיעול, חום ופריחה','איבוד דם מוביל להלם ולקירור הגוף. נמק יכול להופיע אחרי חוסם עורקים שנשאר זמן רב.'],
['עזרה ראשונה','מהם סימני ההלם?','דופק מהיר וחלש, נשימה מהירה ושטחית, הכרה מדרדרת, חיוורון, זיעה קרה','דופק איטי וחזק ועור חם|נשימה איטית ועמוקה ועור אדום|צמא בלבד','בהלם הגוף מנסה לפצות על חוסר דם. הלב והנשימה מואצים, והדם מופנה מהעור לאיברים החיוניים.'],
['עזרה ראשונה','באילו מקרים נשתמש בחוסם עורקים?','חושך, לחץ ישיר שנכשל, בעיה בנשימה','בכל חתך קטן|בדימום מהאף|רק בפגיעה בראש','במצבים האלה אי אפשר לשלוט בדימום בלחץ, או שהידיים צריכות להתפנות לטיפול בבעיה מסכנת חיים אחרת.'],
['עזרה ראשונה','מהם סוגי חוסמי העורקים?','גומי, הולנדי, רוסי, CAT','בד, פלסטיק ומתכת|רך, קשיח וחצי-קשיח|ידני וחשמלי','אלה ארבעת הסוגים בסיכום. CAT הוא החוסם המודרני עם מוט סיבוב.'],
['עזרה ראשונה','מה התיאור המתאים לחוסם עורקים הולנדי?','יצירת חוסם ממשולשי בד, כשאין חוסם גומי','חוסם עורקים מתוצרת הולנד|חוסם ייעודי לראש|חוסם עשוי פלסטיק','״הולנדי״ הוא שם של שיטה ולא של מדינת ייצור. זה חוסם מאולתר ממשולשי בד.'],
['עזרה ראשונה','תוך כמה זמן מהנחת חוסם עורקים יכול להיווצר נמק?','3–4 שעות','15 דקות|30 דקות|24 שעות','בלי זרימת דם הרקמות מתחילות למות אחרי כמה שעות. לכן רושמים את שעת ההנחה ומפנים מהר.'],
['עזרה ראשונה','היכן רושמים לאחר הנחת חוסם עורקים?','מעל החוסם, על המצח ועל הבטן','על הנשק|על כף היד|על הקסדה בלבד','הרישום (שעה ופרטים) צריך להיות גלוי לכל מטפל בהמשך הדרך, כדי שידעו כמה זמן החוסם מונח.'],
['עזרה ראשונה','כיצד מטפלים במכת חום?','שפיכת 40 ליטר מים מהצוואר ומטה','עטיפה בשמיכה|מתן שתייה חמה|השכבה בשמש','מכת חום מסכנת חיים, וצריך לקרר את הגוף מהר. מים בכמות גדולה על הגוף הם הדרך המהירה בשטח.'],
['עזרה ראשונה','מהי התייבשות?','שיבוש מאזן הנוזלים בגוף','עלייה בחום הגוף|ירידה ברמת הסוכר|חסימת נתיב אוויר','התייבשות קורית כשהגוף מאבד יותר נוזלים ממה שהוא מקבל. עלייה בחום היא מכת חום.'],
['עזרה ראשונה','מהם סימני ההתייבשות?','צמא, עור סמוק, דופק מהיר, שתן כהה ומועט, כאבי ראש, בחילות','עור לח וקר ודופק איטי|שתן בהיר ומרובה|רעד וצמרמורות','כשחסרים נוזלים הכליות חוסכות מים, ולכן השתן כהה ומועט. הלב מאיץ כדי לפצות על הנפח החסר.'],
['עזרה ראשונה','מה אינו תסמין למכת קור?','עור לח וסמוק','רעד וצמרמורות|בלבול|עור חיוור וקר','בקור כלי הדם בעור מתכווצים, ולכן העור חיוור וקר. עור סמוק מתאים יותר לחום או להתייבשות.'],
['עזרה ראשונה','מה ההבדל בין פגיעת קור היקפית למרכזית?','היקפית בקצוות הגוף, מרכזית היא היפותרמיה','היקפית היא היפותרמיה, מרכזית בקצוות|אין הבדל|היקפית קורה רק בשלג','פגיעה היקפית, כמו כוויית קור, היא באצבעות ובאוזניים. פגיעה מרכזית היא ירידה בחום הגוף כולו.'],
['עזרה ראשונה','מה עושים בהכשה של חיה ארסית?','מרגיעים, מחטאים, מקבעים למניעת תזוזה ומפנים במהירות','מוצצים את הארס|מניחים חוסם עורקים מעל ההכשה|מניחים קרח וממתינים','תנועה ודופק מהיר מפזרים את הארס. מציצה וחוסם עורקים אינם מומלצים, והפינוי לטיפול באנטי-ארס הוא העיקר.'],
['עזרה ראשונה','מה לא נעשה בהכשת נחש?','נעביר את המטופל לאזור מקורה','נרגיע את החייל|נקבע את האיבר למניעת תזוזה|נפנה במהירות','לפי הסיכום, זו הפעולה שאינה חלק מהטיפול. השאר: הרגעה, קיבוע ופינוי מהיר.'],
['עזרה ראשונה','נכון או לא נכון: מע״ר תמיד יבדוק תגובה לכאב.','לא נכון','נכון','בודקים תגובה לכאב רק אם הפצוע לא מגיב לקול. אם הוא מגיב לקול אין צורך.'],

['המנון','למה מתכוון הצירוף ״ארץ ציון וירושלים״?','ציון היא המדינה, וירושלים היא עיר הבירה','ציון ירושלים שתיהן ערים|ציון הוא הר בלבד|ירושלים היא הארץ כולה','לפי הסיכום, ״ציון״ מייצגת את הארץ כולה ו״ירושלים״ את הבירה.'],
['המנון','מדוע מסתכלים בהמנון לכיוון מזרח?','זה כיוון ארץ ישראל מרוב ארצות הגולה','כי שם זורחת השמש|כי כך נאמר בתורה|כי שם נמצא הים','רוב היהודים חיו באירופה, ומשם ארץ ישראל נמצאת במזרח. מאותה סיבה מתפללים לכיוון מזרח.'],
['המנון','מה פירוש ״רוח קדים״?','רוח מזרחית, מדברית','רוח מערבית מהים|רוח צפונית קרה|רוח קדושה','״קדים״ פירושו מזרח בעברית המקראית. רוח קדים היא רוח חמה ויבשה שבאה מהמדבר.'],
['המנון','מדוע הועלו הצעות לשנות את ההמנון?','כי אינו מבטא את המיעוטים, כמו הערבים','כי הוא ארוך מדי|כי הלחן לא עברי|כי נכתב ביידיש','המילים ״נפש יהודי הומיה״ מתייחסות רק ליהודים. מתנגדי השינוי טוענים שההמנון מבטא את מהותה של מדינה יהודית.'],
['המנון','מה מבטא המנון ״התקווה״?','את שיבת העם היהודי לארצו','את זכר השואה|את ניצחון מלחמת העצמאות|את אמונת הדת היהודית','השיר מבטא את הגעגועים הארוכים לציון ואת השאיפה לעצמאות בארץ.'],

['נשק','מה פירוש הקיצור נפ״מ?','נקודת פגיעה ממוצעת','נקודת פגיעה מינימלית|נקודת פגיעה מרכזית|נקודת פגיעה מבצעית','נפ״מ היא נקודת הפגיעה הממוצעת של המקבץ. לפיה מזיזים את הכוונות באיפוס.'],
['נשק','מהן 5 נקודות האחיזה עם הנשק?','קת בשקע הכתף, סחיטת לחי, 5 אצבעות על ידית האחיזה, אמה צמודה למחסנית, יד אוחזת במתפסים','קת בשקע הכתף, רגליים סחוטות על הקרקע, 5 אצבעות על ידית האחיזה, אמה צמודה למחסנית, קת סחוטה על הלחי|קת בשקע הכתף, יד במתפסים, רגליים סחוטות על הקרקע, מבט אל המטרה, 5 אצבעות על ידית האחיזה|45 מעלות למטרה, קת בשקע הכתף, 5 אצבעות על ידית האחיזה, אגודל מוודא נצירה, אמה צמודה למחסנית','נקודות האחיזה הן נקודות המגע בין הגוף לנשק: כתף, לחי, היד על ידית האחיזה, האמה והיד הקדמית. הרגליים אינן נקודת אחיזה עם הנשק.'],
['נשק','מה מהבאים הוא עיקרון בסחיטת ההדק?','לחיצה במקביל לציר הקנה','לחיצה מהירה וחדה|לחיצה באלכסון כלפי מטה|לחיצה עם כל כף היד','לוחצים על ההדק בקו ישר לאחור, במקביל לציר הקנה, כדי לא להסיט את הנשק הצידה.'],
['נשק','כיצד מזהים מעצור שלישי?','המכלול נעצר מאחור','המכלול נשאר לפנים|אי אפשר ללחוץ על ההדק|המכלול נתקע באמצע','במעצור שלישי נגמרה המחסנית, ועצר המחלק נועל את המכלול במצב אחורי.'],
['נשק','מאילו חלקים מורכב מכלול הרובה ב-M16?','שושנה, פין מוביל בריח, נוקר ופין פציל','ידית דריכה, שן חולצת, שן פולטת ופין פציל|שושנה, ידית דריכה, נוקר ופין פציל|שושנה, פין מוביל בריח, נוקר ועצר המחלק','ידית הדריכה ועצר המחלק אינם חלק ממכלול הרובה. במכלול עצמו נמצאים השושנה, פין מוביל הבריח, הנוקר ופין הפציל.'],
['נשק','באיזה מצב פורקים את הנשק לבדיקה?','עמידה','שכיבה|כריעה|לפי העדפת היורה','את פריקת הנשק לבדיקה מבצעים בעמידה.'],
['נשק','מה אורכו של רוס״ר ארוך (M16)?','96.6 ס״מ','93.9 ס״מ|96.9 ס״מ|93.3 ס״מ','אורכו של רובה סער ארוך הוא 96.6 ס״מ.'],
['נשק','מה עושים כששומעים את הפקודה ״וודא כדור״?','מושכים מעט את ידית הדריכה לאחור ומוודאים במבט שיש כדור בבית הבליעה','טוענים את הנשק במשיכת ידית הדריכה ועזיבתה|מוודאים שהנשק נצור|מוודאים שאין כדור בבית הבליעה','״וודא כדור״ פירושו לבדוק שהנשק אכן טעון: מושכים מעט את ידית הדריכה ומביטים בבית הבליעה.'],
['נשק','מה נכון לגבי מצב ירי בכריעה?','90 מעלות בין הרגליים, והישבן נשען על עקב רגל ימין','כף רגל שמאל ב-45 מעלות למטרה, והאמה מתחת לשמורת ההדק|90 מעלות בין הרגליים, ושני שליש מהקת מתחת לשקע הכתף|45 מעלות בין הרגליים, והישבן על הקרקע','בכריעה פותחים זווית של 90 מעלות בין הרגליים ויושבים על עקב רגל ימין, כדי ליצור בסיס יציב.'],
['נשק','מתי חובה לבצע בדיקת נשק?','בכל העברה של נשק מחייל לחייל','בכל כניסה לש״ג|פעם ביום|פעם בשבוע לפחות','בכל פעם שנשק עובר מיד ליד בודקים אותו, כדי לוודא שאינו טעון.'],
['נשק','מה מהבאים הוא דגש לעמידה אינסטינקטיבית?','הכניסה למצב מתבצעת בצורה חזקה ואגרסיבית','מביאים את הרגל החזקה לפנים|הכניסה מבוקרת, איטית ומדויקת|עומדים בזווית של 90 מעלות למטרה','עמידה אינסטינקטיבית נועדה לתגובה מהירה, ולכן נכנסים אליה בכוח ובמהירות.'],
['נשק','כמה שוקל רוס״ר קצר?','1.9 ק״ג','2.1 ק״ג|1.7 ק״ג|2.2 ק״ג','רובה סער קצר שוקל 1.9 ק״ג, בלי מחסנית.'],
['נשק','מהו מעלה הסלילים של ה-M16?','1:12','1:6|1:10|1:15','מעלה הסלילים הוא המרחק שהקליע עובר בקנה עד שהוא משלים סיבוב אחד. ב-M16 זה סיבוב אחד ל-12 אינץ׳.'],
['נשק','כמה כדורים מכניסים למחסנית M16 בצה״ל?','29','30|31|25','המחסנית מכילה 30 כדורים, אבל בצה״ל מכניסים 29 כדי לא להעמיס על הקפיץ ולמנוע מעצורים.'],
['נשק','כמה שוקל רוס״ר ארוך?','2.94 ק״ג','2.74 ק״ג|2.99 ק״ג|1.9 ק״ג','רובה סער ארוך שוקל 2.94 ק״ג. הרוס״ר הקצר שוקל 1.9 ק״ג.'],
['מורשת','מה מהבאים היה חלק מגזירות השמד?','איסור על ברית מילה','איסור על עלייה לכותל|חובת שירות בצבא הרומי|איסור על מסחר עם נוכרים','גזירות השמד אסרו על לימוד תורה, על ברית מילה ועל התקהלות בבתי כנסת.'],
['מורשת','מדוע צפת נחשבת לעיר קדושה?','בשל קרבתה לקבר רבי שמעון בר יוחאי','כי הרמב״ם קבור בה|כי היא בירת הגליל|כי בה נחתמה המשנה','צפת היא אחת מארבע ערי הקודש. קדושתה קשורה לקרבתה למירון, שבה קבור רבי שמעון בר יוחאי, ולמקובלים שפעלו בה.'],
['ציונות','מה גרם לגידול האוכלוסייה היהודית בארץ לקראת סוף המאה ה-19?','עלייה קדם-ציונית','ריבוי טבעי|שיפור בתחושת הביטחון|שיפור במסחר ובתעשייה','עוד לפני העלייה הראשונה הגיעו לארץ יהודים מסיבות דתיות. העלייה הזו הגדילה את האוכלוסייה היהודית.'],
['ציונות','כיצד השפיעה מלחמת העולם הראשונה על היישוב היהודי בארץ?','העלייה, היבוא והייצוא נעצרו','מספר היהודים בארץ הוכפל|נפתחו מקומות מסחר ותעסוקה חדשים|הקשר עם יהודי אירופה התחזק','המלחמה ניתקה את הארץ מאירופה. העלייה, היבוא והייצוא נעצרו, והיישוב סבל ממחסור ומרעב.'],
['ציונות','אילו שתי התפתחויות הובילו לשינוי ביישוב היהודי בארץ במאה ה-19?','היציאה מן החומות בירושלים, וראשית ההתיישבות החקלאית בפתח תקווה ובראש פינה','שיפור הבריאות והתברואה, והיציאה מן החומות|היציאה מן החומות, וראשית ההתיישבות החקלאית ביפו|פרסום עיתונים בעברית ופיתוח הדואר','היציאה מחומות העיר העתיקה והקמת המושבות הראשונות בידי אנשי היישוב הישן סימנו שינוי באורח החיים היהודי בארץ.'],
['ציונות','מי היה יהודה לייב פינסקר?','מחבר החוברת ״אוטואמנציפציה״, שניתחה את בעיית היהודים','פילוסוף יהודי-גרמני שבישר את תנועת ההשכלה|המנהיג הדתי של תנועת חובבי ציון|מייסד ארגון השמירה ״בר גיורא״','פינסקר כתב את ״אוטואמנציפציה״ ב-1882 וטען שהפתרון לבעיית היהודים הוא טריטוריה לאומית משלהם. בהמשך עמד בראש חובבי ציון.'],
['ציונות','מי היו ״חובבי ציון״?','אגודות שקידמו התיישבות יהודית בארץ ישראל בעקבות החוברת ״אוטואמנציפציה״','אגודה שפעלה ברוח הספר ״מדינת היהודים״ של הרצל|ארגון השמירה הראשון בארץ|תנועת נוער שהוקמה אחרי קום המדינה','חובבי ציון קמו ברוסיה אחרי פרעות 1881 ופעלו להתיישבות בארץ עוד לפני הרצל והציונות המדינית.'],
['ציונות','באיזו שנה היה הקרב על תל חי?','1920','1930|1940|1947','הקרב על תל חי התרחש ב-1920. בו נפל יוסף טרומפלדור.'],
['ציונות','בעקבות אילו מאורעות מונתה ועדת פיל?','מאורעות תרצ״ו','מאורעות תר״פ-תרפ״א|מאורעות תרפ״ט|מלחמת העולם השנייה','ועדת פיל מונתה ב-1936 בעקבות פרוץ המרד הערבי (מאורעות תרצ״ו). היא הציעה לראשונה לחלק את הארץ.'],
['ציונות','מה המשפט שמיוחס ליוסף טרומפלדור?','טוב למות בעד ארצנו','אם תרצו אין זו אגדה|אנחנו על המפה|אין דבר העומד בפני הרצון','״טוב למות בעד ארצנו״ מיוחס לטרומפלדור, שנפל בקרב על תל חי ב-1920. ״אם תרצו אין זו אגדה״ הוא משפט של הרצל.'],
['ציונות','מי שירתו בפלוגות הלילה המיוחדות?','נוטרים יהודים לצד חיילים בריטים','ערבים לצד חיילים בריטים|טורקים לצד חיילים בריטים|לוחמי ניל״י בלבד','פלוגות הלילה המיוחדות הוקמו ב-1938 בידי הקצין הבריטי אורד וינגייט, ושילבו נוטרים יהודים עם חיילים בריטים.'],
['שואה','מי מהבאים אינו ״חסיד אומות העולם״?','מרדכי אנילביץ׳','ראול ולנברג|צ׳יאונה סוגיהארה|משפחת הרדגה','מרדכי אנילביץ׳ היה יהודי, מפקד מרד גטו ורשה. התואר חסיד אומות העולם ניתן ללא-יהודים שהצילו יהודים.'],
['שואה','מי היה הכוח המרכזי שרצח יהודים במבצע ברברוסה?','האיינזצגרופן (עוצבות המבצע)','ה-SA (פלוגות הסער)|הנוער ההיטלראי|הצבא האדום','האיינזצגרופן נעו בעקבות הצבא הגרמני בשטחי ברית המועצות ורצחו יהודים בירי המוני.'],
['שואה','היציאה למבצע ברברוסה הפרה את...','הסכם ריבנטרופ-מולוטוב','איגרת הבזק של היידריך|ועידת אוויאן|ועידת ואנזה','הסכם ריבנטרופ-מולוטוב (1939) היה הסכם אי-התקפה בין גרמניה לברית המועצות. ב-1941 גרמניה הפרה אותו ופלשה לברית המועצות.'],
['שואה','מה הם מחנות עקורים?','מחנות מעבר לשארית הפליטה אחרי המלחמה','מחנות ריכוז|מחנות השמדה|גטאות','אחרי המלחמה שוכנו ניצולים רבים במחנות עקורים בגרמניה, באוסטריה ובאיטליה עד שמצאו מקום לחיות בו.'],
['אזרחות','מה מהבאים אינו עיקרון יסוד של מערכת המשפט?','עקרון הערעור','פומביות המשפט|שוויון בפני החוק|הזכות להליך הוגן','עקרונות היסוד של מערכת המשפט הם הזכות להליך הוגן, שוויון בפני החוק ופומביות המשפט.'],
['אזרחות','מהי סמכות מהותית של נשיא המדינה?','חנינת עבריינים והקלה בעונשם','חתימה על חוקי הכנסת|הסמכת שגרירי ישראל|הטלת הרכבת הממשלה על חבר כנסת','רוב סמכויות הנשיא טקסיות. סמכות החנינה היא סמכות מהותית שבה יש לנשיא שיקול דעת אמיתי.'],
['אזרחות','באיזה מקרה המשפט לא יתקיים ב״דלתיים סגורות״?','עתירה לבג״ץ','חשש לחיי אדם|ביטחון המדינה|מעורבות קטינים','בדרך כלל המשפט פומבי. דלתיים סגורות מותרות רק במקרים חריגים, כמו ביטחון המדינה, הגנה על קטינים או חשש לחיי אדם.'],
['אזרחות','שלמה תבע את יוסי על אי-קיום חוזה עבודה. מה סוג המשפט?','אזרחי','פלילי|בג״ץ|מסחרי','סכסוך בין אדם לאדם, כמו הפרת חוזה, נדון במשפט אזרחי. משפט פלילי הוא כשהמדינה מאשימה אדם בעבירה.'],
['אזרחות','מהו הקבינט (״המטבחון״)?','פורום מצומצם של שרים שמכריע בנושאים דחופים, בעיקר ביטחוניים','ועדת החוץ והביטחון של הכנסת|פורום של ראשי מערכת הביטחון בלבד|חדר בכנסת שבו מתקבלות הכרעות בשעת משבר','הקבינט הוא קבוצת שרים מצומצמת שמקבלת החלטות שלא ניתן להביא לדיון בכל הממשלה.'],
['אזרחות','מהי הצעת ״אי-אמון״?','הצעה שמוגשת בכנסת כדי להפיל את הממשלה','עתירה לבג״ץ נגד חוק שאינו חוקתי|עתירה לבג״ץ נגד גוף ממשלתי|הסתייגות מהצעת חוק לפני קריאה ראשונה','באמצעות הצעת אי-אמון הכנסת יכולה להפיל את הממשלה, וכך היא מפקחת על הרשות המבצעת.'],
['מדינה','מיהו ״הראשון לציון״?','הרב הראשי הספרדי','הרב הראשי האשכנזי|ראש מועצת חכמי התורה|ראש העיר ראשון לציון','״הראשון לציון״ הוא תואר של הרב הראשי הספרדי לישראל.'],
['אזרחות','מה מהבאים אינו מטרה של הפרדת הרשויות?','שיתוף ישיר של האזרח בניהול המדינה','איזון ובלימה בין הרשויות|ביזור הכוח השלטוני|הגנה על זכויות המיעוט','הפרדת הרשויות נועדה למנוע ריכוז כוח: הרשויות מאזנות זו את זו. שיתוף האזרחים בשלטון הוא עיקרון אחר, ריבונות העם.'],
['מדינה','מה עושים עם פקודה בלתי חוקית (שאינה בלתי חוקית בעליל)?','מבצעים אותה, ואחר כך מערערים על חוקיותה','חובה לסרב לבצע אותה|לא מבצעים, ומערערים מיד|מתעלמים ממנה','פקודה בלתי חוקית יש לבצע ולהתלונן עליה. רק פקודה בלתי חוקית בעליל, שדגל שחור מתנוסס מעליה, חובה לסרב לבצע.'],
['אזרחות','ערעור על פסק דין של בית המשפט המחוזי יידון ב...','בית המשפט העליון','בית משפט השלום|בית המשפט המחוזי|בית הדין לעבודה','ערעור עובר לערכאה הגבוהה יותר. מעל בית המשפט המחוזי נמצא בית המשפט העליון.'],
['אזרחות','מה מהבאים הוא תנאי להיבחר לנשיא המדינה?','אזרחות ישראלית ותושבות בישראל','גיל מינימלי של 21|צינון של 3 שנים מתפקיד פוליטי|תואר אקדמי במשפטים','לפי חוק יסוד: נשיא המדינה, כל אזרח ישראלי שהוא תושב ישראל כשיר להיבחר.'],
['אזרחות','כיצד נבחרים שופטים בישראל?','בידי ועדה לבחירת שופטים','בידי נשיא המדינה|בהצבעה חשאית בכנסת|בידי נשיא בית המשפט העליון','שופטים נבחרים בוועדה לבחירת שופטים, שחברים בה שופטים, שרים, חברי כנסת ונציגי לשכת עורכי הדין. הנשיא רק ממנה אותם רשמית.'],
['אזרחות','נכון או לא נכון: ראש הממשלה יכול למנות לשר רק חבר כנסת.','לא נכון','נכון','שר יכול להיות גם מי שאינו חבר כנסת. ראש הממשלה הוא היחיד שחייב להיות חבר כנסת.'],
['ציונות','מי הגה את צורת דגל המדינה?','דוד וולפסון','בנימין זאב הרצל|זאב ז׳בוטינסקי|מנחם בגין','וולפסון, ממקורבי הרצל, הציע את הדגל בהשראת הטלית: רקע לבן, פסים כחולים ומגן דוד.'],
['אזרחות','מה מהבאים אינו בסמכות בתי הדין הרבניים?','מינוי ראשי המועצות הדתיות','גיור|נישואין וגירושין|בוררות לפי ההלכה','בתי הדין הרבניים עוסקים בדיני אישות של יהודים, בגיור ובבוררות לפי ההלכה. מינוי ראשי המועצות הדתיות אינו בסמכותם.'],
['מדינה','מה עורר את משבר ״מיהו יהודי״ ב-1958?','הנחיה לרשום כיהודי כל מי שמצהיר על כך בתום לב, ולא לפי ההלכה','מחלוקת בכינוס ״חכמי ישראל״|שאלה אם יהודי חייב לחיות בישראל|הצעה לבטל את חוק השבות','שר הפנים ישראל בר-יהודה הורה לרשום כיהודי את מי שמצהיר על כך. המפלגות הדתיות התנגדו, כי לפי ההלכה יהודי הוא מי שאמו יהודייה.'],
['מדינה','מה היה הרקע לאירועי ואדי סאליב?','מחאה נגד אפליה וקיפוח של עולי צפון אפריקה בידי הממסד','סכסוך בין יהודים לערבים בשכונה|מחאה נגד אנטישמיות בעולם|רצח של תושב השכונה על רקע דתי','ב-1959 פרצה בשכונת ואדי סאליב בחיפה מחאה של עולים ממרוקו, שהרגישו מקופחים לעומת העולים מאירופה.'],
['מדינה','מה הייתה מטרת ועידת מדריד?','השגת שלום בין ישראל לשכנותיה, בחסות הקהילה הבינלאומית','תכנון פעולות במלחמת יום הכיפורים|הסכם שלום עם ירדן בלבד|שיתוף פעולה בין ישראל לאירופה','ועידת מדריד (1991) הייתה הפעם הראשונה שבה ישראל ישבה בגלוי מול נציגי מדינות ערב והפלסטינים, בחסות ארה״ב וברית המועצות.'],
['מדינה','מה הייתה סיבה מרכזית לעלייה מברית המועצות לשעבר בשנות ה-90?','רמת החיים והמשטר הדמוקרטי בישראל','בצורת ורעב ברוסיה|הרצון להשתתף בהגשמה הציונית|הזיקה לדת היהודית','עם התפרקות ברית המועצות נפתחו השערים. רוב העולים חיפשו חיים טובים ובטוחים יותר במדינה דמוקרטית.'],
['אזרחות','מה הבעיה במצב של ״הגמוניה פוליטית״?','מפלגה אחת שולטת זמן רב, וערכיה נתפסים כערכי החברה כולה','מעט אזרחים יוצאים להצביע|מפלגות גדולות מפוצלות בעמדותיהן|הציבור לא מסכים עם מדיניות הממשלה','כשמפלגה אחת שולטת לאורך זמן, כמו מפא״י בשנים הראשונות, קולות אחרים נדחקים לשוליים.'],
['מדינה','מה היה הרעיון של משטר הצנע?','חלוקה שווה של משאבי המדינה ומניעת רעב בתקופת העלייה ההמונית','הסבת שטחי חקלאות לבנייה|מתן עבודה לכל עולה חדש|ביטול המסים על מזון','בשנים הראשונות של המדינה הגיעו המוני עולים. המדינה קבעה מנות קצובות של מזון ומוצרים כדי שיספיקו לכולם.'],
['מדינה','במה היה תהליך אוסלו שונה מתהליכים קודמים?','המשא ומתן התנהל ישירות בין ישראל לפלסטינים, בלי תיווך בינלאומי','רוב הציבור תמך בו|התנהל בגלוי מההתחלה|אושר מראש בידי כל חברי הכנסת','השיחות באוסלו התחילו בחשאי והיו מגע ישיר ראשון בין ישראל לאש״ף.'],
['מדינה','מה היה בבסיס הסכסוך בין בן גוריון לבגין?','תנועת החרות של בגין התנגדה לשלטון מפא״י, שבראשה עמד בן גוריון','בגין רצה לבצע פעולות שמאל קיצוניות|בגין פעל בלי ידיעת בן גוריון|בגין תקף את בן גוריון בנאומים בחו״ל','בן גוריון הוביל את מפא״י ותנועת העבודה, ובגין הוביל את האופוזיציה הימנית. הסכסוך ביניהם נמשך מימי המחתרות.'],
['מדינה','מה הייתה פרשת קו 300?','שני מחבלים שנתפסו חיים נהרגו בידי השב״כ אחרי חקירתם','נוסעת נהרגה בטעות מירי צה״ל|התעלמות ממידע מודיעיני מוקדם|שחרור מחבלים בעסקה','ב-1984 חטפו מחבלים אוטובוס בקו 300. שניים מהם נתפסו חיים, והוצאו להורג בניגוד לחוק. הפרשה הובילה למשבר בשב״כ.'],
['מדינה','מי עלו בעלייה ההמונית?','יהודי תימן, עיראק ומרוקו וניצולי שואה מאירופה','רק ניצולי שואה מפולין|יהודי אתיופיה במבצעים משה ושלמה|יהודי ברית המועצות','בשנים הראשונות אחרי קום המדינה (1948–1951) הוכפלה האוכלוסייה בזכות עלייה גדולה מארצות האסלאם ומאירופה.'],
['מדינה','איזה אירוע הוביל לקביעת המושג ״פקודה בלתי חוקית בעליל״?','הטבח בכפר קאסם','אירועי ואדי סאליב|אירועי אוקטובר|המרד הערבי הגדול','בפסק הדין על הטבח בכפר קאסם (1957) נקבע שיש פקודות שדגל שחור מתנוסס מעליהן, ואסור לבצע אותן.'],
['ציונות','באיזו שנה התקבלה החלטת האו״ם על חלוקת הארץ?','1947','1945|1948|1949','ב-29 בנובמבר 1947 החליטה עצרת האו״ם לחלק את הארץ למדינה יהודית ולמדינה ערבית.'],
['מדינה','מהי ועדת גולדסטון?','צוות של האו״ם שבדק אם ישראל הפרה זכויות אדם בעופרת יצוקה','ועדה ישראלית שבדקה את השיקולים המדיניים במבצע|ועדה שדנה בהרחבת המבצע|ועדה שבדקה את מחדל יום הכיפורים','ועדת גולדסטון הוקמה בידי מועצת זכויות האדם של האו״ם אחרי מבצע עופרת יצוקה (2008–2009).'],
['מדינה','על איזה רקע פרצה מלחמת לבנון השנייה?','טענת חיזבאללה שישראל מחזיקה בשטח לבנוני, ״חוות שבעא״','התיישבות ישראלית בשטח לבנון|סירוב צה״ל לפנות מוצבים בלבנון|מחלוקת על מקורות המים','חיזבאללה השתמש בטענה על חוות שבעא כהצדקה להמשך פעולותיו. המלחמה עצמה פרצה ב-2006 אחרי חטיפת חיילים בגבול.'],
['מדינה','מדוע מלחמת ההתשה נקראת כך?','מצרים ניסתה להתיש את ישראל כדי לאלץ אותה לסגת מסיני','מצרים רצתה לכבוש שטחים בישראל|ישראל ניסתה להתיש את ירדן|שני הצדדים נלחמו עד שנגמרה התחמושת','אחרי ששת הימים ניהלה מצרים לאורך תעלת סואץ מלחמה של הפגזות ופשיטות, כדי לגבות מחיר מתמשך מישראל.'],
['מדינה','מתי התרחש מבצע ״עמוד ענן״?','נובמבר 2012','דצמבר 2008|יולי 2014|מאי 2021','עמוד ענן החל ב-14 בנובמבר 2012 בחיסול אחמד ג׳עברי, מפקד הזרוע הצבאית של חמאס.'],
['מדינה','נגד מי נלחם היישוב בחלקה הראשון של מלחמת העצמאות?','הערבים המקומיים בארץ','צבאות ערב שפלשו לארץ|הצבא הבריטי|הצבא הטורקי','מנובמבר 1947 עד מאי 1948 נלחם היישוב בערביי הארץ. אחרי הכרזת המדינה פלשו צבאות ערב.'],
['מדינה','את איזה תהליך החליפה תוכנית ההתנתקות (2005)?','משא ומתן עם הפלסטינים להסכם שלום','פתיחת מלחמה ברצועה|פעולות צבאיות בשטחי הרצועה|העברת פלסטינים לשטח ישראל','ההתנתקות הייתה צעד חד-צדדי: ישראל יצאה מרצועת עזה בלי הסכם עם הפלסטינים.'],
['אזרחות','נכון או לא נכון: הגישה הסוציאליסטית אינה תומכת בהתערבות המדינה כדי להבטיח חירות וצדק.','לא נכון','נכון','הגישה הסוציאליסטית דווקא תומכת בהתערבות המדינה בכלכלה, כדי לצמצם פערים ולהבטיח צדק חברתי.'],
['שואה','מה הוחלט בוועידת ואנזה?','להפוך את ״הפתרון הסופי״ לשיטתי ומאורגן','להתחיל את הרצח בבורות ירי|לרכז את יהודי פולין בגטאות|לפתור את בעיית הפליטים מגרמניה','בוועידת ואנזה (ינואר 1942) תיאמו הנאצים בין משרדי הממשלה את ההשמדה המאורגנת של יהודי אירופה.'],
['אזרחות','מהי מליאת הכנסת?','הגוף המרכזי של הכנסת, שבו חברים כל 120 חברי הכנסת','ועדה מצומצמת של חברי כנסת|גוף שממנה יו״ר הכנסת|גוף שמפקח על הכנסת מבחוץ','במליאה מתקיימים הדיונים וההצבעות של כל חברי הכנסת. העבודה המפורטת נעשית בוועדות.'],
['אזרחות','מהיכן הגיעו במקור בני העדה הצ׳רקסית?','הקווקז','רוסיה|אפגניסטן|טורקיה','הצ׳רקסים הם מוסלמים סונים שמוצאם בהרי הקווקז. בישראל הם גרים בכפר כמא ובריחאניה ומשרתים בצה״ל.'],
['גאוגרפיה','באיזו עיר נמצאת קריית הלאום?','ירושלים','חיפה|צפת|תל אביב','בקריית הלאום בירושלים נמצאים הכנסת, בית המשפט העליון, משרדי ממשלה ומוזיאון ישראל.'],
['מדינה','מהו האו״ם?','ארגון בינלאומי שהוקם אחרי מלחמת העולם השנייה כדי לשמור על השלום','ארגון שהוקם אחרי מלחמת העולם הראשונה|ארגון לשמירה על השלום באסיה בלבד|ארגון לפיתוח כלכלי בלבד','ארגון האומות המאוחדות הוקם ב-1945 במקום חבר הלאומים, שלא הצליח למנוע את מלחמת העולם השנייה.'],
['גאוגרפיה','לאילו בתי גידול נחלק עמק החולה?','אגם, ביצות ואחו','דיונות, סלעים וחממות|חול, כורכר ואחו|מעיינות, יערות וגבעות','לפני הייבוש היו בעמק החולה אגם, ביצות ושטחי אחו. חלק מהם שוחזר בשמורת החולה.'],
['מורשת','איזה ספר חיבר הרמב״ם?','מורה נבוכים','מגש הכסף|השולחן ערוך|הספר הלבן','הרמב״ם חיבר את ״מורה נבוכים״, ספר פילוסופי, ואת ״משנה תורה״ (״היד החזקה״), ספר הלכה.'],
['מורשת','לאיזה שבט שייכת ירושלים?','לאף שבט','בנימין|יהודה|נפתלי','לפי המסורת, ירושלים לא התחלקה לשבטים והייתה שייכת לכל עם ישראל.'],
['אזרחות','על איזו סוגיה לא התקיים דיון ציבורי בהקשר למשמעות הדמוקרטיה?','מי תהיה הרשות המחוקקת','יחסי רוב ומיעוט|השאיפה לשוויון ולחירות הפרט|ייצוגיות לעומת משילות','אין מחלוקת שהכנסת היא הרשות המחוקקת. הוויכוחים נסובו סביב זכויות המיעוט, חירות הפרט והאיזון בין ייצוגיות למשילות.'],
['מדינה','מהו ארגון ה-OECD?','ארגון שמאגד את המדינות בעלות הכלכלות המפותחות ומקדם שיתוף פעולה ביניהן','ארגון של ארה״ב, קנדה ובריטניה בלבד|ארגון צבאי של מדינות המערב|ארגון לסיוע למדינות עניות','ישראל הצטרפה ל-OECD ב-2010.'],
['ציונות','כיצד כונו העולים שהגיעו החל מהעלייה הראשונה?','היישוב החדש','היישוב הישן|היישוב הקדוש|היישוב המתחדש','היישוב הישן היו היהודים האדוקים שחיו בארץ לפני הציונות. העולים הציונים מ-1882 ואילך נקראו היישוב החדש.'],
['מדינה','מה הייתה מטרת המבצע לביעור הבערות שהוביל יצחק נבון?','ללמד קרוא וכתוב מבוגרים שלא ידעו','שיעורי עזר לילדים עם מוגבלויות|הקמת כיתות לחינוך מיוחד|הגדלת תקציב החינוך','נבון, לימים נשיא המדינה, הוביל בשנות ה-60 מבצע ללימוד קרוא וכתוב, בעיקר בקרב עולים.'],
['מדינה','מי החברות הקבועות במועצת הביטחון של האו״ם?','ארה״ב, בריטניה, רוסיה, צרפת וסין','ארה״ב, בריטניה, גרמניה, צרפת וסין|ארה״ב, איטליה, בריטניה, צרפת וגרמניה|ארה״ב, רוסיה, איטליה, צרפת וסין','לחמש החברות הקבועות יש זכות וטו על החלטות המועצה.'],
['אזרחות','מהו עיקרון ״היד הנעלמה״?','שוק חופשי בלי התערבות הממשלה','שוק מוגבל עם התערבות הממשלה|שוק חופשי עם התערבות הממשלה|שוק מוגבל בלי התערבות הממשלה','אדם סמית טען שכשכל אחד פועל לטובתו, ״יד נעלמה״ מכוונת את השוק לטובת כולם, בלי צורך בהתערבות המדינה.'],
['ציונות','מה הוחלט בוועידת ברלין (1884)?','חלוקת אפריקה בין המעצמות האירופיות','חלוקת אירופה בין המעצמות|חלוקת אסיה בין המעצמות|חלוקת אמריקה בין המעצמות','בוועידת ברלין חילקו המעצמות האירופיות ביניהן את אפריקה, כדי למנוע מאבקים ביניהן.'],
['מדינה','איזו ממשלה החילה את החוק הישראלי על רמת הגולן ב-1981?','ממשלת מנחם בגין','ממשלת יצחק רבין|ממשלת גולדה מאיר|ממשלת אריאל שרון','חוק רמת הגולן עבר בכנסת בדצמבר 1981, בתקופת ממשלת בגין השנייה.'],
['גאוגרפיה','מהו האזור המיושב ביותר בישראל?','מישור החוף','ההר המרכזי|רמת הגולן והחרמון|בקעת הירדן וים המלח','רוב אוכלוסיית ישראל גרה ברצועת מישור החוף, בין חיפה לאשקלון.'],
['גאוגרפיה','מהו הכינוי של העיר עפולה?','בירת העמק','מגדל העמק|עיר הברון|בירת הגליל','עפולה נמצאת במרכז עמק יזרעאל ומכונה ״בירת העמק״.'],
['שואה','על מה הורה היידריך ב״איגרת הבזק״?','לרכז את היהודים בגטאות','לסגור את שערי גרמניה|להתחיל את הפתרון הסופי|להקים את מחנה ההשמדה הראשון','באיגרת הבזק (ספטמבר 1939) הורה היידריך לרכז את יהודי פולין הכבושה בערים גדולות, ליד מסילות ברזל. זה הוביל להקמת הגטאות.'],
['מורשת','מהו מדרש?','לקט של דרשות, סיפורים והדרכות שקשורים לפסוקי המקרא','קובץ הלכתי שנחתם בידי רבי יהודה הנשיא|קובץ של פסקי דיינים|רשימת המצוות שבתורה','המדרש מפרש את פסוקי התנ״ך בדרך של סיפור, משל ודרשה. הקובץ שחתם רבי יהודה הנשיא הוא המשנה.'],
['מדינה','מתי הוקם המפעל להובלת מים מהירקון לנגב?','שנות ה-50','שנות ה-40|שנות ה-60|שנות ה-70','קו הירקון-נגב הופעל ב-1955 והביא מים להתיישבות בנגב, עוד לפני המוביל הארצי.'],
['ציונות','באיזו שנה פרסם הרצל את הספר ״אלטנוילנד״?','1902','1896|1897|1906','״אלטנוילנד״ (״תל אביב״ בתרגום לעברית) הוא רומן אוטופי של הרצל על החברה היהודית בארץ ישראל. ממנו לקוח המשפט ״אם תרצו אין זו אגדה״.'],
['ציונות','מי היה מנחם אוסישקין?','ממנהיגי הציונות המעשית, ומזכיר בקונגרס הציוני הראשון','כותב החוברת ״אוטואמנציפציה״|מייסד תנועת המזרחי|ראש הממשלה הראשון','אוסישקין דגל בהתיישבות מעשית בארץ ועמד שנים רבות בראש הקרן הקיימת לישראל.'],
['מדינה','לאיזו חטיבה כפוף הגדס״ר הבדואי?','החטיבה הדרומית בעזה','החטיבה הצפונית בעזה|חטמ״ר 769|חטמ״ר שגיא','הגדס״ר הבדואי (גדוד הסיור המדברי) פועל לאורך גבול רצועת עזה במסגרת החטיבה הדרומית.'],
['שואה','במה מרד גטו ורשה שונה ממרידות אחרות?','הוא המרד הגדול ביותר, והלוחמים החזיקו מעמד כמעט חודש','רק בו הצליחו היהודים לפגוע בגרמנים|מאות יהודים ברחו בו מהגטו|הלוחמים בו נלחמו יחד עם הפרטיזנים','המרד פרץ באפריל 1943 בהנהגת מרדכי אנילביץ׳. מעט לוחמים מול צבא גדול החזיקו מעמד כמעט חודש.'],
['מדינה','מה היו ההשלכות של מלחמת שלום הגליל על מנחם בגין?','הפגנות ומחאות נגדו, שבסופן החליט לפרוש מהחיים הפוליטיים','הוא נבחר לכהונה נוספת|הוקמה ועידת מדריד לדון בלקחי המלחמה|הציבור תמך בו באופן גורף','המלחמה והאבדות בה עוררו מחאה ציבורית גדולה. ב-1983 בגין הודיע ״איני יכול עוד״ ופרש.'],
['מורשת','נכון או לא נכון: החמץ נמכר לגוי לפני פסח, וחוזר לבעליו אחרי החג.','נכון','לא נכון','מכירת חמץ נועדה כדי לא להחזיק חמץ בפסח. אחרי החג החמץ חוזר לבעליו.'],
['ציונות','מה ההבדל העיקרי בין היישוב הישן האשכנזי ליישוב הישן הספרדי?','היחס למודרנה ולשילוב לימודי חול','העיסוק בעבודת האדמה|הקשרים הכלכליים עם השלטון|היחס לעולים החדשים','היישוב הישן הספרדי היה פתוח יותר למודרנה ולמסחר. האשכנזים התנגדו ללימודי חול והתרכזו בלימוד תורה.'],
['ציונות','מהי תוכנית באזל?','דרישת התנועה הציונית להקים בית לאומי לעם היהודי בארץ ישראל, בהכרה בינלאומית','תוכנית לחלוקת הארץ בין יהודים לערבים|גוף כלכלי של עשירי שווייץ|הקמת מועצה יהודית בכל מדינה','תוכנית באזל אושרה בקונגרס הציוני הראשון (1897) וקבעה את מטרת הציונות: בית לאומי בארץ ישראל המובטח במשפט הציבורי.'],
['ציונות','מה הייתה ההשלכה העיקרית של הספר הלבן הראשון (1922)?','עבר הירדן המזרחי הופרד מארץ ישראל, והעלייה הוגבלה לפי כושר הקליטה הכלכלי','עבר הירדן הופרד, ונאסרה רכישת קרקעות|עבר הירדן הופרד, והמחתרות הוצאו מחוץ לחוק|העלייה נאסרה לחלוטין','הספר הלבן של צ׳רצ׳יל קבע שהבית הלאומי לא יכלול את עבר הירדן, ושהעלייה תהיה לפי יכולת הקליטה הכלכלית של הארץ.'],
['ציונות','מהו ״ריב הלשונות״?','מאבק ב-1913–1914 על הנחלת העברית כשפת ההוראה בארץ','מאבק על הקמת האקדמיה ללשון העברית|ריב בין יהודי ספרד לאשכנז|ויכוח על לימוד שפות זרות בבתי הספר','הוויכוח פרץ כשהוחלט שבטכניון ילמדו בגרמנית. המורים והתלמידים שבתו, ובסוף העברית ניצחה.'],
['שואה','מה היה היודנראט?','מועצה יהודית שהנאצים מינו לניהול הגטו','כינוי גנאי ליהודי|המשטרה היהודית בגטו|אישור יציאה מהגטו לעבודה','הנאצים חייבו את הקהילות להקים יודנראט, שהיה אחראי לביצוע הוראותיהם בגטו.'],
['ציונות','הרצל דיבר על הצורך ב״צ׳רטר״. מהו?','אישור בינלאומי להתיישבות יהודית','היתר להעברת סחורות בלי מכס|היתר מעבר ליהודים בין מדינות|סרטיפיקט לעלייה לארץ','הציונות המדינית של הרצל חיפשה קודם הכרה ואישור של המעצמות (צ׳רטר), ורק אחר כך התיישבות.'],
['ציונות','מי היה אהרון דוד גורדון?','הוגה דעות מהעלייה השנייה, שעבד כפועל והיה מורה רוחני לעולים','מייסד ההסתדרות|מי שהגה את רעיון הקיבוץ|מפקד ארגון השומר','א״ד גורדון הטיף ל״דת העבודה״: חזרה לעבודת האדמה כדרך לתיקון האדם והעם.'],
['אזרחות','לאיזה כיוון מתפללים המוסלמים בישראל?','דרום, לכיוון מכה','מזרח, לכיוון מסגד אל-אקצא|דרום, לכיוון מסגד אל-אקצא|מערב, לכיוון מכה','המוסלמים מתפללים לכיוון המסגד הקדוש (אל-חראם) במכה, שנמצאת דרומית לישראל.'],
['אזרחות','נכון או לא נכון: פשיזם הוא צורת השלטון באיראן ותחת הטליבאן.','לא נכון','נכון','באיראן ותחת הטליבאן השלטון הוא תיאוקרטי, כלומר מבוסס על חוקי הדת. פשיזם הוא משטר לאומני של מנהיג יחיד.'],
['ציונות','במה הואשם אלפרד דרייפוס?','ריגול ובגידה לטובת גרמניה','ריגול לטובת בריטניה|ריגול לטובת האימפריה העות׳מאנית|שוחד ומעילה','דרייפוס, קצין יהודי בצבא צרפת, הואשם בבגידה בעלילת שווא. הרצל סיקר את המשפט, והאנטישמיות שראה חיזקה את רעיון המדינה היהודית.'],
['מורשת','כיצד נקרא ספר התורה של יהודי אתיופיה?','אורית','ביתא ישראל|אירית|קסים','״אורית״ הוא ספר התורה בשפת הגעז. ״ביתא ישראל״ הוא שם הקהילה, ו״קסים״ הם מנהיגיה הדתיים.'],
['גאוגרפיה','איזה אזור בארץ מתאים במיוחד לקינון עופות דורסים?','רמת הגולן','השומרון|הכנרת|אילת','המצוקים והנחלים ברמת הגולן, כמו בגמלא, משמשים מקום קינון לנשרים ולדורסים אחרים.'],
['ציונות','מי היה וינסטון צ׳רצ׳יל?','ראש ממשלת בריטניה במלחמת העולם השנייה, ולפני כן שר המושבות','ראש ממשלת בריטניה במלחמת העולם הראשונה|ראש הצבא הבריטי בתקופת המנדט|שר החוץ הבריטי שכתב את הצהרת בלפור','כשר המושבות פרסם צ׳רצ׳יל את הספר הלבן הראשון (1922). במלחמת העולם השנייה עמד בראש בריטניה.'],
['גאוגרפיה','איזו עיר מכונה ״עיר היהלומים״?','נתניה','תל אביב|הרצליה|ראש פינה','בנתניה התפתחה תעשיית ליטוש יהלומים, ולכן היא מכונה ״עיר היהלומים״.'],
['שואה','מה היה ״הגירוש למזרח״?','שם קוד לאקציות ולשילוח היהודים למחנות ההשמדה','שם קוד לצעדות המוות|שם קוד לריכוז היהודים בגטאות|סיסמת הלוחמים במרד גטו ורשה','הנאצים הסתירו את ההשמדה במילים תמימות כמו ״גירוש למזרח״ ו״יישוב מחדש״.'],
['אזרחות','כמה עיירות בדואיות הקימה המדינה בנגב (נכון ל-2012)?','7','9|10|12','המדינה הקימה בנגב שבע עיירות לבדואים. הגדולה בהן היא רהט.'],
['גאוגרפיה','מהו ״מדבר בצל גשם״?','מדבר מקומי שנוצר מאחורי רכס הרים, ואינו חלק מחגורת המדבריות העולמית','מדבר עם הפרשי טמפרטורה קיצוניים|מדבר עם כמות גשם גבוהה יחסית|כל מדבר שיורד בו מעט גשם','מדבר יהודה הוא מדבר בצל גשם: העננים מורידים את הגשם על הרי יהודה, ומזרחה להם כמעט לא יורד גשם.'],
['מדינה','מי כבש את החרמון בתחילת מלחמת יום הכיפורים?','הצבא הסורי','הצבא המצרי|הצבא הירדני|הצבא העיראקי','ב-6 באוקטובר 1973 כבשו הסורים את מוצב החרמון. צה״ל כבש אותו בחזרה בסוף המלחמה.'],

['מורשת','מהי עלילת דמשק?','עלילה שהאשימה יהודים ברצח פולחני של נזיר נוצרי ומשרתו','רצח השליט המוסלמי בדמשק|טבח של עשרות יהודים|רדיפות שאילצו יהודים לעזוב את ארצות האסלאם','ב-1840 הואשמו יהודי דמשק בעלילת דם. משה מונטיפיורי ואחרים פעלו לשחרור העצורים.'],

['ציונות','מהי תוכנית 11 הנקודות?','הקמת 11 יישובים בנגב בלילה אחד','כיבוש 11 ערים במוצאי יום כיפור|הקמת 11 עיירות פיתוח|פינוי 11 התנחלויות','במוצאי יום כיפור תש״ז (1946) עלו 11 יישובים בנגב בלילה אחד, כדי שהנגב ייכלל בשטח המדינה היהודית.'],

['ציונות','לזכר מי הוקמה אנדרטת ״האריה השואג״?','מגיני תל חי','לוחמי הגטאות|חללי מלחמת יום הכיפורים|חללי מלחמת העצמאות','האריה השואג בכפר גלעדי מנציח את טרומפלדור וחבריו שנפלו בתל חי ב-1920.'],
['אזרחות','מהו העיקרון המרכזי באמנה של נאט״ו?','התקפה על אחת המדינות נחשבת להתקפה על כולן','נסיגה של אחת מחייבת את כולן|כל המדינות חייבות להצטרף למערכה תוך 48 שעות|כל המדינות פועלות באופן אחיד בחינוך ובכלכלה','ברית נאט״ו נוסדה ב-1949. לפי סעיף 5 שלה, התקפה על מדינה חברה היא התקפה על כל החברות.'],
['אזרחות','נכון או לא נכון: הפוסט-מודרניזם טוען שאין אמת אחת, ואילו המודרניזם מאמין באמת אחת.','נכון','לא נכון','המודרניזם האמין בתבונה ובאמת אחת. הפוסט-מודרניזם טוען שכל אמת תלויה בנקודת המבט.'],

['ציונות','איך מכונים מאורעות תרצ״ו-תרצ״ט מנקודת המבט הערבית?','המרד הערבי הגדול','הנכבה|האינתיפאדה הראשונה|מרד הכפרים','הערבים ראו באירועים מרד נגד הבריטים ונגד המפעל הציוני. הנכבה היא כינוי ערבי למלחמת העצמאות.'],

['נשק','איך מזהים מעצור ראשון ואיך מתפעלים אותו?','המכלול לפנים. מכים בעקב המחסנית ודורכים שוב','המכלול לאחור. מחליפים מחסנית|המכלול באמצע. מחליפים מחסנית ודורכים|המכלול לפנים. מחליפים מחסנית ולוחצים על עצר המחלק','במעצור ראשון המכלול נשאר לפנים. מכה בעקב המחסנית מוודאת שהיא יושבת, ודריכה מכניסה כדור חדש.'],

['נשק','למה שכיבה היא מצב הירי האידיאלי?','היא מאפשרת ירי מדויק יותר עם חשיפה מינימלית','זווית הראייה בין הכוונות טובה יותר|הכניסה אליה מהירה יותר|הרגל החזקה מקבילה לקנה','בשכיבה יש הכי הרבה נקודות מגע עם הקרקע, ולכן הכי יציב, והיורה חשוף הכי פחות.'],

['נשק','איך מביאים את הנפ״מ לנפ״ר?','סופרים משבצות בצידוד ובגובה, ממירים לקליקים ומזיזים את הכוונת','מחשבים לפי נוסחה את המרחק בין הנקודות|מודדים בסרגל את המרחק בין הפגיעות|מעריכים בעין ומזיזים קליקים','כל משבצת במטרה שווה למספר קליקים מוגדר. סופרים את ההפרש בצידוד ובגובה וממירים לקליקים.'],

['נשק','איך מודדים מקבץ?','בין שתי הפגיעות הרחוקות ביותר, מקצה הכדור הראשון עד קצה הכדור השני','בין שתי הפגיעות הקרובות ביותר|ממרכז פגיעה למרכז פגיעה|ממרכז המטרה עד הפגיעה הרחוקה','מקבץ אמין הוא עד 5 ס״מ, ונמדד בין שתי הפגיעות הרחוקות ביותר מתוך החמש.'],
['נשק','איך משתמשים בשק פק״ל בירי?','השק תומך בשורש כף היד ומותאם לגובה היורה','השק תומך גם במחסנית|מניחים את הנשק על השק ורק אחר כך נכנסים למצב|מניחים את השק מתחת למרפקים','השק מייצב את הנשק דרך כף היד, בלי לגעת במחסנית.'],
['נשק','למה משתמשים בשק פק״ל בירי?','כדי לקבל יציבות ומקבץ קטן ככל האפשר','כדי למנוע שריטות במרפקים|כדי להגן מפני זוחלים|כדי להסתיר את היורה','השק מוסיף יציבות, וכך הפגיעות קרובות יותר זו לזו.'],

['נשק','מה נכון לגבי הנשימה בזמן ירי?','עוצרים את הנשימה לפני הירי, וממשיכים לנשום אחרי שהקליע יצא','נושמים פנימה תוך כדי לחיצה על ההדק|לנשימה אין השפעה על הירי|נושמים מהר כדי להירגע','הנשימה צריכה להיות רגועה ואחידה. בזמן הירי עוצרים אותה לרגע, כדי שהגוף לא יזוז.'],

['עזרה ראשונה','פצוע בהלם עמוק, בלי דימום חיצוני. מה כנראה המצב ומה עושים?','יש לו שטף דם פנימי, ומפנים אותו מהר לבית החולים','יש דימום חיצוני שלא מצאנו, ובודקים שוב|מנתחים בשטח|עוברים לפצוע אחר','הלם בלי דימום נראה לעין מעיד על דימום פנימי. בשטח אי אפשר לעצור אותו, ולכן רק פינוי מהיר יציל.'],

['מורשת','מהי לאדינו?','שפה יהודית-ספרדית','מדינה שאליה ברחו מגורשי ספרד|מילת קוד של האנוסים|כינוי למגורשי ספרד','לאדינו היא שפת היהודים הספרדים, מבוססת על ספרדית עם מילים בעברית. מגורשי ספרד הפיצו אותה בעיקר באימפריה העות׳מאנית.'],
['ציונות','מה משותף לרב אלקלעי, לרב קלישר ולמשה הס?','שלושתם ״מבשרי הציונות״','שלושתם חתמו על מגילת העצמאות|שלושתם הנהיגו גטאות בשואה|שלושתם היו חברי מפא״י','באמצע המאה ה-19, עוד לפני הרצל, הם העלו רעיונות של שיבה לאומית לארץ ישראל.'],
['ציונות','מה היה החידוש המרכזי בספר ״מדינת היהודים״?','שלבי פעולה מפורטים להקמת מדינה ליהודים','הטענה שיש להקים את המדינה באוגנדה|התייחסות לבעיות הביטחון של ישראל|הדרישה לשנות את הדת','הרצל לא רק תיאר חלום. הוא הציע תוכנית מעשית: גופים, כספים והכרה בינלאומית.'],

['מורשת','מה היו משפטי פראג?','משפט ראווה אנטישמי בצ׳כוסלובקיה הקומוניסטית','משפטי פושעי מלחמה נאצים|משפט נגד פעילים ציונים במערב אירופה|משפט נגד יהודים שריגלו בארה״ב','ב-1952 הועמדו לדין בפראג בכירים, רובם יהודים, באשמות שווא של ״ציונות״ וריגול. רובם הוצאו להורג.'],

['מורשת','באילו ערים חוגגים את שושן פורים?','בערים שהיו מוקפות חומה מימות יהושע בן נון','בערים שאינן מוקפות חומה|בערים שאינן ליד מקור מים|בערים שכבש יהושע בן נון','בערים שהיו מוקפות חומה מימות יהושע, כמו ירושלים, חוגגים את פורים ביום שאחריו, בט״ו באדר.'],
['מורשת','מי היה ירבעם בן נבט?','המלך הראשון של ממלכת ישראל אחרי פילוג הממלכה','מלך יהודה שבירתו ירושלים|נציב בריטי|בנו של שלמה המלך','אחרי מות שלמה התפלגה הממלכה: ירבעם מלך על עשרת השבטים בצפון (ישראל), ורחבעם בן שלמה על יהודה.'],
['מורשת','של אילו מלכים הממלכה שמכונה ״הממלכה המאוחדת״?','דוד ושלמה','ירבעם ורחבעם|אלכסנדר ינאי ושלומציון|שאול ויהונתן','בימי דוד ושלמה כל שבטי ישראל היו ממלכה אחת. אחרי מות שלמה היא התפלגה לישראל ויהודה.'],
['מורשת','מה מתארת מגילת איכה?','את חורבן בית ראשון','את מרד בר כוכבא|את חורבן ביתר|את פרעות ת״ח-ת״ט','מגילת איכה, שמיוחסת לירמיהו, מקוננת על חורבן ירושלים והבית הראשון. קוראים אותה בתשעה באב.'],
['מורשת','מה נכון לגבי יהודי ארצות הברית?','זו הקהילה היהודית השנייה בגודלה בעולם','הם סבלו מפרעות בראשית העת החדשה|הם קיבלו אוטונומיה דתית בוועד מיוחד|הם מתנגדים לציונות באופן עקרוני','יהדות ארה״ב היא השנייה בגודלה אחרי יהדות ישראל.'],

['מורשת','איך השפיעה הפרדת הדת מהמדינה על יהודי ארצות הברית?','היא אפשרה להם להשתלב בחברה','היא גרמה לפרעות|היא גרמה להגירה לדרום אמריקה|היא אפשרה להם לעסוק בחקלאות','מכיוון שלמדינה לא הייתה דת רשמית, היהודים יכלו להשתלב כאזרחים שווים.'],
['מורשת','על חורבות איזו עיר הקימו הרומאים את איליה קפיטולינה?','ירושלים','עכו|קיסריה|מצדה','אחרי מרד בר כוכבא הקים הקיסר אדריאנוס על חורבות ירושלים עיר רומית בשם איליה קפיטולינה, ואסר על יהודים להיכנס אליה.'],
['מורשת','איזה חיבור נוצר בישיבות סורא ופומבדיתא?','התלמוד הבבלי','השולחן ערוך|המשנה|פירוש רש״י','סורא ופומבדיתא היו מרכזי התורה בבבל, ובהן נוצר התלמוד הבבלי.'],

['אזרחות','מה תפקיד האופוזיציה?','להציע לציבור חלופה למדיניות הממשלה','לתמוך בפעולות הממשלה|לבחור את מבקר המדינה|לפקח על חיילי צה״ל','האופוזיציה מבקרת את הממשלה ומציגה חלופה, וכך שומרת על האיזון בדמוקרטיה. את הממשלה מגבה הקואליציה.'],
['ציונות','במה עוסק הספר ״אלטנוילנד״ של הרצל?','באופי של המדינה היהודית העתידית כ״חברת מופת״','בדרכים לשכנע את יהודי אירופה לעלות|בתוכנית אוגנדה|בתשובה לביקורת של אחד העם','באלטנוילנד תיאר הרצל חברה יהודית מתקדמת, צודקת ושוויונית בארץ ישראל.'],
['ציונות','מה הייתה המחלוקת בין הציונות המדינית לציונות המעשית?','המדינית רצתה קודם צ׳רטר בינלאומי, והמעשית רצתה להתחיל מיד בהתיישבות','המדינית רצתה מרכז רוחני, והמעשית מדינה|המדינית התמקדה בארץ, והמעשית ביהודי הגולה|המדינית שללה יחסים עם אומות העולם','הרצל רצה הכרה בינלאומית לפני התיישבות. הציונות המעשית האמינה ב״עוד דונם ועוד עז״. הציונות הסינתטית שילבה ביניהן.'],
['ציונות','מאיזו אימפריה ניסה הרצל לקבל זכות להתיישבות בארץ ישראל?','האימפריה העות׳מאנית','האימפריה הבריטית|האימפריה הרוסית|האימפריה הגרמנית','בימי הרצל ארץ ישראל הייתה תחת שלטון עות׳מאני, ולכן הוא ניסה להשיג צ׳רטר מהסולטן.'],
['אזרחות','מהי הערכאה הנמוכה ביותר במערכת בתי המשפט בישראל?','בית משפט השלום','בית המשפט המחוזי|בית המשפט העליון|בית המשפט האזרחי','הסדר מלמטה למעלה: בית משפט השלום, בית המשפט המחוזי, בית המשפט העליון.'],

['מורשת','למען מה פעלה תנועת החסידות?','קירוב כלל היהודים, חסרי ההשכלה וקשי היום במזרח אירופה לדת','סיוע ליהודים קשיי יום כלכלית, חלוקת מזון ומציאת מקומות עבודה|הטמעת המצוות שבין האדם למקום בחברה היהודית|חזרה בתשובה של גויים במזרח אירופה','החסידות קירבה לדת את פשוטי העם במזרח אירופה, ושמה דגש על שמחה ועל תפילה מכל הלב.'],

['מורשת','לפי צוואת הורדוס, בין מי חולקה ממלכתו?','לבני משפחתו','לשליטי הארץ הקודמים|ליהודה וישראל|לנושא כליו של הורדוס','אחרי מות הורדוס חולקה ממלכתו בין בניו.'],
['מורשת','מה משמעות המושג ״ריש גלותא״?','ראש הגלות','שר בממלכת רומי|עניים בגלות|ראש ישיבה','ריש גלותא (ראש הגלות) היה מנהיג יהודי בבל.'],
['מורשת','מה נאלצו יהודי תימן לעשות בעקבות רדיפה דתית בשנים 1678-1679?','להתאסלם או לעזוב את בתיהם','למכור את עצמם כעבדים|למצוא עבודה חדשה|לשלם מיסים כפול משאר התושבים','בגלות מוזע (1679) גורשו יהודי תימן מבתיהם אחרי שסירבו להתאסלם.'],
['מורשת','מהו מתיוון?','יהודי שאימץ את התרבות והדת היוונית','לוחם בצבא היווני בתקופת בית החשמונאים|כינוי לאיש רוח ודת יווני|חייל חשמונאי שנהג להתחפש לחייל היווני','מתייוון הוא יהודי שאימץ את התרבות והדת היוונית בימי בית שני.'],
['מורשת','מהו ספרו המרכזי של הרמב״ם?','משנה תורה','תלמוד|תושב״ע|פירוש התלמוד','ספרו המרכזי של הרמב״ם הוא ״משנה תורה״, ספר הלכה מקיף.'],
['מורשת','מהו שמו המלא של הרמב״ם?','רבי משה בן מיימון','רבי מנחם בר מיימון|רבי מנחם בן משה|רבי מיימון בן משה','הרמב״ם הוא רבי משה בן מימון.'],
['מורשת','מהו שמו השני של יעקב?','ישראל','דן|יהודה|נפתלי','אחרי המאבק עם המלאך נקרא יעקב גם בשם ישראל.'],
['מורשת','מהו תחום המושב?','אזור במערב האימפריה הרוסית, שרק בו הותר ליהודים לגור','כינוי למושב היהודי הראשון בשטחי ארץ ישראל|הקהילה היהודית בפולין טרם הכיבוש|הכינוי לשטחים בהם הותר לערבי ישראל לשהות בארץ','תחום המושב היה אזור במערב האימפריה הרוסית, שרק בו הותר ליהודים לגור.'],
['מורשת','מהי ממלכת הגדעונים?','כינוי לקהילה היהודית העצמאית באתיופיה','הקהילה היהודית בארה״ב|כינוי לקהילה היהודית בארצות האיסלאם|כינוי לקהילה היהודית בפולין','ממלכת הגדעונים הייתה ממלכה יהודית עצמאית באתיופיה, לפי מסורת יהודי אתיופיה.'],
['מורשת','מהי תקופת ״הימים הרעים״?','תקופת הקרב בין צבא אתיופיה לצבאות מצרים, סודן ואיטליה','הימים בהם יהדות צפון אפריקה נספתה בשואה|הימים בהם נרדפו יהודים בגין כפיית הדת לעדה האתיופית|תקופת הרעב בקהילה היהודית באתיופיה','״הימים הרעים״ היא תקופה של מלחמות ורעב באתיופיה בסוף המאה ה-19, שבה נספו רבים מבני ביתא ישראל.'],
['מורשת','מי בנה את נמל קיסריה ואת הארמונות במצדה?','הורדוס','מתיתיהו|כורש|דוד המלך','הורדוס היה בנאי גדול: נמל קיסריה, ארמונות מצדה והרחבת בית המקדש.'],
['מורשת','מי היה הרב עובדיה יוסף?','אחד ממנהיגיה של היהדות החרדית הספרדית','מנהיג ציבור יהודי באירופה, שימש כפרופסור וכרב|מחנך ואיש ציבור, מנהיג הקהילה היהודית בספרד|ממקימי הרבנות הצבאית','הרב עובדיה יוסף היה הרב הראשי הספרדי ומנהיג היהדות החרדית-ספרדית, ומייסד ש״ס.'],
['מורשת','מי היה הרב שלמה גורן?','הרב הראשי האשכנזי לישראל','מנהיג ציבור יהודי ברוסיה, שימש כפרופסור וכרב|אחד ממנהיגיה של יהדות אירופה|מחנך ואיש ציבור, מההיג הקהילה היהודית בספרד','הרב שלמה גורן היה הרב הצבאי הראשי הראשון, ואחר כך הרב הראשי האשכנזי.'],
['ציונות','מי היה חיים נחמן ביאליק?','המשורר הלאומי','מלחין התקווה|חתן פרס ישראל|חתן פרס סוקולוב','חיים נחמן ביאליק מכונה ״המשורר הלאומי״.'],
['מורשת','מי היה טיטוס?','קיסר רומאי שהחריב את בית המקדש השני','אחד ממנהיגי המרד בכיבוש מצדה|״הלוחם שעודד את המתבצרים במצדה לבחור ״בחירות על פני חיים״|לוחם רומאי ידוע שהנהיג את קרבות הר הבית','טיטוס היה המצביא הרומי, ולימים קיסר, שהחריב את בית המקדש השני ב-70 לספירה.'],
['מורשת','מי היה המלך הראשון של ישראל?','שאול','שמואל|שלמה|דוד','שאול היה המלך הראשון של ישראל, ואחריו מלך דוד.'],
['מורשת','מי היו בניו של אברהם אבינו?','ישמעאל ויצחק','קין והבל|יעקב ועשו|יצחק ויעקב','בניו של אברהם הם ישמעאל, מהגר, ויצחק, משרה.'],
['מורשת','מי היו השופטים?','מנהיגים אזוריים של 12 השבטים, לאחר מות יהושע','נביאים שפירשו חלומות ל12 ראשי השבטים|זקני העם שעסקו באיחוד 12 השבטים|השופטים הראשונים ביהדות עליהם מתבססים חוקי המדינה','השופטים היו מנהיגים שקמו לשבטי ישראל אחרי מות יהושע ולפני תקופת המלוכה, כמו דבורה, גדעון ושמשון.'],
['מורשת','מי מונה למלוך על יהודה לאחר ״גלות החרש והמסגר״?','צדקיהו','יהואחז|שלמה|יהויכין','אחרי שהוגלה יהויכין לבבל, מינה נבוכדנצר את צדקיהו למלך יהודה. הוא היה המלך האחרון לפני החורבן.'],
['מורשת','מי עמד בראש מרד בר כוכבא?','שמעון בן כוסבא','משה בר יוחאי|שמעון בר יונה|משה בר כוכבא','מנהיג המרד (132–135 לספירה) נקרא שמעון בן כוסבא. ״בר כוכבא״ הוא כינוי שניתן לו.'],
['מורשת','מי היו המלכים שמלכו אחרי שלמה המלך?','רחבעם וירבעם','מפיבושת ויהויכין|רחל ופרעה|יהויכין וירבעם','אחרי מות שלמה התפלגה הממלכה: רחבעם מלך ביהודה, וירבעם בממלכת ישראל.'],
['מורשת','נאמר על רש״י: ״פיזר את אוצרות רוחו... כנהר הנותן מימיו לכל, בלי לדעת שאין עולם בלעדיהם״. מדוע?','חיבר פירוש מקיף לתורה ולתלמוד, שלומדים בו עד היום','חיבר מגילות כתובות המתארות את התקופה הקדומה|פירש חלומות תנכיים שפירושם תקף גם כיום על ימינו|פעל למען הדת היהודית אך לבסוף גורלו היה מר','פירושו של רש״י לתורה ולתלמוד הוא עד היום הפירוש הבסיסי שבעזרתו לומדים את הטקסטים האלה.'],
['מורשת','על צאצאיו של מי מבוססים שבטי ישראל?','יעקב','שרה|אברהם|עשיו','שנים עשר שבטי ישראל הם צאצאי שנים עשר בני יעקב.'],
['שואה','איזו וועדה התכנסה בברלין ב-20 בינואר 1942?','ואנזה','ריבנטרופ-מולוטוב|מינכן|אוויאן','ועידת ואנזה התכנסה בברלין ב-20 בינואר 1942 ותיאמה את ביצוע ״הפתרון הסופי״.'],
['שואה','אילו מדינות הכריזו מלחמה על גרמניה בתגובה לכיבוש פולין?','בריטניה וצרפת','צרפת, ברית המועצות|ארצות הברית וברית המועצות|בריטניה וארצות הברית','אחרי הפלישה לפולין ב-1 בספטמבר 1939 הכריזו בריטניה וצרפת מלחמה על גרמניה.'],
['שואה','אילו מחנות השמדה הופעלו לראשונה במסגרת מבצע ריינהארד?','בלז׳ץ, סוביבור וטרבלינקה','אושוויץ, מאוטהאוזן ודכאו|חלמנו, טרזינשטט ויאנובסקה|דכאו, טרזינשטט וברגן-בלזן','במבצע ריינהרד הופעלו מחנות ההשמדה בלז׳ץ, סוביבור וטרבלינקה, כדי להשמיד את יהדות פולין.'],
['שואה','מה נכתב על קסטנר בפסק הדין במשפטו?','״מכר את נשמתו לשטן״','אין אני עומד יחידי עמדי ניצבים כאן בשעה זו 6 מליון קטגורים|נשמת ילד קטן שעוד לא ברא השטן|כל המציל נפש אחת כאילו הציל עולם במלואו','בפסק הדין במשפט קסטנר (1955) כתב השופט בנימין הלוי שקסטנר ״מכר את נשמתו לשטן״.'],
['שואה','איך הציל קסטנר יהודים?','במשא ומתן עם קציני אס-אס בכירים','הברחתם באמצעות ״רכבות רפאים״ לשוויץ|הנפקת ויזות ודרכונים מזוייפים|העסקתם במפעלים גרמנים','קסטנר ניהל משא ומתן עם קציני אס-אס בכירים, ובעקבותיו יצאה ״רכבת קסטנר״ עם כ-1,700 יהודים.'],
['שואה','באיזו שנה אישרה הכנסת את חוק ״יד ושם״?','1953','1952|1955|1954','חוק יד ושם התקבל בכנסת ב-1953.'],
['מורשת','במה הואשמו היהודים במגפת ״המוות השחור״?','הרעלת הבארות','הפצת הדיזנטריה|יצירת המשבר הכלכלי הגדול|רצח ילד בלונדון','בימי ״המוות השחור״ (מגפת הדבר במאה ה-14) הואשמו היהודים בהרעלת הבארות, ונטבחו קהילות רבות.'],
['שואה','אילו שמות חויבו יהודי גרמניה להוסיף לשמם ב-1938?','גברים: ישראל, נשים: שרה','גברים: אברהם, נשים: רבקה|גברים: ישראל, נשים: מרים|גברים: אברהם, נשים: לאה','מ-1938 חויבו יהודי גרמניה להוסיף לשמם ״ישראל״ לגברים ו״שרה״ לנשים, כדי לסמן אותם.'],
['שואה','היכן הסתתר אדולף אייכמן לאחר מלחמת העולם השנייה?','ארגנטינה','קולומביה|מקסיקו|ברזיל','אייכמן ברח לארגנטינה וחי בה בשם בדוי, עד שהמוסד חטף אותו ב-1960.'],
['שואה','כיצד החלה מלחמת העולם השניה?','בפלישה לפולין','בפלישה לצרפת|בפלישה לברית המועצות|בסיפוח אוסטריה לגרמניה','מלחמת העולם השנייה פרצה ב-1 בספטמבר 1939 עם הפלישה הגרמנית לפולין.'],
['שואה','כיצד הסתיימה פרשת קסטנר?','נרצח בידי יהודי, ובית המשפט העליון זיכה אותו','זוכה והיגר לארה״ב|יצא אשם והוצא להורג|יצא אשם וקיבל מאסר עולם','קסטנר נרצח ב-1957 בידי יהודי. ב-1958 קבע בית המשפט העליון שרוב ההאשמות נגדו לא היו מוצדקות.'],
['שואה','איך נקראת גרמניה בתקופה שאחרי מלחמת העולם הראשונה?','רפובליקת ויימאר','התקופה השחורה|המשבר הגדול|אנשלוס','רפובליקת ויימאר היא הרפובליקה הגרמנית שקמה אחרי מלחמת העולם הראשונה ונפלה כשהנאצים עלו לשלטון.'],
['שואה','כיצד ניסה אדולף אייכמן להקל על עונשו במשפטו?','טען שהיה בורג קטן במערכת שרק מילא פקודות','טען שאינו קשור כלל ליישום הפיתרון הסופי|טען שהיה לא שפוי כתוצאה ממלחמת העולם ה-1|טען כי עסק בתיעוד וכתיבה ולא ביישום וביצוע','במשפטו טען אייכמן שהיה רק ״בורג קטן במערכת״ שביצע פקודות. בית המשפט דחה את הטענה.'],
['שואה','איך ניסתה המפלגה הנאצית לעלות לשלטון בפעם הראשונה, ב-1923?','בהפיכה שנכשלה (פוטש)','בבחירות דמוקרטיות|בניצול מלחמת אזרחים|בליל הסכינים הארוכות','ב-1923 ניסו היטלר והנאצים לבצע הפיכה במינכן (״פוטש המרתף״) ונכשלו. רק ב-1933 עלו לשלטון בבחירות.'],
['שואה','מה היה המניע לפרוץ מהומות ליל הבדולח ב-1938?','רצח דיפלומט גרמני בשגרירות גרמניה בפריז','ניסיון לגרום ליהודים לעזוב את גרמניה|פשע של יהודי נגד אישה גרמנייה|התקוממות של יהודים בגרמניה','ליל הבדולח (נובמבר 1938) פרץ אחרי שנער יהודי רצח דיפלומט גרמני בשגרירות בפריז. הנאצים השתמשו ברצח כתירוץ.'],
['שואה','מה מקור השם גטו?','רובע נפרד שבו גרו היהודים בוונציה','כינוי לשכונת עוני|משמעו באיטלקית גועל/חלחלה|כינוי לבור השופכין של הערים באירופה','המילה ״גטו״ באה מוונציה: ב-1516 רוכזו היהודים שם ברובע נפרד, שנקרא על שם יציקת מתכת (גטו).'],
['שואה','מה נוצר בקרב העם הגרמני לאחר מלחמת העולם הראשונה?','תחושת השפלה ומשבר כלכלי חברתי חמור','פחד וחשש מכיבוש|תחושת ניצחון ושאננות|שגשוג כלכלי ופיתוח תעשייתי','אחרי התבוסה במלחמת העולם הראשונה הרגישו הגרמנים מושפלים וסבלו ממשבר כלכלי. בזה השתמשו הנאצים.'],
['שואה','מהו ״ליל הסכינים הארוכות״?','חיסול יריבים בתוך המפלגה הנאצית, בעיקר מפקדי ה-SA','נסיון הפיכת המפלגה הנאצית לעלייתה לשלטון|שריפת הספרים היהודיים|הרס חורבן בתי הכנסת והחנויות היהודיות','ב״ליל הסכינים הארוכות״ (1934) חיסל היטלר את יריביו בתוך המפלגה, בעיקר את מפקדי ה-SA.'],
['שואה','מהו ״מישלינג״?','צאצא לנישואי תערובת','חוקים לאיסור קראית ספרים בעלי אופי יהודי|תנועת הנוער הנאצית|תנועת נוער יהודית','לפי חוקי נירנברג, ״מישלינג״ הוא צאצא של נישואי תערובת בין יהודים ללא-יהודים.'],
['שואה','מהו האומשלגפלאץ?','כיכר השילוחין בגטו','אסיר האחראי על השלטת סדר במחנה|כינוי לעובדים במשרפות|הכוחות המיוחדים לטיהור העם הגרמני','האומשלגפלאץ הייתה כיכר השילוחים בגטו ורשה, שממנה נשלחו היהודים לטרבלינקה.'],
['שואה','מהו ״דר שטירמר״?','שבועון שהיווה חלק מהתעמולה הנאצית','הפלישה לברית המועצות|מועצת זקנים- הגוף המתווך בין הגרמנים לציבור היהודי|חיבור שכתב משורר שנולד בגטו וילנה','״דר שטירמר״ היה שבועון אנטישמי של התעמולה הנאצית, בעריכת יוליוס שטרייכר.'],
['שואה','מהי אקציה?','שילוח היהודים למחנות','כינוי לניסויי מנגלה באסירי אשוויץ|ריכוז היהודים בגטאות|בריחת היהודים מהגטאות ליערות','״אקציה״ הוא כינוי למבצע של איסוף יהודים ושילוחם למחנות ההשמדה.'],
['שואה','מהי סלקציה?','מיון בין עבודת פרך להשמדה','תהליך קליטת האסירים במחנות העבודה|תהליך הכנסת היהודים לרכבות|מיון בין גברים לנשים במחנות','בסלקציה מיינו הנאצים את האסירים: מי יישלח לעבודת פרך ומי יישלח להשמדה מיד.'],
['שואה','מי היה אדולף אייכמן?','מבכירי המנגנון הנאצי, ואחראי ליישום הפתרון הסופי','מפקד מחנה אשוויץ בירקנאו|מנהיג התעמולה הנאצית|השר לענייני בעיית היהודים ותורת הגזע','אדולף אייכמן היה מבכירי האס-אס ואחראי לארגון השילוחים במסגרת ״הפתרון הסופי״. הוא הוצא להורג בישראל ב-1962.'],
['שואה','מי היה אהרון לייבסקינד?','לוחם מחתרת ופרטיזן יהודי, ממקימי המחתרת בקרקוב','מפקד במחנה אושוויץ שהורה על פיצוץ המשרפות|מפקד מרד גטו וורשה לקראת סוף המלחמה|מפקד הבריגדה היהודית בצבא הבריטי','אהרון לייבסקינד (״דולק״) היה ממנהיגי המחתרת היהודית הלוחמת בקרקוב.'],
['שואה','מי היה האנס פרנק?','המושל הנאצי של פולין הכבושה','מראשי הגסטפו|אביה של אנה פרנק|ממקימי האומשלגפלץ','הנס פרנק היה המושל הנאצי של ״הגנרל-גוברנמן״, שטחי פולין הכבושה.'],
['שואה','מי היה יואכים פון ריבנטרופ?','שר החוץ הגרמני','שר החוץ הרוסי|ראש הצבא הסדיר הגרמני|ראש הצבא האדום','יואכים פון ריבנטרופ היה שר החוץ של גרמניה הנאצית, וחתם על ההסכם עם מולוטוב ב-1939.'],
['שואה','מי היה פרידריך ברברוסה?','קיסר גרמני מימי הביניים שהיטלר העריץ','הקיסר הגרמני אותו החליף היטלר בשלטון|שר התעמולה הנאצית בתקופתו של היטלר|מפקד הגסטפו וחיל האוויר הגרמני','פרידריך ברברוסה היה קיסר גרמני מימי הביניים שהיטלר העריץ, ועל שמו נקרא מבצע ברברוסה.'],
['שואה','מי הם חסידי אומות העולם?','לא-יהודים שהצילו יהודים בסיכון עצמי ובלי תמורה','יהודים אשר נטלו חלק בהצלת היהודים תוך סיכון עצמי ללא תמורה|גרמנים אשר נטלו חלק בהצלת יהודים בגרמניה תמורת סכום כספי ורכוש|אוקראינים אשר נטלו חלק בהצלת יהודים תמורת סכום כספי ורכוש','חסידי אומות העולם הם לא-יהודים שהצילו יהודים בשואה, תוך סיכון עצמי ובלי לקבל תמורה.'],
['שואה','מי היה השופט בנימין הלוי?','שופט אשר ניהל את משפט קסטנר, אייכמן והשתתף במשפט כפר קאסם','התובע הכללי במשפט אייכמן שתבע את השמפט ״6 מליון קטגוריות״|סגן ראש ה״ועד לעזרה והצלה״ בהונגריה בתקופת המלחמה|הרב הראשי בקהילת לובלין אשר צעד בראש האקציה למחנה מיידנק','השופט בנימין הלוי ישב בדין במשפט קסטנר, במשפט אייכמן ובמשפט כפר קאסם.'],
['שואה','מיהו פרימו לוי?','סופר וכימאי יהודי שנכלא באושוויץ','ראש כל מועצות היהודנרט|הוגה דעות ופילוסוף יהודי מיגוסלביה|מנהיג מרד גטו וורשה','פרימו לוי, כימאי וסופר יהודי מאיטליה, שרד את אושוויץ וכתב עליו את ״הזהו אדם?״.'],
['שואה','מיהו צ׳יונה סוגיהארה?','קונסול יפני בקובנה, שהנפיק אשרות והציל אלפי יהודים','קונסול סין שניפק אשרות ליהודי אוסטריה וע״י כך הבריח אותם מאירופה|שר החוץ הסיני אשר חתם על הסכמי הברית בין גרמניה הנאצית לקיסרות סין|מפקד חיל האוויר היפני שפיקד על מבצע פרל הארבור (הפצצת חיל הים האמריקאי)','צ׳יונה סוגיהארה, הקונסול היפני בקובנה, הנפיק אלפי אשרות ליהודים ב-1940 נגד הוראות ממשלתו.'],
['שואה','מיהו ראול ולנברג?','איש עסקים ודיפלומט שוודי שהציל רבבות מיהודי הונגריה','קונסול פורטוגל שהבריח עשרות אלפי יהודים מצרפת לספרד ומשם לאמריקה|מלך דנמרק שהבריח יהודים לשבדיה|עסקן גרמני שהעסיק יהודים במפעליו על מנת להצילם','ראול ולנברג, דיפלומט שוודי בבודפשט, הציל עשרות אלפי יהודים בעזרת תעודות חסות.'],
['שואה','מהו הגנרל-גוברנמן?','שטחי פולין שאינם עתידים להיות מסופחים לגרמניה','מפקד כוחות הגרמנים במבצע אוברלורד|כינוי לאזור מוסדות השלטון ברייך השלישי באירופה המערבית|מפקד הכוחות הגרמנים בקרבות סטלינגרד','הגנרל-גוברנמן היה החלק של פולין הכבושה שלא סופח לגרמניה, ושבו רוכזו מחנות ההשמדה.'],
['שואה','מתי החלה רדיפת יהודי פולין?','ב-1939, עם הפלישה לפולין','ב1938 מערב ליל הבדולח|ב1940 עם הפלישה לרומניה|ב1941 עם תחילת המבצע ריבנטרוב-מולוטוב','רדיפת יהודי פולין החלה עם הפלישה הגרמנית בספטמבר 1939.'],
['שואה','מתי פרצה מלחמת העולם השניה?','1 בספטמבר 1939','22 ביוני 1939|5 בספטמבר 1936|6 ביוני 1939','מלחמת העולם השנייה פרצה ב-1 בספטמבר 1939.'],
['שואה','על מה התבססו המחתרות בגטאות?','תנועות הנוער היהודיות','יהודנרט|קאפו|מוזלמנים','המחתרות בגטאות התבססו בעיקר על תנועות הנוער היהודיות, כמו השומר הצעיר, דרור ובית״ר.'],
['ציונות','איזה ארגון עובדים הוקם בשנת 1920?','ההסתדרות הכללית של העובדים העבריים','חלוצי העלייה השנייה|אגודת ישראל|ההסתדרות החקלאית של העובדים','ההסתדרות הכללית של העובדים העבריים בארץ ישראל הוקמה ב-1920.'],
['ציונות','איזו מושבה הוקמה במקביל לראש פינה?','פתח תקווה','דגניה|זכרון יעקב|משכנות שאננים','פתח תקווה (1878) וראש פינה (1878) הן המושבות הראשונות, ושתיהן נוסדו בידי אנשי היישוב הישן.'],
['ציונות','איזו עלייה התחילה בתקופת המנדט הבריטי?','העלייה השלישית','העלייה הראשונה|העלייה השנייה|העלייה החמישית','העלייה השלישית (1919–1923) הייתה הראשונה בתקופת המנדט הבריטי.'],
['ציונות','איזו קבוצה הוקמה ב-1909?','דגניה','משכנות שאננים|ראש פינה|אם המושבות','דגניה, ״אם הקבוצות״, הוקמה ב-1909 על שפת הכנרת.'],
['ציונות','באיזו שנה גירשו הטורקים את יהודי יפו ותל אביב?','1917','1916|1918|1919','ב-1917, בזמן מלחמת העולם הראשונה, גירשו הטורקים את יהודי יפו ותל אביב.'],
['ציונות','באיזו שנה החלה ״תקופת המאבק״?','1945','1942|1941|1947','״תקופת המאבק״ נגד הבריטים החלה ב-1945, אחרי סוף מלחמת העולם השנייה.'],
['ציונות','בין אילו שנים חלה העלייה הראשונה?','1882-1903','1882-1904|1883-1904|1883-1903','העלייה הראשונה נמשכה מ-1882 עד 1903.'],
['ציונות','כיצד נקראה השכונה היהודית הראשונה שהוקמה מחוץ לחומות ירושלים?','משכנות שאננים','המושבה הגרמנית|גילה|מחנה ישראל','משכנות שאננים, שמונטיפיורי יזם ב-1860, הייתה השכונה היהודית הראשונה מחוץ לחומות ירושלים.'],
['ציונות','כמה יהודים חיו בארץ בראשית המאה ה-19?','6,000','60,000|300,000|30,000','בראשית המאה ה-19 חיו בארץ ישראל רק כ-6,000 יהודים, רובם בערי הקודש.'],
['ציונות','לאחר איזו עליה חודשה ההתיישבות בפתח תקווה?','עליה ראשונה','עליה שלישית|עליה רביעית|עליה שניה','פתח תקווה ננטשה זמן קצר אחרי שנוסדה, וחודשה בימי העלייה הראשונה.'],
['ציונות','למה גרמה שיטת הפקידות?','תלות של החקלאים במימון חיצוני','תלות של החקלאים בעובדים רבים|פיתוח של התשתיות הכלכליות במושבות|פיתוח של בנקים בהתיישבות שעזרו לחקלאים בניהול כלכלי','שיטת הפקידות של הברון רוטשילד גרמה לחקלאים להיות תלויים במימון חיצוני ובפקידים.'],
['ציונות','למה הוביל הדגש על ״כיבוש האדמה״?','הקמת קיבוצים על קרקעות לאומיות','הקמת עיירות פיתוח|הקמת המושבות|הקמת כפרי אירוח','הדגש על ״כיבוש האדמה״ הוביל להקמת קיבוצים על קרקעות לאומיות של קק״ל.'],
['ציונות','מה אפיין את העלייה החמישית?','החרדה מפני המשטרים הפשיסטיים','החשיבות שבעבודת האדמה ועבודת הכפיים|הברון רוטשילד שהשקיע במושבות סכומים גדולים בשיטה שנקראה שיטת הפקידות|הגעתה לארץ של האונייה ״רוסלן״ שעל סיפונה היו מעל 600 עולים','העלייה החמישית (1932–1939) הגיעה בעיקר בגלל החשש מהמשטרים הפשיסטיים, ובמיוחד מעליית הנאצים בגרמניה.'],
['ציונות','מה היה בסיס רעיון הקבוצה שהתגלגל והפך לימים לרעיון הקיבוץ?','התיישבות משותפת ועיבוד משותף של חלקות האדמה','כיבוש האדמה והפיכתה לאדמה חקלאית|כיבוש האדמה ובניית מבני מגורים בה|התיישבות משותפת וחלוקת האדמה לחלקות','רעיון הקבוצה: התיישבות משותפת ועיבוד משותף של האדמה. ממנו התפתח הקיבוץ.'],
['ציונות','מה היה כינוייה של פתח תקווה?','אם המושבות','אחוזת בית|המושבה הראשונה|משכנות שאננים','פתח תקווה מכונה ״אם המושבות״.'],
['ציונות','מה עשתה ועדת אונסקו״פ?','המליצה על תכנית החלוקה','הוועדה המיוחדת של האו״ם לענייני כלכלה במזרח התיכון|החליטה למסור למדינה היהודית את מרבית שטחי הנגב|דנה בבעיית הפליטים היהודים','ועדת אונסקו״פ של האו״ם המליצה ב-1947 על חלוקת הארץ, ובעקבותיה התקבלה תוכנית החלוקה.'],
['ציונות','מה הייתה מטרתה של ועדת פיל?','הצעת פתרון לסכסוך הערבי-יהודי המתהווה','קביעת קריטריונים לעלייה בתקופת העלייה השנייה|בדיקת סיבות פריצתה של מלחמת העולם הראשונה|הוועדה אשר גיבשה את הסכמי ההפוגה הראשונה במלחמת העצמאות','ועדת פיל (1936–1937) נשלחה להציע פתרון לסכסוך בין היהודים לערבים, והציעה לראשונה לחלק את הארץ.'],
['ציונות','מה נקבע בספר הלבן השלישי?','שבארץ תקום מדינה דו-לאומית','כי בפלסטינה תקום מדינה יהודית|כי בפלסטינה תקום מדינה יהודית לצד מדינה ערבית|כי בפלסטינה תקום מדינה ערבית','הספר הלבן השלישי (1939) קבע שתוך עשר שנים תקום בארץ מדינה דו-לאומית, והגביל מאוד את העלייה.'],

      const o=$('#overtake');
      if(passed.length){o.innerHTML=`עקפת את ${passed.slice(0,3).map(esc).join(', ')}${passed.length>3?' ועוד '+(passed.length-3):''}!<small>אתה עכשיו במקום ${nr+1} מתוך ${after.length}</small>`;o.hidden=false;setTimeout(()=>{SFX.combo(10);const r=o.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,60,10,['#f2a01c','#f5c33b','#ffe07a','#d9443a'])},900)}
      else if(nr>0){const a=after[nr-1];o.innerHTML=`מקום ${nr+1} מתוך ${after.length}<small>עוד ${a.xp-after[nr].xp+1} XP כדי לעקוף את ${esc(a.name)}</small>`;o.hidden=false}
      else if(after.length>1){o.innerHTML=`אתה במקום הראשון!<small>${esc(after[1].name)} במרחק ${after[0].xp-after[1].xp} XP</small>`;o.hidden=false}})}
  $('#trophy').innerHTML=TROPHY;
  const t=$('#doneTitle');t.className=perfect?'perfect':'';
  t.textContent=perfect?'שיעור מושלם!':acc>=80?'השיעור הושלם!':acc>=50?'סיימת! עוד קצת תרגול':'סיימת! כל טעות היא למידה';
  $('#doneSub').textContent=(pathMsg||((L.topic?L.topic+' · ':'')+L.total+' שאלות'))+(perfect?' · +10 XP בונוס שלמות':'');
  if(ctx&&ctx.t==='review'&&!ctx.replay&&!perfect)t.textContent='בחינה חוזרת הושלמה!';
  $('#again').textContent=ctx?(typeAt(PATH.done.length)==='review'?'לבחינה החוזרת':'לסבב הבא'):'שיעור נוסף';
  const mm=Math.floor(secs/60),ss=String(secs%60).padStart(2,'0');
  $('#stats').innerHTML=[['XP','#f2a01c','xp'],['דיוק','#3c9a3f','acc'],['רצף שיא','#d9443a','cmb'],['זמן','#3b82c4','tm']].map(([n,c,id])=>`<div class="stat" style="--c:${c}"><span>${n}</span><b id="s-${id}">0</b></div>`).join('');
  setTimeout(()=>countUp($('#s-xp'),L.xp,'',true),1100);countUp($('#s-acc'),acc,'%');countUp($('#s-cmb'),L.maxCombo,'');$('#s-tm').textContent=mm+':'+ss;
  const w=[...L.wrong.values()];
  $('#redo').hidden=!w.length;
  $('#review').innerHTML=w.length?'<h3>מה כדאי לחזור עליו</h3>'+w.map(x=>`<div class="rv"><strong>${esc(x.item[1])}</strong><span class="p">${esc(x.picked)}</span><span class="a">${esc(x.item[2])}</span><span class="w">${esc(x.item[4])}</span></div>`).join(''):'';
  setTimeout(()=>{SFX.win(perfect);buzz([30,60,30]);rain();const r=$('#trophy').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,perfect?80:45,10,perfect?['#f5c33b','#ffe07a','#f2a01c','#fff']:null)},250);
  $('#again').focus({preventScroll:true});
}
$('#again').onclick=()=>{if(L.ctx){if(buildRound())startPathRound();else show('home')}else{show('home');launch(L.topic)}};
$('#redo').onclick=()=>startLesson(shuffle([...L.wrong.values()].map(x=>x.item)),L.topic,null);
$('#toHome').onclick=()=>show('home');

/* ---------- KEYS ---------- */
document.addEventListener('keydown',e=>{
  if($('.modal'))return;
  if($('#lesson').hidden)return;
  const k={'1':0,'2':1,'3':2,'4':3}[e.key];
  if(k!==undefined&&k<L.opts.length){choose(k);return}
  if(e.key==='Enter'){e.preventDefault();$('#check').click()}
});

drawSnd();drawLen();drawHome();drawXp();pollBoard(true);
if(store.get('bq-adopt',0))adoptAcct();
else if(ME)pullMe().then(syncMe);
(()=>{const q=new URLSearchParams(location.search).get('code');if(!q)return;history.replaceState(null,'',location.pathname);codeModal(q.toUpperCase())})();
</script>
</body>
